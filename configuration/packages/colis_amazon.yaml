# ══════════════════════════════════════════════════════════════════════
#  Package « Colis Amazon » — suivi des commandes Amazon.fr pour la carte Colis
#
#  Amazon n'ouvre pas les commandes de ses clients aux autres applications :
#  ce package lit donc les e-mails de suivi qu'Amazon.fr vous envoie (commandé,
#  expédié, en cours de livraison, livré, point de retrait, retard, retour,
#  remboursement…) et tient à jour la liste To-do « Colis Amazon », affichée
#  par la carte Colis. Les e-mails restent dans votre boîte, non lus.
#
#  Avant de copier ce fichier :
#   1. Paramètres → Appareils et services → Ajouter une intégration → Local To-do,
#      nom « Colis Amazon » : l'entité doit être todo.colis_amazon.
#   2. Ajouter une intégration → IMAP, avec votre boîte mail (Gmail : serveur
#      imap.gmail.com, port 993, et un mot de passe d'application). Dans
#      « Recherche », remplacez UnSeen UnDeleted par : FROM amazon.fr
#   3. Copiez ce fichier dans /config/packages/colis_amazon.yaml (le dossier des
#      packages : voir configuration/packages/ma_maison.yaml), puis Outils → YAML
#      → « Vérifier la configuration » et redémarrez.
#
#  Seuls les e-mails d'Amazon.fr en français sont reconnus. Les colis livrés
#  quittent la liste la nuit suivante, ceux sans nouvelles au bout de 3 semaines.
# ══════════════════════════════════════════════════════════════════════

automation:
  - id: ma_maison_colis_amazon_e_mails
    alias: Colis Amazon — e-mails reçus
    description: "Quand un e-mail d'Amazon.fr arrive dans la boîte suivie par l'intégration IMAP, lit son texte et met à jour la liste « Colis Amazon » affichée par la carte Colis du tableau Ma Maison."
    mode: queued
    max: 30
    triggers:
      # Envoyé par l'intégration IMAP pour chaque nouvel e-mail qui correspond à sa
      # recherche (FROM amazon.fr), et pour le dernier e-mail au démarrage.
      - trigger: event
        event_type: imap_content
    conditions:
      - condition: template
        value_template: "{{ '@amazon.fr' in (trigger.event.data.sender | default('') | lower) }}"
    actions:
      # Le texte n'est dans l'événement que si l'option « texte » de l'intégration
      # IMAP est cochée ; sinon on le lit avec imap.fetch (sans marquer l'e-mail comme lu).
      - if:
          - condition: template
            value_template: "{{ (trigger.event.data.text | default('') | length) > 200 }}"
        then:
          - action: script.colis_amazon_analyser_email
            data:
              date_mail: '{{ trigger.event.data.date }}'
              sujet: '{{ trigger.event.data.subject }}'
              texte: '{{ trigger.event.data.text }}'
        else:
          - action: imap.fetch
            continue_on_error: true
            data:
              entry: '{{ trigger.event.data.entry_id }}'
              uid: '{{ trigger.event.data.uid }}'
            response_variable: mail
          - action: script.colis_amazon_analyser_email
            data:
              date_mail: '{{ trigger.event.data.date }}'
              sujet: '{{ mail.subject if (mail is defined and mail.subject is defined) else trigger.event.data.subject }}'
              texte: "{{ mail.text if (mail is defined and mail.text is defined) else '' }}"

  - id: ma_maison_colis_amazon_menage
    alias: Colis Amazon — ménage de nuit
    description: "Chaque nuit, retire de la liste « Colis Amazon » les colis livrés ou retirés depuis plus de 12 h, et ceux sans nouvelles depuis 3 semaines (e-mail manqué). Les éléments ajoutés à la main (sans date de mise à jour) ne sont pas touchés."
    mode: single
    triggers:
      - trigger: time
        at: '04:00:00'
    actions:
      - action: todo.get_items
        target:
          entity_id: todo.colis_amazon
        data:
          status:
            - needs_action
            - completed
        response_variable: lst
      # Livrés ou retirés depuis plus de 12 h, ou sans nouvelles depuis 504 h (3 semaines).
      - variables:
          a_supprimer: |-
            {%- set ns = namespace(l=[]) -%}
            {%- for it in lst['todo.colis_amazon']['items'] -%}
            {%- set r = (it.description | default('', true)) | regex_findall('Mis à jour : ([^\n]+)') -%}
            {%- set maj = as_datetime(r[0]) if r else none -%}
            {%- if maj -%}
            {%- set h = (now() - maj).total_seconds() / 3600 -%}
            {%- if (it.status == 'completed' and h > 12) or h > 504 -%}{%- set ns.l = ns.l + [it.uid] -%}{%- endif -%}
            {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
      - repeat:
          for_each: '{{ a_supprimer }}'
          sequence:
            - action: todo.remove_item
              target:
                entity_id: todo.colis_amazon
              data:
                item: '{{ repeat.item }}'

script:
  colis_amazon_analyser_email:
    alias: Colis Amazon — analyser un e-mail
    description: "Met à jour la liste « Colis Amazon » à partir d'un e-mail d'Amazon.fr (commandé, expédié, en cours de livraison, livré, point de retrait, retard, retour…). Appelé par l'automatisation « Colis Amazon — e-mails reçus » ; peut aussi être lancé à la main avec le sujet et le texte d'un e-mail."
    icon: mdi:package-variant-closed
    mode: queued
    max: 30
    fields:
      sujet:
        name: Sujet
        description: Sujet de l'e-mail Amazon.fr
        required: true
        selector:
          text: {}
      texte:
        name: Texte
        description: Texte brut de l'e-mail
        selector:
          text:
            multiline: true
      date_mail:
        name: Date
        description: Date de réception (ISO 8601)
        selector:
          text: {}
    sequence:
      # 1. Lecture de l'e-mail : statut, n° de commande, article, date prévue,
      #    point de retrait et son code, transporteur, code livreur.
      - variables:
          liste: todo.colis_amazon
          a: |-
            {%- set s = (sujet | default('') | string) | replace('\u00a0', ' ') | regex_replace('\s+', ' ') | trim -%}
            {%- set t = (texte | default('') | string) | replace('\r', '') -%}
            {%- set l = s | lower -%}
            {%- set tl = t | lower -%}
            {%- set d0 = as_datetime(date_mail | default('') | string) if date_mail else none -%}
            {%- set dm = (d0 | as_local) if d0 else now() -%}
            {%- if l.startswith('commandé') -%}{%- set st = 'commande' -%}
            {%- elif l.startswith('expédié') -%}{%- set st = 'expedie' -%}
            {%- elif l.startswith('en cours de livraison') or l.startswith('arrivée aujourd') or l.startswith('arrive aujourd') -%}{%- set st = 'en_livraison' -%}
            {%- elif l.startswith('livré') -%}{%- set st = 'livre' -%}
            {%- elif l.startswith('tentative de livraison') -%}{%- set st = 'tentative' -%}
            {%- elif l.startswith('mise à jour concernant la livraison') -%}{%- set st = 'retard' if 'retard' in tl else 'date' -%}
            {%- elif l.startswith('mise à jour de la date de livraison') -%}{%- set st = 'date' -%}
            {%- elif l.startswith('colis prêt pour le retrait') -%}{%- set st = 'a_retirer' -%}
            {%- elif l.startswith('collecté') -%}{%- set st = 'retire' -%}
            {%- elif l.startswith('article annulé') or l.startswith('articles annulés') or l.startswith('commande annulée') -%}{%- set st = 'annule' -%}
            {%- elif l.startswith('votre retour de') or l.startswith('votre confirmation de dépôt de retour') -%}{%- set st = 'retour' -%}
            {%- elif l.startswith('votre remboursement') -%}{%- set st = 'rembourse' -%}
            {%- else -%}{%- set st = 'ignore' -%}{%- endif -%}
            {%- set cm = (t ~ ' ' ~ s) | regex_findall('\d{3}-\d{7}-\d{7}') -%}
            {%- set commande = cm[0] if cm else '' -%}
            {%- set q = s | regex_findall('[«"“]\s*(.+?)\s*[»"”]') -%}
            {%- if q -%}{%- set ps = q[0] -%}
            {%- elif l.startswith('collecté') and ':' in s -%}{%- set ps = s.split(':', 1)[1] -%}
            {%- elif l.startswith('votre retour de ') -%}{%- set ps = s[16:] -%}
            {%- elif (l.startswith('votre remboursement') or l.startswith('votre confirmation de dépôt')) and ' pour ' in s -%}{%- set ps = s.split(' pour ', 1)[1] -%}
            {%- else -%}{%- set ps = '' -%}{%- endif -%}
            {%- set ps = ps | regex_replace('(\s*(\.{3,}|…))+\s*$', '') | trim -%}
            {%- set pbl = t | regex_findall('(?m)^\* (.+)$') -%}
            {%- set pb = (pbl[0] | trim) if pbl else '' -%}
            {%- if ps -%}{%- set nom = ps -%}
            {%- elif pb -%}{%- set nom = (pb[:40].rsplit(' ', 1)[0] if pb | length > 40 else pb) | regex_replace('[\s|,;:-]+$', '') -%}
            {%- else -%}{%- set nom = 'Colis Amazon' ~ ((' ' ~ commande) if commande else '') -%}{%- endif -%}
            {%- set il = t | regex_findall('(?m)^[ \t]*((?:Livraison prévue|Arrive |Arrivée |Livré maintenant|Livré le|Livré aujourd|Retrait avant|Tentative de livraison le|Collecte effectuée|Nouvelle date|Date de livraison)[^\n]*)$') -%}
            {%- set info = ((il[0] | trim) | regex_replace('^Livré maintenant le', 'Livraison prévue le')) if il else '' -%}
            {%- if st == 'retour' -%}
            {%- set rr = t | regex_findall('[ÀA] retourner avant le\s*:?\s*\n+\s*([^\n]+)') -%}
            {%- set info = ('À renvoyer avant le ' ~ (rr[0] | trim | replace(',', ''))) if rr else ('Retour déposé' if 'dépôt' in l else 'Retour accepté') -%}
            {%- endif -%}
            {%- set lm = t | regex_findall('(?m)^[ \t]*((?:Amazon Locker|Amazon Counter|Locker|Point [Rr]elais|Point de retrait|Consigne)[^\n]*)$') -%}
            {%- set lieu = (lm[0] | regex_replace('\s+', ' ') | regex_replace('\s*,\s*\d{5}\s*$', '') | regex_replace('\s+France\s*$', '') | trim) if lm else '' -%}
            {%- set km = t | regex_findall('code de retrait est\s+(\d{4,8})') -%}
            {%- set code = km[0] if km else '' -%}
            {%- set trm = t | regex_findall('(Chronopost|Colissimo|DPD|UPS|GLS|DHL|Relais Colis|Mondial Relay|La Poste|TNT|FedEx|Colis Privé)') -%}
            {%- set transporteur = trm[0] if trm else '' -%}
            {%- set otp = 'oui' if ('mot de passe à usage unique' in tl or 'mot de passe à usage unique' in l) else '' -%}
            {%- set src = info | lower -%}
            {%- set base = dm.date() -%}
            {%- set ns = namespace(due='') -%}
            {%- if st in ['commande', 'expedie', 'en_livraison', 'retard', 'date', 'a_retirer', 'retour'] and src -%}
            {%- set mm = src | regex_findall('(\d{1,2})(?:er)?\s+(janv\.?|janvier|févr\.?|février|fevrier|mars|avr\.?|avril|mai|juin|juil\.?|juillet|août|aout|sept\.?|septembre|oct\.?|octobre|nov\.?|novembre|déc\.?|décembre|decembre)(?:\s+(\d{4}))?') -%}
            {%- if mm -%}
            {%- set tok = mm[0][1] -%}
            {%- set key = tok[:4] if tok[:3] == 'jui' else tok[:3] -%}
            {%- set mo = {'jan': 1, 'fév': 2, 'fev': 2, 'mar': 3, 'avr': 4, 'mai': 5, 'juin': 6, 'juil': 7, 'aoû': 8, 'aou': 8, 'sep': 9, 'oct': 10, 'nov': 11, 'déc': 12, 'dec': 12}[key] -%}
            {%- set y = (mm[0][2] | int) if mm[0][2] else (base.year + (1 if mo < base.month - 6 else 0)) -%}
            {%- set ns.due = '%04d-%02d-%02d' | format(y, mo, mm[0][0] | int) -%}
            {%- elif 'aujourd' in src -%}{%- set ns.due = base.isoformat() -%}
            {%- elif 'après-demain' in src -%}{%- set ns.due = (base + timedelta(days=2)).isoformat() -%}
            {%- elif 'demain' in src -%}{%- set ns.due = (base + timedelta(days=1)).isoformat() -%}
            {%- else -%}
            {%- for j in ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'] -%}
            {%- if ns.due == '' and j in src -%}{%- set ns.due = (base + timedelta(days=((loop.index0 - base.weekday()) % 7))).isoformat() -%}{%- endif -%}
            {%- endfor -%}
            {%- endif -%}
            {%- endif -%}
            {%- set labels = {'commande': 'Commandé', 'expedie': 'Expédié', 'en_livraison': 'En cours de livraison', 'livre': 'Livré', 'tentative': 'Tentative de livraison', 'retard': 'En retard', 'a_retirer': 'À retirer', 'retire': 'Retiré', 'retour': 'Retour en cours'} -%}
            {{ {'statut': st, 'label': labels.get(st, ''), 'commande': commande, 'produit': ps, 'nom': nom, 'info': info, 'lieu': lieu, 'code': code, 'transporteur': transporteur, 'otp': otp, 'due': ns.due, 'date': dm.isoformat()} }}
      - alias: Ignorer les e-mails qui ne concernent pas un colis
        condition: template
        value_template: "{{ a.statut != 'ignore' }}"
      # 2. Le colis est-il déjà dans la liste ? (même n° de commande et même article)
      - action: todo.get_items
        target:
          entity_id: todo.colis_amazon
        data:
          status:
            - needs_action
            - completed
        response_variable: lst
      - variables:
          m: |-
            {%- set items = (lst[liste]['items'] if liste in lst else []) -%}
            {%- set pp = (a.produit | lower)[:18] -%}
            {%- set ns = namespace(found=none, cands=[]) -%}
            {%- for it in items -%}
            {%- set d = it.description | default('', true) -%}
            {%- set sm = (it.summary | default('', true)) | lower -%}
            {%- set n = [pp | length, sm | length] | min -%}
            {%- set same_prod = pp != '' and n >= 6 and sm[:n] == pp[:n] -%}
            {%- set same_order = a.commande != '' and ('Commande : ' ~ a.commande) in d -%}
            {%- if same_order -%}{%- set ns.cands = ns.cands + [it.uid] -%}{%- endif -%}
            {%- if ns.found is none and ((same_order and (pp == '' or same_prod)) or (a.commande == '' and same_prod)) -%}{%- set ns.found = it -%}{%- endif -%}
            {%- endfor -%}
            {%- set f = ns.found -%}
            {%- set fd = (f.description | default('', true)) if f else '' -%}
            {%- set prev_maj = (fd | regex_findall('Mis à jour : ([^\n]+)') | first) if 'Mis à jour : ' in fd else '' -%}
            {%- set pm = as_datetime(prev_maj) if prev_maj else none -%}
            {%- set plus_ancien = (pm is not none) and (as_datetime(a.date) < pm) -%}
            {%- set prev_label = (fd | regex_findall('Statut : ([^\n]+)') | first) if 'Statut : ' in fd else '' -%}
            {%- set prev_info = (fd | regex_findall('Info : ([^\n]+)') | first) if 'Info : ' in fd else '' -%}
            {%- set suppr = ([f.uid] if f else ([] if a.produit else ns.cands)) if a.statut in ['annule', 'rembourse'] else [] -%}
            {{ {'uid': f.uid if f else '', 'plus_ancien': plus_ancien, 'prev_label': prev_label, 'prev_info': prev_info, 'a_supprimer': suppr} }}
      - alias: Ignorer un e-mail plus ancien que la dernière mise à jour du colis
        condition: template
        value_template: '{{ not m.plus_ancien }}'
      # 3. Description lue par la carte : une ligne « Clé : valeur » par information.
      - variables:
          desc: |-
            {%- set lab = a.label if a.statut != 'date' else (m.prev_label or 'Commandé') -%}
            {%- set info = a.info or (m.prev_info if a.statut == 'date' else '') -%}
            {%- set lines = ['Statut : ' ~ lab] -%}
            {%- if info -%}{%- set lines = lines + ['Info : ' ~ info] -%}{%- endif -%}
            {%- if a.lieu -%}{%- set lines = lines + ['Lieu : ' ~ a.lieu] -%}{%- endif -%}
            {%- if a.code -%}{%- set lines = lines + ['Code de retrait : ' ~ a.code] -%}{%- endif -%}
            {%- if a.otp -%}{%- set lines = lines + ['Code livreur : à donner au livreur (app Amazon)'] -%}{%- endif -%}
            {%- if a.transporteur -%}{%- set lines = lines + ['Transporteur : ' ~ a.transporteur] -%}{%- endif -%}
            {%- if a.commande -%}{%- set lines = lines + ['Commande : ' ~ a.commande] -%}{%- endif -%}
            {%- set lines = lines + ['Mis à jour : ' ~ a.date] -%}
            {{ lines | join('\n') }}
      - choose:
          - alias: 'Annulé ou remboursé : retirer le colis'
            conditions:
              - condition: template
                value_template: "{{ a.statut in ['annule', 'rembourse'] }}"
            sequence:
              - repeat:
                  for_each: '{{ m.a_supprimer }}'
                  sequence:
                    - action: todo.remove_item
                      target:
                        entity_id: todo.colis_amazon
                      data:
                        item: '{{ repeat.item }}'
          - alias: 'Colis déjà suivi : mettre à jour'
            conditions:
              - condition: template
                value_template: "{{ m.uid != '' }}"
            sequence:
              - action: todo.update_item
                target:
                  entity_id: todo.colis_amazon
                data: |-
                  {%- set d = {'item': m.uid, 'description': desc, 'status': 'completed' if a.statut in ['livre', 'retire'] else 'needs_action'} -%}
                  {%- if a.due -%}{%- set d = dict(d, due_date=a.due) -%}{%- endif -%}
                  {{ d }}
          - alias: "Nouveau colis : l'ajouter"
            conditions:
              - condition: template
                value_template: "{{ a.statut not in ['livre', 'retire'] }}"
            sequence:
              - action: todo.add_item
                target:
                  entity_id: todo.colis_amazon
                data: |-
                  {%- set d = {'item': a.nom, 'description': desc} -%}
                  {%- if a.due -%}{%- set d = dict(d, due_date=a.due) -%}{%- endif -%}
                  {{ d }}
