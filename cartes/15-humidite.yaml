# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Humidité
#  Goutte animée avec le taux d'humidité et un avis (air sec, confortable, humide…).
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - sensor.chambre_humidite
#  Nécessite : button-card (HACS)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:button-card
entity: sensor.chambre_humidite
name: Humidité
custom_fields:
  body: |-
    [[[
    const v = entity ? parseFloat(entity.state) : NaN;
    const ok = !isNaN(v);
    let lab = '', col = 'var(--secondary-text-color)';
    if (ok) { if (v < 35) { lab = 'Air sec'; col = '#f0b46c'; } else if (v <= 60) { lab = 'Confortable'; col = '#5fd6b4'; } else if (v <= 70) { lab = 'Un peu humide'; col = '#7cc0ff'; } else { lab = 'Très humide'; col = '#8ab4ff'; } }
    const val = ok ? v.toLocaleString('fr-FR', {maximumFractionDigits: 0}) + ' %' : 'Indisponible';
    return `<div class='hh'><div class='hh-head'><div class='hh-ico'><div class='hh-drop'><div class='hh-water'><i></i></div><div class='hh-shine'></div></div></div>`
     + `<div class='hh-txt'><div class='hh-name'>Humidité</div><div class='hh-val${ok ? ' g' : ''}'>${val}</div></div></div>`
     + `<div class='hh-foot'>${ok ? `<div class='hh-lab' style='color:${col}'>${lab}</div>` : ''}<div class='hh-bar${ok ? '' : ' ko'}'>${ok ? "<div class='hh-zone'></div><div class='hh-mark'></div>" : ''}</div></div></div>`;
    ]]]
extra_styles: |-
  .hh{display:flex;flex-direction:column;justify-content:space-between;height:100%;box-sizing:border-box;padding:10px 12px 12px;text-align:left;}
  .hh-head{display:flex;align-items:center;gap:10px;min-width:0;}
  .hh-ico{position:relative;flex:0 0 36px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--hh-bg,rgba(127,127,127,.15));transition:background .8s;}
  .hh-drop{position:relative;width:16px;height:21px;overflow:hidden;clip-path:path('M8 0C8 0 16 9.6 16 14C16 18 12.4 21 8 21C3.6 21 0 18 0 14C0 9.6 8 0 8 0Z');background:rgba(255,255,255,.16);}
  .hh-water{position:absolute;left:0;right:0;bottom:0;height:calc(var(--hh-v,0) * 100%);background:linear-gradient(180deg,var(--hh-c1,#7cc4ff),var(--hh-c2,#2f86de));transition:height 1.6s ease;}
  .hh-water i{position:absolute;left:0;top:-3px;width:200%;height:6px;background:radial-gradient(ellipse 5px 3px at 50% 100%,var(--hh-c1,#7cc4ff) 98%,transparent) 0 0/10px 6px repeat-x;animation:hhwave 1.8s linear infinite;}
  .hh-shine{position:absolute;left:4px;top:9px;width:3px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(16deg);}
  .hh-txt{min-width:0;display:flex;flex-direction:column;align-items:flex-start;}
  .hh-name{font-size:14px;font-weight:500;line-height:20px;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hh-val{font-size:16px;font-weight:700;line-height:20px;color:var(--secondary-text-color);white-space:nowrap;}
  .hh-val.g{display:inline-block;background:linear-gradient(90deg,var(--hh-c1),var(--hh-c2),var(--hh-c3),var(--hh-c1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:hhflow 5s linear infinite;}
  .hh-foot{display:flex;flex-direction:column;gap:6px;}
  .hh-lab{font-size:12px;font-weight:600;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hh-bar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,#e8a65c 0%,#e8c45c 28%,#4cc9a8 40%,#4cc9a8 60%,#5fb0ff 72%,#3f7fe0 100%);}
  .hh-bar.ko{background:rgba(127,127,127,.22);}
  .hh-zone{position:absolute;left:40%;width:20%;top:-3px;bottom:-3px;border-radius:5px;border:1px dashed rgba(255,255,255,.55);box-sizing:border-box;}
  .hh-mark{position:absolute;top:50%;left:calc(var(--hh-v,0) * 100%);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;box-sizing:border-box;border:2px solid var(--card-background-color,#fff);background:var(--hh-c1,#7cc4ff);box-shadow:0 0 8px var(--hh-c1,#7cc4ff);transition:left 1.6s ease;animation:hhpulse 2s ease-in-out infinite;}
  @keyframes hhwave{from{transform:translateX(0);}to{transform:translateX(-10px);}}
  @keyframes hhpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
  @keyframes hhflow{from{background-position:0% 50%;}to{background-position:200% 50%;}}
  @media (prefers-reduced-motion: reduce){.hh *{animation:none !important;}}
grid_options:
  columns: 6
  rows: 2
show_icon: false
show_name: false
styles:
  card:
    - padding: '0'
    - height: 100%
    - overflow: hidden
    - --hh-v: '[[[ return String(isNaN((entity ? parseFloat(entity.state) : NaN)) ? 0 : Math.max(0, Math.min(1, (entity ? parseFloat(entity.state) : NaN) / 100)).toFixed(3)); ]]]'
    - --hh-c1: "[[[ return String(isNaN((entity ? parseFloat(entity.state) : NaN)) ? '#9aa4af' : ((entity ? parseFloat(entity.state) : NaN) < 35 ? '#ffc27a' : ((entity ? parseFloat(entity.state) : NaN) <= 60 ? '#7fe3c6' : '#8fc8ff'))); ]]]"
    - --hh-c2: "[[[ return String(isNaN((entity ? parseFloat(entity.state) : NaN)) ? '#5d6670' : ((entity ? parseFloat(entity.state) : NaN) < 35 ? '#e8892c' : ((entity ? parseFloat(entity.state) : NaN) <= 60 ? '#25a27f' : '#2f78de'))); ]]]"
    - --hh-c3: "[[[ return String(isNaN((entity ? parseFloat(entity.state) : NaN)) ? '#c3c9d0' : ((entity ? parseFloat(entity.state) : NaN) < 35 ? '#ffdcae' : ((entity ? parseFloat(entity.state) : NaN) <= 60 ? '#b4f2e0' : '#c3e0ff'))); ]]]"
    - --hh-bg: "[[[ return String(isNaN((entity ? parseFloat(entity.state) : NaN)) ? 'rgba(127,127,127,.15)' : ((entity ? parseFloat(entity.state) : NaN) < 35 ? 'rgba(232,166,92,.18)' : ((entity ? parseFloat(entity.state) : NaN) <= 60 ? 'rgba(76,201,168,.18)' : 'rgba(95,168,255,.18)'))); ]]]"
  custom_fields:
    body:
      - width: 100%
      - height: 100%
  grid:
    - grid-template-areas: '"body"'
    - grid-template-columns: 1fr
    - grid-template-rows: 1fr
    - height: 100%
tap_action:
  action: more-info
