      - height: 56px
      - border-radius: 4px
      - overflow: hidden
      - z-index: '1'
      - pointer-events: none
    vd:
      - position: absolute
      - left: calc(172px + calc((100% - 172px - 12px - 18px) / 4) + 6px)
      - bottom: 16px
      - width: calc((100% - 172px - 12px - 18px) / 4)
      - height: 34px
      - z-index: '2'
    vu:
      - position: absolute
