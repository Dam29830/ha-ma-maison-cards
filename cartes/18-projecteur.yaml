# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Vidéoprojecteur
#  Écran animé qui s'allume avec l'appli en cours, lecture / pause, volume,
#  marche / arrêt et consommation estimée du jour.
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - media_player.projecteur
#    - media_player.projecteur_cast
#    - sensor.projecteur_puissance_estimee
#    - sensor.projecteur_energie_aujourd_hui
#  Nécessite : button-card (HACS) + Android TV Remote et Google Cast + capteurs projecteur (package)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:button-card
entity: media_player.projecteur
name: Projecteur
custom_fields:
  info: |-
    [[[
    const p = variables.pj;
    const st = p.st;
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const M = {on: 'Allumé', idle: 'Allumé', playing: 'Allumé', paused: 'Allumé', off: 'Éteint', standby: 'En veille', unavailable: 'Indisponible', unknown: 'Indisponible'};
    let t = M[st] || 'Allumé';
    let d = p.on ? (p.name || ((entity && entity.attributes.friendly_name) || 'Vidéoprojecteur')) : ((entity && entity.attributes.friendly_name) || 'Vidéoprojecteur');
    if (p.on && p.kind === 'ha') { t = 'Diffusion'; d = 'Home Assistant' + (p.title ? ' · ' + p.title : ''); }
    else if (p.on && (p.playing || p.paused || p.buffering)) { t = p.playing ? 'Lecture' : (p.paused ? 'En pause' : 'Chargement…'); if (p.title) d = p.title + (p.sub2 ? ' · ' + p.sub2 : ''); }
    else if (p.on && p.title) d = d + ' · ' + p.title;
    const c = p.playing ? '#4cc9a8' : (p.on ? '#8fd0ff' : (['unavailable','unknown'].includes(st) ? 'var(--secondary-text-color)' : '#8fb3d9'));
    return `<div class='hd-info' style='left:172px;right:12px;top:14px'><div class='hd-name'>Projecteur</div><div class='hd-title' style='color:${c}'>${t}</div><div class='hd-sub' style='white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>${esc(d)}</div></div>`;
    ]]]
  pp:
    card:
      color: var(--primary-text-color)
      icon: mdi:play-pause
      show_name: false
      styles:
        card:
          - height: 34px
          - width: 100%
          - padding: 0 6px
          - border-radius: 12px
          - background: rgba(255,255,255,0.08)
          - border: 1px solid rgba(255,255,255,0.16)
          - box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)
          - transition: background .4s, border-color .4s, box-shadow .4s
        grid:
          - grid-template-areas: '"i"'
          - grid-template-columns: min-content
          - grid-template-rows: 1fr
          - justify-content: center
          - align-items: center
        icon:
          - width: 18px
          - height: 18px
        img_cell:
          - width: 18px
          - height: 18px
      tap_action:
        action: perform-action
        perform_action: media_player.media_play_pause
        target:
          entity_id: media_player.projecteur
      type: custom:button-card
  pw:
    card:
      color: var(--primary-text-color)
      icon: mdi:power
      show_name: false
      styles:
        card:
          - height: 34px
          - width: 100%
          - padding: 0 6px
          - border-radius: 12px
          - background: rgba(255,255,255,0.08)
          - border: 1px solid rgba(255,255,255,0.16)
          - box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)
          - transition: background .4s, border-color .4s, box-shadow .4s
        grid:
          - grid-template-areas: '"i"'
          - grid-template-columns: min-content
          - grid-template-rows: 1fr
          - justify-content: center
          - align-items: center
        icon:
          - width: 18px
          - height: 18px
        img_cell:
          - width: 18px
          - height: 18px
      tap_action:
        action: perform-action
        perform_action: media_player.toggle
        target:
          entity_id: media_player.projecteur
      type: custom:button-card
  scene: <div class="hd-scene"><div class="pj-screen"><div class="pj-img"></div><div class="pj-noise"></div></div><div class="pj-beam"></div><div class="pj-beam-art"></div><svg class="pj-cable" viewBox="0 0 172 150" aria-hidden="true"><path class="c0" d="M33 126 C33 139 38 143 47 143 L72 143 C78 143 80 140 80 136"/><path class="c1" d="M33 126 C33 139 38 143 47 143 L72 143 C78 143 80 140 80 136"/></svg><div class="pj"><div class="pj-body"></div><div class="pj-lens"><i></i></div><div class="pj-grill"></div><div class="pj-led"></div></div></div>
  vd:
    card:
      color: var(--primary-text-color)
      icon: mdi:volume-minus
      show_name: false
      styles:
        card:
          - height: 34px
          - width: 100%
          - padding: 0 6px
          - border-radius: 12px
          - background: rgba(255,255,255,0.08)
          - border: 1px solid rgba(255,255,255,0.16)
          - box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)
          - transition: background .4s, border-color .4s, box-shadow .4s
        grid:
          - grid-template-areas: '"i"'
          - grid-template-columns: min-content
          - grid-template-rows: 1fr
          - justify-content: center
          - align-items: center
        icon:
          - width: 18px
          - height: 18px
        img_cell:
          - width: 18px
          - height: 18px
      tap_action:
        action: perform-action
        perform_action: media_player.volume_down
        target:
          entity_id: media_player.projecteur
      type: custom:button-card
  vu:
    card:
      color: var(--primary-text-color)
      icon: mdi:volume-plus
      show_name: false
      styles:
        card:
          - height: 34px
          - width: 100%
          - padding: 0 6px
          - border-radius: 12px
          - background: rgba(255,255,255,0.08)
          - border: 1px solid rgba(255,255,255,0.16)
          - box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)
          - transition: background .4s, border-color .4s, box-shadow .4s
        grid:
          - grid-template-areas: '"i"'
          - grid-template-columns: min-content
          - grid-template-rows: 1fr
          - justify-content: center
          - align-items: center
        icon:
          - width: 18px
          - height: 18px
        img_cell:
          - width: 18px
          - height: 18px
      tap_action:
        action: perform-action
        perform_action: media_player.volume_up
        target:
          entity_id: media_player.projecteur
      type: custom:button-card
  scr: |-
    [[[
    const p = variables.pj;
    if (!p.on) return '';
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    let body = '';
    if (p.kind === 'ha') body = `<div class='ps ps-ha'><s>${esc(p.title || 'Home Assistant')}</s><b></b><b></b><b></b><b></b><b></b><b></b></div>`;
    else if (p.pic) body = `<div class='ps ps-art' style="background-image:url('${esc(String(p.pic).replace(/'/g, '%27'))}')"></div>`;
    else if (p.kind === 'home') body = `<div class='ps ps-home'><s></s><i></i><i></i><i></i><i></i><i></i><u></u><b></b><b></b><b></b><em></em></div>`;
    else if (p.kind === 'sys') body = `<div class='ps ps-sys'><s></s><b></b><b></b><b></b><b></b><em></em></div>`;
    else if (p.kind === 'hdmi') body = `<div class='ps ps-hdmi'><i></i><span>HDMI</span></div>`;
    else if (p.kind === 'saver') body = `<div class='ps ps-saver'><i></i><b></b><u></u></div>`;
    else if (p.name) { let h = 7; for (const ch of String(p.name)) h = (h * 31 + ch.charCodeAt(0)) % 997; h = 170 + h % 170; body = `<div class='ps ps-app' style='--h:${h}'><span>${esc(p.name)}</span>${p.title ? `<em>${esc(p.title)}</em>` : ''}</div>`; }
    if (!body) return '';
    const pause = p.paused ? `<div class='ps-pause'><i></i><i></i></div>` : '';
    const anim = p.playing ? `;animation:psbar ${p.rem.toFixed(1)}s linear forwards` : '';
    const bar = p.prog >= 0 && (p.playing || p.paused) ? `<div class='ps-bar'><i style='--p0:${p.prog.toFixed(4)}${anim}'></i></div>` : '';
    return body + pause + bar + `<div class='ps-sheen'></div>`;
    ]]]
  kw: |-
    [[[
    const p = variables.pj;
    const f = (v, d) => v.toLocaleString('fr-FR', {maximumFractionDigits: d});
    const w = isNaN(p.w) ? '—' : (p.w < 10 ? f(p.w, 1) : f(Math.round(p.w), 0)) + ' W';
    const k = isNaN(p.kwh) ? '' : f(p.kwh, p.kwh < 10 ? 2 : 1) + ' kWh auj.';
    return `<div class='kw${p.on ? ' on' : ''}'><div class='kw-w'><svg viewBox='0 0 24 24'><path d='M13 2 4 14h6l-1 8 9-12h-6l1-8z'/></svg><span>≈ ${w}</span></div>${k ? `<div class='kw-k'>${k}</div>` : ''}</div>`;
    ]]]
extra_styles: |-
  .hd-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .hd-info{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;white-space:normal;min-width:0;}
  .hd-name{font-size:13px;font-weight:600;line-height:1.25;color:var(--secondary-text-color);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hd-name.w{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .hd-title{font-size:22px;font-weight:600;line-height:1.15;color:var(--primary-text-color);transition:color .8s;}
  .hd-title.s{font-size:15.5px;}
  .hd-sub{font-size:12.5px;line-height:1.3;color:var(--secondary-text-color);}
  .hd-sub b{color:var(--primary-text-color);font-weight:600;}
  @media (prefers-reduced-motion: reduce){.hd-scene *,.hd-scene *::before,.hd-scene *::after{animation:none !important;}}
  .pj-screen{position:absolute;left:62px;top:18px;width:96px;height:56px;border-radius:4px;background:#121720;box-shadow:0 0 0 2px #2b313b,0 6px 12px rgba(0,0,0,.4);overflow:hidden;}
  .pj-img{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 35%,rgba(255,180,90,.95),rgba(255,180,90,0) 40%),radial-gradient(circle at 72% 62%,rgba(90,160,255,.9),rgba(90,160,255,0) 45%),linear-gradient(135deg,#2d3c6b,#6b3d6b);opacity:var(--pj-on,0);transition:opacity 1.6s;animation:pjimg 9s ease-in-out infinite alternate;}
  .pj-noise{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);opacity:var(--pj-on,0);}
  .pj-beam{position:absolute;left:36px;top:18px;width:124px;height:84px;clip-path:polygon(0 76%,21% 0,100% 0,100% 66%,0 88%);background:linear-gradient(90deg,rgba(255,250,230,.45),rgba(255,250,230,.04));opacity:var(--pj-on,0);transition:opacity 1.2s;animation:pjflick 4s ease-in-out infinite;}
  .pj{position:absolute;left:12px;top:72px;width:42px;height:58px;}
  .pj-body{position:absolute;inset:0;border-radius:14px;background:linear-gradient(90deg,#2a2f37,#4a515c 45%,#2a2f37);box-shadow:0 6px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);}
  .pj-lens{position:absolute;left:8px;top:7px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a6574,#0b0e13 60%);box-shadow:0 0 0 3px #1a1e24,inset 0 0 6px rgba(0,0,0,.8);}
  .pj-lens i{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,#fff8e0,rgba(255,240,200,0) 70%);opacity:var(--pj-on,0);transition:opacity 1s;}
  .pj-grill{position:absolute;left:9px;right:9px;bottom:10px;height:9px;background:repeating-linear-gradient(90deg,#1b1f25 0 2px,transparent 2px 4px);opacity:.8;}
  .pj-led{position:absolute;right:8px;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--pj-led,#454c56);box-shadow:0 0 5px var(--pj-led,transparent);}
  @keyframes pjflick{0%,100%{filter:brightness(1);}50%{filter:brightness(1.18);}}
  @keyframes pjimg{0%{transform:translate(0,0) scale(1);filter:hue-rotate(0deg);}100%{transform:translate(-8%,4%) scale(1.15);filter:hue-rotate(50deg);}}
  .pj-beam-art{position:absolute;left:36px;top:18px;width:124px;height:84px;clip-path:polygon(0 76%,21% 0,100% 0,100% 66%,0 88%);background-image:var(--pj-art,none);background-size:cover;background-position:center;filter:blur(6px) saturate(1.6) brightness(1.2);opacity:calc(var(--pj-arton,0) * var(--pj-on,0) * .75);transition:opacity 1.2s;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.5),#000 40%);mask-image:linear-gradient(90deg,rgba(0,0,0,.5),#000 40%);}
  .ps{position:absolute;inset:0;overflow:hidden;}
  .ps-art{background-size:cover;background-position:center;filter:saturate(1.08) contrast(1.04);}
  .ps-sheen{position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,250,232,.18),rgba(255,250,232,0) 55%),repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 10px rgba(0,0,0,.45);}
  .ps-pause{position:absolute;inset:0;display:flex;gap:4px;align-items:center;justify-content:center;background:rgba(0,0,0,.28);}
  .ps-pause i{width:4px;height:15px;border-radius:1.5px;background:rgba(255,255,255,.95);box-shadow:0 0 4px rgba(0,0,0,.6);}
  .ps-bar{position:absolute;left:5px;right:5px;bottom:4px;height:2px;border-radius:1px;background:rgba(255,255,255,.28);overflow:hidden;}
  .ps-bar i{position:absolute;inset:0;border-radius:1px;background:#fff;transform-origin:0 50%;transform:scaleX(var(--p0,0));}
  @keyframes psbar{from{transform:scaleX(var(--p0,0));}to{transform:scaleX(1);}}
  .ps-home{background:linear-gradient(180deg,#252d3a,#11151d);}
  .ps-home s{position:absolute;left:5px;top:4px;width:24px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);}
  .ps-home i{position:absolute;top:13px;width:15px;height:9px;border-radius:2px;}
  .ps-home i:nth-of-type(1){left:5px;background:linear-gradient(135deg,#e2574c,#8f2a33);}
  .ps-home i:nth-of-type(2){left:23px;background:linear-gradient(135deg,#4c8de2,#2a4a8f);}
  .ps-home i:nth-of-type(3){left:41px;background:linear-gradient(135deg,#46c08a,#22704e);}
  .ps-home i:nth-of-type(4){left:59px;background:linear-gradient(135deg,#e2b04c,#8f6a2a);}
  .ps-home i:nth-of-type(5){left:77px;background:linear-gradient(135deg,#9a6de2,#56358f);}
  .ps-home u{position:absolute;left:3.5px;top:11.5px;width:18px;height:12px;border-radius:3px;box-sizing:border-box;border:1.2px solid rgba(255,255,255,.95);box-shadow:0 0 6px rgba(255,255,255,.5);animation:pshop 10s ease-in-out infinite;}
  @keyframes pshop{0%,16%{transform:translateX(0);}20%,36%{transform:translateX(18px);}40%,56%{transform:translateX(36px);}60%,76%{transform:translateX(54px);}80%,96%{transform:translateX(72px);}100%{transform:translateX(0);}}
  .ps-home b{position:absolute;top:27px;width:27px;height:16px;border-radius:2px;}
  .ps-home b:nth-of-type(1){left:5px;background:linear-gradient(180deg,#f2a66b 0%,#c0607a 55%,#3b2f5c 56%,#231c38);}
  .ps-home b:nth-of-type(2){left:35px;background:linear-gradient(180deg,#7fc3ea 0%,#3f7fb5 50%,#1f4466 51%,#14283d);}
  .ps-home b:nth-of-type(3){left:65px;background:linear-gradient(180deg,#a7d28c 0%,#4f8a52 50%,#2c4a2e 51%,#1a2b1b);}
  .ps-home em{position:absolute;left:5px;top:47px;width:30px;height:2.5px;border-radius:1.5px;background:rgba(255,255,255,.22);box-shadow:30px 0 0 rgba(255,255,255,.14),60px 0 0 rgba(255,255,255,.14);}
  .ps-sys{background:linear-gradient(160deg,#18202b,#0d1117);}
  .ps-sys s{position:absolute;right:0;top:0;bottom:0;width:44px;background:rgba(255,255,255,.07);}
  .ps-sys b{position:absolute;right:7px;width:30px;height:5px;border-radius:2.5px;background:rgba(255,255,255,.28);}
  .ps-sys b:nth-of-type(1){top:10px;background:rgba(143,208,255,.9);}.ps-sys b:nth-of-type(2){top:19px;}.ps-sys b:nth-of-type(3){top:28px;}.ps-sys b:nth-of-type(4){top:37px;}
  .ps-sys em{position:absolute;left:9px;top:15px;width:28px;height:24px;border-radius:4px;background:radial-gradient(circle at 40% 40%,rgba(143,208,255,.55),rgba(143,208,255,.08));}
  .ps-hdmi{background:#0b0e13;}
  .ps-hdmi i{position:absolute;inset:-25%;background:radial-gradient(circle at 30% 40%,rgba(90,200,255,.75),rgba(90,200,255,0) 42%),radial-gradient(circle at 70% 65%,rgba(255,120,90,.65),rgba(255,120,90,0) 45%),linear-gradient(135deg,#1d2b4a,#3b2142);animation:pshdmi 7s ease-in-out infinite alternate;}
  @keyframes pshdmi{from{transform:translate(0,0) scale(1);}to{transform:translate(-9%,5%) scale(1.15);}}
  .ps-hdmi span{position:absolute;left:5px;top:5px;padding:0 4px;height:10px;line-height:10px;border-radius:3px;font-size:6.5px;font-weight:700;letter-spacing:.4px;color:#fff;background:rgba(0,0,0,.45);border:.5px solid rgba(255,255,255,.35);}
  .ps-saver{background:linear-gradient(180deg,#ffb48a 0%,#f0918e 38%,#8b7cc0 72%,#4a5a9c 100%);animation:pskb 24s ease-in-out infinite alternate;}
  @keyframes pskb{from{transform:scale(1);}to{transform:scale(1.12) translate(-3%,1%);}}
  .ps-saver i{position:absolute;left:58px;top:20px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff6d0 45%,rgba(255,246,208,0) 72%);}
  .ps-saver b{position:absolute;left:-4px;right:-4px;bottom:0;height:30px;background:#5b4d86;clip-path:polygon(0 55%,18% 20%,34% 48%,52% 8%,70% 42%,84% 22%,100% 50%,100% 100%,0 100%);}
  .ps-saver u{position:absolute;left:-4px;right:-4px;bottom:0;height:18px;background:#2c2650;clip-path:polygon(0 40%,22% 70%,40% 30%,62% 75%,80% 35%,100% 60%,100% 100%,0 100%);}
  .ps-ha{background:linear-gradient(160deg,#1b2433,#0e1118);}
  .ps-ha s{position:absolute;left:0;right:0;top:0;height:9px;padding-left:5px;line-height:9px;font-size:6px;font-weight:700;text-decoration:none;color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .ps-ha b{position:absolute;width:26px;height:18px;border-radius:4px;box-sizing:border-box;background:rgba(140,170,200,.16);border:.5px solid rgba(255,255,255,.18);}
  .ps-ha b::before{content:'';position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--c,#8fd0ff);}
  .ps-ha b::after{content:'';position:absolute;left:3px;bottom:3px;width:13px;height:2.5px;border-radius:1.5px;background:rgba(255,255,255,.4);}
  .ps-ha b:nth-of-type(1){left:5px;top:13px;--c:#ffc35a;}.ps-ha b:nth-of-type(2){left:34px;top:13px;--c:#8fd0ff;}.ps-ha b:nth-of-type(3){left:63px;top:13px;--c:#4cc9a8;}.ps-ha b:nth-of-type(4){left:5px;top:34px;--c:#ff7a6b;}.ps-ha b:nth-of-type(5){left:34px;top:34px;--c:#b48cff;}.ps-ha b:nth-of-type(6){left:63px;top:34px;--c:#8fd0ff;}
  .ps-app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:radial-gradient(90% 120% at 50% 35%,hsl(var(--h,220) 45% 32%),hsl(var(--h,220) 35% 9%));}
  .ps-app span{max-width:88px;font-size:11px;font-weight:700;line-height:13px;color:#fff;letter-spacing:.2px;text-shadow:0 0 6px rgba(255,255,255,.35);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ps-app em{max-width:86px;font-style:normal;font-size:7.5px;line-height:9px;color:rgba(255,255,255,.8);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .pj-cable{position:absolute;left:0;top:0;width:172px;height:150px;overflow:visible;}
  .pj-cable path{fill:none;stroke-linecap:round;}
  .pj-cable .c0{stroke:#2b313b;stroke-width:3;}
  .pj-cable .c1{stroke:#ffd36a;stroke-width:1.6;stroke-dasharray:2 7;opacity:var(--pj-on,0);transition:opacity 1s;filter:drop-shadow(0 0 2px rgba(255,211,106,.9));animation:pjflow 1.1s linear infinite;}
  @keyframes pjflow{to{stroke-dashoffset:9;}}
  .kw{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 9px 4px 7px;border-radius:11px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.10);}
  .kw-w{display:flex;align-items:center;gap:4px;font-size:14.5px;font-weight:700;line-height:17px;color:var(--secondary-text-color);transition:color .8s;}
  .kw-w svg{width:12px;height:12px;flex:none;fill:currentColor;}
  .kw.on .kw-w{color:#ffd36a;}
  .kw.on .kw-w svg{animation:kwpulse 1.6s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(255,211,106,.8));}
  @keyframes kwpulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .kw-k{font-size:10.5px;line-height:13px;color:var(--secondary-text-color);white-space:nowrap;}
  @media (prefers-reduced-motion: reduce){#scr *,#kw *{animation:none !important;}}
grid_options:
  columns: 12
  rows: auto
show_icon: false
show_name: false
styles:
  card:
    - height: 150px
    - border-radius: 24px
    - overflow: hidden
    - padding: '0'
    - background: rgba(140,170,200,0.10)
    - backdrop-filter: blur(16px) saturate(170%)
    - -webkit-backdrop-filter: blur(16px) saturate(170%)
    - border: 1px solid rgba(255,255,255,0.16)
    - box-shadow: 0 8px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.22)
    - --pj-on: "[[[ return variables.pj.on ? '1' : '0'; ]]]"
    - --pj-led: "[[[ const p = variables.pj; return p.on ? '#5dffa0' : (['unavailable','unknown'].includes(p.st) ? '#454c56' : '#ff5a4f'); ]]]"
    - --pj-art: '[[[ const p = variables.pj.pic; return p ? ''url("'' + String(p).replace(/"/g, ''%22'') + ''")'' : ''none''; ]]]'
    - --pj-arton: "[[[ return variables.pj.pic ? '1' : '0'; ]]]"
  custom_fields:
    info:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
      - z-index: '1'
