      - bottom: 16px
      - width: calc((100% - 172px - 12px - 18px) / 4)
      - height: 34px
      - z-index: '2'
    pw:
      - position: absolute
      - left: 172px
      - bottom: 16px
      - width: calc((100% - 172px - 12px - 18px) / 4)
      - height: 34px
      - z-index: '2'
    scene:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
      - z-index: '0'
