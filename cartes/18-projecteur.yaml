  grid:
    - position: relative
tap_action:
  action: more-info
variables:
  pj: |-
    [[[
    const st = entity ? entity.state : 'unavailable';
    const ra = entity ? entity.attributes : {};
    const cs = states['media_player.projecteur_cast'];
    const ca = cs ? cs.attributes : {};
    const cst = cs ? cs.state : 'off';
    const on = !['off','unavailable','unknown','standby'].includes(st) || ['playing','paused','buffering'].includes(cst);
    const cast = on && (['playing','paused','buffering'].includes(cst) || (cst === 'idle' && ca.app_id !== 'AndroidNativeApp'));
    const id = String(ra.app_id || '').toLowerCase();
    const APPS = {"com.google.android.tvlauncher": "Écran d’accueil", "com.google.android.apps.tv.launcherx": "Écran d’accueil", "com.overdevs.at4k": "Écran d’accueil", "com.xgimi.windowsystem": "Menu XGIMI", "com.android.tv.settings": "Paramètres", "com.google.android.permissioncontroller": "Autorisations", "com.google.android.packageinstaller": "Installation", "com.droidlogic.android.tv": "Entrée HDMI", "com.google.android.backdrop": "Économiseur d’écran", "com.google.android.apps.mediashell": "Google Cast", "com.android.vending": "Play Store", "net.oqee.androidtv.store": "OQEE", "dev.trooped.tvquickbars": "TV QuickBars", "com.google.android.youtube.tv": "YouTube", "com.google.android.youtube.tvmusic": "YouTube Music", "com.netflix.ninja": "Netflix", "com.disney.disneyplus": "Disney+", "com.amazon.amazonvideo.livingroom": "Prime Video", "com.canal.android.canal": "Canal+", "tv.molotov.app": "Molotov", "fr.francetv.pluzz": "france.tv", "com.plexapp.android": "Plex", "com.spotify.tv.android": "Spotify", "org.xbmc.kodi": "Kodi", "com.apple.atve.androidtv.appletv": "Apple TV", "com.google.android.videos": "Google TV", "com.mxtech.videoplayer.ad": "MX Player"};
    const KIND = {"com.google.android.tvlauncher": "home", "com.google.android.apps.tv.launcherx": "home", "com.overdevs.at4k": "home", "com.xgimi.windowsystem": "sys", "com.android.tv.settings": "sys", "com.google.android.permissioncontroller": "sys", "com.google.android.packageinstaller": "sys", "com.droidlogic.android.tv": "hdmi", "com.google.android.backdrop": "saver", "com.google.android.tv.remote.service": "none"};
    const last = id ? id.split('.').pop() : '';
    let kind = KIND[id] || (/launcher/.test(id) ? 'home' : (/settings/.test(id) ? 'sys' : (id ? 'app' : 'none')));
    let name = (ra.app_name && ra.app_name !== ra.app_id ? ra.app_name : '') || APPS[id] || (last ? last.charAt(0).toUpperCase() + last.slice(1) : '');
    let title = cast ? String(ca.media_title || '') : '';
    if (cast) {
      if (['A078F6B0','B45F4572'].includes(ca.app_id) || /home assistant/i.test(ca.app_name || '')) { kind = 'ha'; name = 'Home Assistant'; title = title.split(':')[0].trim(); }
      else { kind = 'app'; if (ca.app_name && ca.app_name !== ca.app_id) name = ca.app_name; }
    }
    const dur = cast ? (Number(ca.media_duration) || 0) : 0;
    let pos = Number(ca.media_position) || 0;
    if (cst === 'playing' && ca.media_position_updated_at) { const u = Date.parse(ca.media_position_updated_at); if (!isNaN(u)) pos += Math.max(0, (Date.now() - u) / 1000); }
    const ps = states['sensor.projecteur_puissance_estimee'];
    let w = ps ? parseFloat(ps.state) : NaN;
    if (isNaN(w)) w = on ? 65 : 0.5;
    const es = states['sensor.projecteur_energie_aujourd_hui'];
    const kwh = es ? parseFloat(es.state) : NaN;
    return { on: on, st: st, cast: cast, kind: kind, name: name, title: title, w: w, kwh: kwh,
      pic: cast && kind !== 'ha' && ca.entity_picture ? ca.entity_picture : '',
      sub2: cast ? (ca.media_series_title || ca.media_artist || '') : '',
      playing: cast && kind !== 'ha' && cst === 'playing', paused: cast && cst === 'paused', buffering: cast && cst === 'buffering',
      prog: dur > 0 ? Math.min(1, Math.max(0, pos / dur)) : -1, rem: dur > 0 ? Math.max(0, dur - pos) : 0 };
    ]]]
triggers_update:
  - media_player.projecteur_cast
  - sensor.projecteur_puissance_estimee
  - sensor.projecteur_energie_aujourd_hui
