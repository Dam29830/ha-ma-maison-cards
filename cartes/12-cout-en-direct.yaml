# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Coût en direct
#  Ce que coûte l'appareil en ce moment, en €/h (tarif heures pleines / creuses).
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - sensor.chauffe_eau_cout_horaire
#  Nécessite : button-card (HACS) + capteur sensor.chauffe_eau_cout_horaire (package)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:button-card
entity: sensor.chauffe_eau_cout_horaire
name: Coût en direct
custom_fields:
  info: |-
    [[[
    const v = entity ? parseFloat(entity.state) : NaN;
    const ok = !isNaN(v);
    const txt = ok ? v.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €/h' : '—';
    return `<div class='hd-info' style='left:14px;right:12px;top:11px'><div class='hd-name'>Coût en direct</div></div>`
     + `<div class='hd-info' style='left:68px;right:10px;top:46px'><div class='hd-title s' style='font-size:21px;color:${ok && v > 0 ? '#ffd27a' : 'var(--primary-text-color)'}'>${txt}</div></div>`;
    ]]]
  scene: <div class="hd-scene"><div class="sc-coin"><div class="sc-face"><span>€</span></div></div><div class="sc-shadow"></div></div>
extra_styles: |-
  .hd-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .hd-info{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;white-space:normal;min-width:0;}
  .hd-name{font-size:13px;font-weight:600;line-height:1.25;color:var(--secondary-text-color);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hd-name.w{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .hd-title{font-size:22px;font-weight:600;line-height:1.15;color:var(--primary-text-color);transition:color .8s;}
  .hd-title.s{font-size:15.5px;}
  .hd-sub{font-size:12.5px;line-height:1.3;color:var(--secondary-text-color);}
  .hd-sub b{color:var(--primary-text-color);font-weight:600;}
  @media (prefers-reduced-motion: reduce){.hd-scene *,.hd-scene *::before,.hd-scene *::after{animation:none !important;}}
  .sc-coin{position:absolute;left:13px;top:36px;width:44px;height:44px;perspective:220px;}
  .sc-face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff3c4,#f2c14e 45%,#c8901f 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),inset 0 -3px 5px rgba(120,70,0,.35);animation:hdspin 3.2s linear infinite;animation-play-state:var(--sc-play,paused);filter:saturate(calc(.3 + var(--sc-on,0) * .7)) brightness(calc(.72 + var(--sc-on,0) * .28));transition:filter .8s;}
  .sc-face span{font:800 20px/1 Roboto,Arial,sans-serif;color:#9a6a12;text-shadow:0 1px 0 rgba(255,255,255,.5);}
  .sc-shadow{position:absolute;left:18px;top:84px;width:34px;height:5px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px);}
  @keyframes hdspin{0%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
grid_options:
  columns: 6
  rows: auto
show_icon: false
show_name: false
styles:
  card:
    - height: 100px
    - border-radius: 24px
    - overflow: hidden
    - padding: '0'
    - background: rgba(140,170,200,0.10)
    - backdrop-filter: blur(16px) saturate(170%)
    - -webkit-backdrop-filter: blur(16px) saturate(170%)
    - border: 1px solid rgba(255,255,255,0.16)
    - box-shadow: 0 8px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.22)
    - --sc-on: '[[[ return String((entity && parseFloat(entity.state) > 0) ? 1 : 0); ]]]'
    - --sc-play: "[[[ return String((entity && parseFloat(entity.state) > 0) ? 'running' : 'paused'); ]]]"
  custom_fields:
    info:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
    scene:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
  grid:
    - position: relative
tap_action:
  action: more-info
