# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Poêle à granulés
#  Poêle animé (flammes, braises, étincelles selon la puissance), état, consigne et alarmes.
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - sensor.salon_poele_a_granules_alarm
#    - number.salon_poele_a_granules_power
#    - climate.salon_poele_a_granules
#    - sensor.salon_poele_a_granules_status
#    - sensor.salon_poele_a_granules_real_power
#  Nécessite : button-card (HACS) + un poêle intégré à Home Assistant (climate + capteurs)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:button-card
entity: climate.salon_poele_a_granules
name: Poêle à granulés
custom_fields:
  info: |-
    [[[
    const p = variables.pf;
    let sub = p.d;
    if (p.m === 'alarm') {
      const al = states['sensor.salon_poele_a_granules_alarm'];
      const txt = al ? String(al.state) : '';
      sub = (txt && !['No All', 'unknown', 'unavailable'].includes(txt)) ? txt : (sub || 'Vérifiez le poêle');
    }
    let cap = p.sp == null ? 'Puissance indisponible' : 'Puissance de chauffe';
    if (p.m === 'on' && p.rp && p.sp && Math.round(p.rp) !== Math.round(p.sp)) cap = `Puissance · réelle ${Math.round(p.rp)}/5`;
    return `<div class='pf-row'><div class='pf-st'><b>${p.t}</b>${sub ? `<span> · ${sub}</span>` : ''}</div><div class='pf-cap'>${cap}</div></div>`;
    ]]]
