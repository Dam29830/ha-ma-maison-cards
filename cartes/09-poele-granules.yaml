extra_styles: |-
  .pf-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .pf-room{position:absolute;left:-92px;top:-43px;width:340px;height:300px;opacity:var(--pf-glow,0);visibility:var(--pf-vis,visible);transition:opacity 2.4s ease,visibility 2.6s linear;}
  .pf-room i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,rgba(255,146,58,.42),rgba(255,112,40,.16) 46%,rgba(255,90,30,0) 100%);animation:pfbreathe 2.6s ease-in-out infinite alternate;}
  .pf-stove{position:absolute;left:28px;bottom:102px;width:100px;height:152px;}
  .pf-pipe{position:absolute;left:41px;width:18px;bottom:100%;height:220px;background:linear-gradient(90deg,#17191d 0%,#3a3f47 42%,#2a2d33 70%,#141619 100%);}
  .pf-pipe::after{content:'';position:absolute;left:-2px;right:-2px;bottom:6px;height:5px;border-radius:2px;background:linear-gradient(90deg,#1c1e22,#454a52 45%,#202226);}
  .pf-shadow{position:absolute;left:-18px;right:-18px;bottom:-7px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));}
  .pf-floor{position:absolute;left:-46px;right:-46px;bottom:-14px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,140,50,.38),rgba(255,120,40,0));opacity:var(--pf-glow,0);visibility:var(--pf-vis,visible);transition:opacity 2.4s ease,visibility 2.6s linear;}
  .pf-foot{position:absolute;bottom:0;width:13px;height:10px;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#1b1d21,#0e0f11);}
  .pf-foot.l{left:9px;}.pf-foot.r{right:9px;}
  .pf-body{position:absolute;left:0;right:0;top:8px;bottom:8px;border-radius:7px 7px 11px 11px;background:linear-gradient(90deg,#1a1c21 0%,#2f333b 28%,#2b2f36 62%,#17191d 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 1px 0 0 rgba(255,255,255,.04),inset 0 -3px 5px rgba(0,0,0,.45),0 8px 18px rgba(0,0,0,.45);}
  .pf-top{position:absolute;left:-5px;right:-5px;top:0;height:11px;border-radius:5px 5px 3px 3px;background:linear-gradient(180deg,#4a4f58 0%,#2c2f35 100%);box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);}
  .pf-panel{position:absolute;left:28px;right:28px;top:15px;height:10px;border-radius:3px;background:#0b0c0f;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05);}
  .pf-led{position:absolute;left:4px;top:3px;width:4px;height:4px;border-radius:50%;background:var(--pf-led,#3b4048);box-shadow:0 0 5px 1px var(--pf-ledg,transparent);transition:background .8s,box-shadow .8s;}
  .pf-bars{position:absolute;right:4px;top:2px;bottom:2px;display:flex;align-items:flex-end;gap:2px;}
  .pf-bars b{width:3px;border-radius:1px;background:var(--pf-led,#3b4048);opacity:clamp(.14,calc((var(--pf-lvl,0) - var(--i) + 1) * 10),1);transition:opacity .8s,background .8s;}
  .pf-alarm{position:absolute;left:24px;right:24px;top:11px;height:18px;border-radius:6px;opacity:var(--pf-alarm,0);visibility:var(--pf-avis,hidden);transition:opacity .6s,visibility .8s linear;}
  .pf-alarm i{position:absolute;inset:0;border-radius:6px;box-shadow:0 0 10px 2px rgba(255,60,60,.75);animation:pfalarm 1s ease-in-out infinite;}
  .pf-door{position:absolute;left:7px;right:7px;top:30px;bottom:22px;border-radius:10px;background:linear-gradient(180deg,#1b1d22 0%,#101115 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 2px 2px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.5);}
  .pf-handle{position:absolute;right:8px;top:64px;width:4px;height:30px;border-radius:2px;background:linear-gradient(90deg,#6a707a,#2c2f35);box-shadow:0 1px 2px rgba(0,0,0,.6);}
  .pf-ash{position:absolute;left:16px;right:16px;bottom:11px;height:6px;border-radius:2px;background:#121317;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);}
  .pf-glass{position:absolute;left:13px;right:13px;top:36px;bottom:30px;border-radius:7px;overflow:hidden;background:linear-gradient(180deg,#0c0d10 0%,#08090b 100%);box-shadow:inset 0 0 10px rgba(0,0,0,.95);}
  .pf-wall{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 13px),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 19px);}
  .pf-wglow{position:absolute;inset:0;opacity:var(--pf-glow,0);visibility:var(--pf-vis,visible);transition:opacity 2s ease,visibility 2.6s linear;}
  .pf-wglow i{position:absolute;inset:0;background:radial-gradient(ellipse 75% 80% at 50% 96%,rgba(255,160,70,.70) 0%,rgba(255,96,24,.28) 45%,rgba(255,70,10,0) 78%);animation:pfglass 1.7s ease-in-out infinite;}
  .pf-fire{position:absolute;left:50%;bottom:12px;width:50px;height:70px;margin-left:-25px;transform-origin:50% 100%;transform:scale(var(--pf-fire,0));opacity:var(--pf-fire-o,0);visibility:var(--pf-vis,visible);transition:transform 1.7s cubic-bezier(.2,.9,.28,1.12),opacity 1s ease,visibility 2.6s linear;}
  .pf-halo{position:absolute;left:-14px;right:-14px;bottom:-6px;height:58px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,180,70,.55),rgba(255,120,30,0));animation:pfglass 1.3s ease-in-out infinite;}
  .pf-float{position:absolute;inset:0;transform-origin:50% 100%;animation:pffloat 3.4s ease-in-out infinite;}
  .pf-float svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .pf-float path{transform-box:fill-box;transform-origin:50% 100%;}
  .pf-o{fill:#ff5418;opacity:.92;animation:pfflick 1.45s ease-in-out infinite;}
  .pf-m{fill:#ff8c1a;animation:pfflick 1.1s ease-in-out -.35s infinite;}
  .pf-n{fill:#ffc53a;animation:pfflick .9s ease-in-out -.2s infinite;}
  .pf-c{fill:#fff2c2;animation:pfflick 1.25s ease-in-out -.6s infinite;}
  .pf-l{fill:#ff6a1c;animation:pflick 1.6s ease-in-out -.5s infinite;}
  .pf-r{fill:#ff6a1c;animation:pflick 1.3s ease-in-out -1s infinite;}
  .pf-wisp{position:absolute;left:50%;top:4px;width:8px;height:11px;margin-left:-4px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 70%,#ffe39a 0%,#ff9a2a 60%,rgba(255,110,30,0) 100%);opacity:0;}
  .pf-wisp.a{animation:pfwispl 1.9s ease-out infinite;}
  .pf-wisp.b{animation:pfwispr 2.3s ease-out -.8s infinite;}
  .pf-wisp.c{width:6px;height:9px;margin-left:-3px;animation:pfwispl 2.6s ease-out -1.6s infinite;}
  .pf-pot{position:absolute;left:50%;bottom:7px;width:38px;height:11px;margin-left:-19px;border-radius:2px 2px 5px 5px;background:linear-gradient(180deg,#34373e 0%,#16171a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);}
  .pf-pot::after{content:'';position:absolute;left:4px;right:4px;bottom:3px;height:2px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.7) 0 2px,transparent 2px 5px);}
  .pf-ember{position:absolute;left:50%;bottom:15px;width:36px;height:8px;margin-left:-18px;border-radius:50%;opacity:var(--pf-ember,0);visibility:var(--pf-vis,visible);transition:opacity 2.2s ease,visibility 2.6s linear;}
  .pf-ember i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,#fff0a6 0%,#ffb12e 35%,#ff5a1a 70%,rgba(255,60,10,0) 100%);animation:pfember 1.1s ease-in-out infinite alternate;}
  .pf-sparks{position:absolute;inset:0;opacity:var(--pf-spark,0);visibility:var(--pf-vis,visible);transition:opacity 1.2s ease,visibility 2.6s linear;}
  .pf-sparks i{position:absolute;bottom:20px;width:2px;height:2px;border-radius:50%;background:#ffdf8a;box-shadow:0 0 3px 1px rgba(255,170,60,.85);opacity:0;}
  .pf-sparks i:nth-child(odd){animation:pfsparkl 2.2s linear infinite;}
  .pf-sparks i:nth-child(even){animation:pfsparkr 2.6s linear infinite;}
  .pf-reflect{position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 24%,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 60%,rgba(255,255,255,.05) 62%,rgba(255,255,255,0) 68%);}
  .pf-row{position:absolute;left:14px;right:14px;bottom:56px;height:22px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-align:left;white-space:nowrap;}
  .pf-st{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--secondary-text-color);}
  .pf-st b{font-size:17px;font-weight:600;color:var(--pf-accent,var(--primary-text-color));}
  .pf-name{font-size:13px;font-weight:600;color:var(--secondary-text-color);opacity:.9;}
  .pf-title{font-size:24px;font-weight:600;line-height:1.15;color:var(--pf-accent,var(--primary-text-color));}
  .pf-sub{font-size:12.5px;line-height:1.3;color:var(--secondary-text-color);min-height:16px;}
  .pf-meta{font-size:12.5px;line-height:1.3;color:var(--primary-text-color);margin-top:4px;}
  .pf-meta span{color:var(--secondary-text-color);}
  .pf-pow{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11.5px;color:var(--secondary-text-color);}
  .pf-pow .bars{display:flex;align-items:flex-end;gap:2px;height:13px;}
  .pf-pow .bars i{width:4px;border-radius:1.5px;background:var(--pf-accent,#ff9a3c);opacity:.2;}
  .pf-pow .bars i.on{opacity:1;}
  @keyframes pfflick{0%,100%{transform:scale(1,1) skewX(0deg);}22%{transform:scale(.95,1.07) skewX(-3deg);}48%{transform:scale(1.04,.95) skewX(2.5deg);}74%{transform:scale(.97,1.05) skewX(-1.5deg);}}
  @keyframes pflick{0%,100%{transform:scale(.8,.72) skewX(2deg);opacity:.55;}50%{transform:scale(1,1.1) skewX(-3deg);opacity:.95;}}
  @keyframes pffloat{0%,100%{transform:translateY(0) scale(1,1);}50%{transform:translateY(-3.5px) scale(1.02,1.04);}}
  @keyframes pfwispl{0%{transform:translate(0,0) scale(1);opacity:0;}12%{opacity:.95;}100%{transform:translate(-5px,-30px) scale(.3);opacity:0;}}
  @keyframes pfwispr{0%{transform:translate(0,0) scale(1);opacity:0;}12%{opacity:.95;}100%{transform:translate(5px,-30px) scale(.3);opacity:0;}}
  @keyframes pfsparkl{0%{transform:translate(0,0);opacity:0;}8%{opacity:1;}100%{transform:translate(-7px,-62px);opacity:0;}}
  @keyframes pfsparkr{0%{transform:translate(0,0);opacity:0;}8%{opacity:1;}100%{transform:translate(7px,-66px);opacity:0;}}
  @keyframes pfember{0%{transform:scaleX(.92);filter:brightness(.85);}100%{transform:scaleX(1.06);filter:brightness(1.25);}}
  @keyframes pfbreathe{0%{transform:scale(.97);opacity:.78;}100%{transform:scale(1.04);opacity:1;}}
  @keyframes pfglass{0%,100%{opacity:.82;}30%{opacity:1;}55%{opacity:.7;}80%{opacity:.95;}}
  @keyframes pfalarm{0%,100%{opacity:.25;}50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){.pf-scene *{animation:none !important;}}
  .pf-cap{flex:none;font-size:11.5px;line-height:14px;color:var(--secondary-text-color);}
grid_options:
  columns: 12
  rows: auto
hold_action:
  action: none
show_icon: false
show_label: false
show_name: false
show_state: false
styles:
  card:
    - height: 314px
    - border-radius: 24px
    - overflow: hidden
    - padding: '0'
    - background: rgba(140,170,200,0.10)
    - backdrop-filter: blur(16px) saturate(170%)
    - -webkit-backdrop-filter: blur(16px) saturate(170%)
    - border: 1px solid rgba(255,255,255,0.16)
    - box-shadow: 0 8px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.22)
    - --pf-fire: '[[[ return String(variables.pf.f); ]]]'
    - --pf-fire-o: "[[[ return variables.pf.f > 0 ? '1' : '0'; ]]]"
    - --pf-glow: '[[[ return String(variables.pf.g); ]]]'
    - --pf-ember: '[[[ return String(variables.pf.e); ]]]'
    - --pf-spark: '[[[ return String(variables.pf.s); ]]]'
    - --pf-vis: '[[[ return String(variables.pf.vis); ]]]'
    - --pf-avis: '[[[ return String(variables.pf.avis); ]]]'
    - --pf-led: '[[[ return String(variables.pf.led); ]]]'
    - --pf-ledg: '[[[ return String(variables.pf.ledg); ]]]'
    - --pf-lvl: '[[[ return String(variables.pf.lvl); ]]]'
    - --pf-accent: '[[[ return String(variables.pf.accent); ]]]'
    - --pf-alarm: "[[[ return variables.pf.m === 'alarm' ? '1' : '0'; ]]]"
  custom_fields:
    info:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
      - z-index: '1'
      - pointer-events: none
    scene:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
      - z-index: '0'
      - pointer-events: none
    s1:
      - position: absolute
      - left: 14px
      - bottom: 14px
      - width: calc((100% - 28px - 16px) / 5)
      - height: 34px
      - overflow: visible
      - z-index: '2'
    s2:
      - position: absolute
      - left: calc(14px + 1 * (((100% - 28px - 16px) / 5) + 4px))
      - bottom: 14px
      - width: calc((100% - 28px - 16px) / 5)
      - height: 34px
      - overflow: visible
      - z-index: '2'
    s3:
      - position: absolute
      - left: calc(14px + 2 * (((100% - 28px - 16px) / 5) + 4px))
      - bottom: 14px
      - width: calc((100% - 28px - 16px) / 5)
      - height: 34px
      - overflow: visible
      - z-index: '2'
    s4:
      - position: absolute
      - left: calc(14px + 3 * (((100% - 28px - 16px) / 5) + 4px))
      - bottom: 14px
      - width: calc((100% - 28px - 16px) / 5)
      - height: 34px
      - overflow: visible
      - z-index: '2'
    s5:
      - position: absolute
      - left: calc(14px + 4 * (((100% - 28px - 16px) / 5) + 4px))
      - bottom: 14px
      - width: calc((100% - 28px - 16px) / 5)
      - height: 34px
      - overflow: visible
      - z-index: '2'
    th:
      - position: absolute
      - top: 4px
      - left: calc(148px + (100% - 148px - min(216px, 100% - 156px)) / 2)
      - width: min(216px, 100% - 156px)
      - height: 228px
      - overflow: visible
      - white-space: normal
      - z-index: '2'
  grid:
    - position: relative
tap_action:
  action: more-info
triggers_update:
  - sensor.salon_poele_a_granules_status
  - sensor.salon_poele_a_granules_real_power
  - number.salon_poele_a_granules_power
  - sensor.salon_poele_a_granules_alarm
variables:
  pf: |-
    [[[
    const S = (id) => { const s = states[id]; return s ? String(s.state) : 'unavailable'; };
    const num = (id) => { const v = parseFloat(S(id)); return isNaN(v) ? null : v; };
    const raw = S('sensor.salon_poele_a_granules_status').toUpperCase();
    const sp = num('number.salon_poele_a_granules_power');
    const rp = num('sensor.salon_poele_a_granules_real_power');
    const lvl = Math.min(5, Math.max(1, rp > 0 ? rp : (sp || 3)));
    const big = (0.78 + 0.06 * lvl).toFixed(2);
    const P = {
      'OFF':             {m: 'off',     f: 0,   g: 0,   e: 0,   s: 0,   t: 'Éteint',      d: ''},
      'PELLET LOAD':     {m: 'ignite',  f: 0,   g: .15, e: .4,  s: .15, t: 'Allumage…',   d: 'Chargement des granulés'},
      'AWAITING FLAME':  {m: 'ignite',  f: .22, g: .3,  e: .7,  s: .4,  t: 'Allumage…',   d: 'Attente de la flamme'},
      'LIGHTING':        {m: 'ignite',  f: .55, g: .6,  e: .85, s: .6,  t: 'Allumage…',   d: 'La flamme prend'},
      'WORKING':         {m: 'on',      f: big, g: 1,   e: 1,   s: 1,   t: 'Allumé',      d: 'En chauffe'},
      'ASHPAN CLEANING': {m: 'on',      f: .7,  g: .85, e: 1,   s: .8,  t: 'Allumé',      d: 'Nettoyage du creuset'},
      'STANDBY':         {m: 'standby', f: 0,   g: .3,  e: .85, s: .15, t: 'En veille',   d: ''},
      'FINAL CLEANING':  {m: 'fading',  f: .2,  g: .3,  e: .8,  s: .25, t: 'Extinction…', d: 'Nettoyage final'},
      'ALARM':           {m: 'alarm',   f: 0,   g: 0,   e: 0,   s: 0,   t: 'Alarme',      d: ''},
      'ALARM MEMORY':    {m: 'alarm',   f: 0,   g: 0,   e: 0,   s: 0,   t: 'Alarme',      d: 'Alarme en mémoire'}
    };
    let p = P[raw];
    if (!p) {
      const c = entity ? entity.state : 'unavailable';
      const act = entity ? entity.attributes.hvac_action : '';
      if (c === 'unavailable' || c === 'unknown') p = {m: 'unknown', f: 0, g: 0, e: 0, s: 0, t: 'Indisponible', d: 'Pas de nouvelles du poêle'};
      else if (act === 'heating' || c === 'heat') p = Object.assign({}, P['WORKING'], {d: 'Statut détaillé indisponible'});
      else p = Object.assign({}, P['OFF']);
    }
    const C = {off: '#3b4048', unknown: '#3b4048', ignite: '#ffc145', on: '#ff9a3c', standby: '#e8a65c', fading: '#ff7a45', alarm: '#ff4d4d'};
    p = Object.assign({}, p);
    p.led = C[p.m];
    p.ledg = (p.m === 'off' || p.m === 'unknown') ? 'transparent' : C[p.m];
    p.accent = (p.m === 'off' || p.m === 'unknown') ? 'var(--secondary-text-color)' : C[p.m];
    p.vis = (Number(p.f) > 0 || p.g > 0 || p.e > 0 || p.s > 0) ? 'visible' : 'hidden';
    p.avis = p.m === 'alarm' ? 'visible' : 'hidden';
    p.sp = sp;
    p.rp = rp;
    p.lvl = ['on', 'ignite', 'standby'].includes(p.m) ? (sp || 0) : 0;
    return p;
    ]]]
