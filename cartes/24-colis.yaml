# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Colis Amazon
#  Suivi animé des commandes Amazon.fr : une camionnette roule sur la frise de
#  chaque colis (commandé, expédié, en route, livré) et file vers la maison le jour
#  de la livraison ; casier qui clignote pour un colis à retirer (avec son code),
#  bulle « ! » pour un retard ou une livraison manquée, pièce € pour un retour à
#  renvoyer, carton qui atterrit une fois livré. Appui sur un colis = la commande
#  sur Amazon.fr ; appui sur le titre = la liste dans Home Assistant.
#
#  Entité : todo.colis_amazon, la liste Local To-do « Colis Amazon ».
#  Nécessite : ma-maison-agenda.js, par HACS ou en ressource (voir le guide
#  d'installation) + les intégrations IMAP (votre boîte mail) et Local To-do
#  + le package configuration/packages/colis_amazon.yaml, qui remplit la liste à
#  partir des e-mails d'Amazon.fr
#  Options, toutes facultatives :
#    entity: todo.colis_amazon     → liste des colis
#    title: Colis Amazon           → titre de la carte
#    max_items: 5                  → colis affichés
#    delivered_hours: 20           → durée d'affichage d'un colis livré (heures)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:ma-maison-colis
entity: todo.colis_amazon
grid_options:
  columns: 12
  rows: auto
