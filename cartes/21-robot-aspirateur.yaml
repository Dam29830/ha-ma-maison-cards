grid_options:
  columns: 12
  rows: auto
show_icon: false
show_name: false
styles:
  card:
    - height: 160px
    - border-radius: 24px
    - overflow: hidden
    - padding: '0'
    - background: rgba(140,170,200,0.10)
    - backdrop-filter: blur(16px) saturate(170%)
    - -webkit-backdrop-filter: blur(16px) saturate(170%)
    - border: 1px solid rgba(255,255,255,0.16)
    - box-shadow: 0 8px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.22)
    - --rv-c: "[[[ return ['clean','pause','err','idle'].includes(variables.rv.k) ? '1' : '0'; ]]]"
    - --rv-tr: "[[[ return ['clean','pause','err'].includes(variables.rv.k) ? '1' : '0'; ]]]"
    - --rv-run: "[[[ return variables.rv.k === 'clean' ? 'running' : 'paused'; ]]]"
    - --rv-spin: "[[[ return variables.rv.k === 'clean' ? 'running' : 'paused'; ]]]"
    - --rv-ro: "[[[ return ['pause','err'].includes(variables.rv.k) ? '1' : '0'; ]]]"
    - --rv-ring: "[[[ return variables.rv.k === 'err' ? '#ff5a4f' : (variables.rv.k === 'pause' ? '#ffc46b' : 'transparent'); ]]]"
    - --rv-r: "[[[ return variables.rv.k === 'ret' ? '1' : '0'; ]]]"
    - --rv-rrun: "[[[ return variables.rv.k === 'ret' ? 'running' : 'paused'; ]]]"
    - --rv-d: "[[[ return ['dock','empty','wash','dry','off','tank'].includes(variables.rv.k) ? '1' : '0'; ]]]"
    - --rv-e: "[[[ return variables.rv.k === 'empty' ? '1' : '0'; ]]]"
    - --rv-w: "[[[ return variables.rv.k === 'wash' ? '1' : '0'; ]]]"
    - --rv-y: "[[[ return variables.rv.k === 'dry' ? '1' : '0'; ]]]"
    - --rv-chg: "[[[ return (variables.rv.k === 'dock' && variables.rv.chg === 'charging') ? '1' : '0'; ]]]"
    - --rv-fxrun: "[[[ return ['empty','wash','dry'].includes(variables.rv.k) ? 'running' : 'paused'; ]]]"
    - --rv-halo: "[[[ return (['pause','err'].includes(variables.rv.k) || (variables.rv.k === 'dock' && variables.rv.chg === 'charging')) ? 'running' : 'paused'; ]]]"
    - --rv-scan: "[[[ return ['clean','ret'].includes(variables.rv.k) ? '1' : '0'; ]]]"
    - --rv-mop: "[[[ return variables.rv.mop ? '1' : '0'; ]]]"
    - --rv-tc: "[[[ return variables.rv.mop ? 'rgba(120,190,255,0.17)' : 'rgba(255,255,255,0.09)'; ]]]"
    - --rv-led: "[[[ const m = {clean: '#5dffa0', ret: '#8fd0ff', pause: '#ffc46b', err: '#ff5a4f', idle: '#8fb3d9', off: '#454c56', tank: '#ffb15c'}; return m[variables.rv.k] || (variables.rv.chg === 'charging' ? '#5dffa0' : '#8fb3d9'); ]]]"
    - --rv-sled: "[[[ const m = {empty: '#e8b06c', wash: '#59b8ff', dry: '#ff9f5a', off: '#454c56', tank: '#ff6b4f'}; return m[variables.rv.k] || '#cfe0f2'; ]]]"
    - --rv-sledg: "[[[ const m = {empty: 'rgba(232,176,108,.7)', wash: 'rgba(89,184,255,.7)', dry: 'rgba(255,159,90,.7)', tank: 'rgba(255,107,79,.75)'}; return m[variables.rv.k] || (variables.rv.k === 'off' ? 'transparent' : 'rgba(207,224,242,.45)'); ]]]"
    - --rv-tkc: "[[[ const t = variables.rv.tc; return t === 'ok' ? '#5fb6ff' : (t === 'unk' ? '#8d97a3' : '#ff6b4f'); ]]]"
    - --rv-tkd: "[[[ const t = variables.rv.td; return t === 'ok' ? '#a08f78' : (t === 'unk' ? '#8d97a3' : '#ff6b4f'); ]]]"
    - --rv-tkdg: "[[[ return ['ok','unk'].includes(variables.rv.td) ? 'transparent' : '#ff6b4f'; ]]]"
    - --rv-tkcr: "[[[ return ['ok','unk'].includes(variables.rv.tc) ? 'paused' : 'running'; ]]]"
    - --rv-tkdr: "[[[ return ['ok','unk'].includes(variables.rv.td) ? 'paused' : 'running'; ]]]"
    - --rv-tkco: "[[[ return ['ok','unk'].includes(variables.rv.tc) ? 'transparent' : 'rgba(255,107,79,.85)'; ]]]"
    - --rv-tkdo: "[[[ return ['ok','unk'].includes(variables.rv.td) ? 'transparent' : 'rgba(255,107,79,.85)'; ]]]"
    - --rv-gs: "[[[ return variables.rv.k === 'off' ? '1' : '0'; ]]]"
    - --rv-dim: "[[[ return variables.rv.k === 'off' ? '0.55' : '1'; ]]]"
  custom_fields:
    dust:
      - position: absolute
      - left: calc(178px + 2 * calc((100% - 178px - 12px - 18px) / 4) + 12px)
      - bottom: 14px
      - width: calc((100% - 178px - 12px - 18px) / 4)
      - height: 34px
      - z-index: '2'
      - --rvx-bg: "[[[ return variables.rv.k === 'empty' ? 'rgba(232,176,108,0.22)' : 'rgba(255,255,255,0.08)'; ]]]"
      - --rvx-bd: "[[[ return variables.rv.k === 'empty' ? 'rgba(232,176,108,0.55)' : 'rgba(255,255,255,0.16)'; ]]]"
    go:
      - position: absolute
      - left: 178px
      - bottom: 14px
      - width: calc((100% - 178px - 12px - 18px) / 4)
      - height: 34px
      - z-index: '2'
      - display: "[[[ return variables.rv.run ? 'none' : 'block'; ]]]"
    home:
      - position: absolute
      - left: calc(178px + 1 * calc((100% - 178px - 12px - 18px) / 4) + 6px)
      - bottom: 14px
      - width: calc((100% - 178px - 12px - 18px) / 4)
      - height: 34px
      - z-index: '2'
      - --rvx-bg: "[[[ return variables.rv.k === 'ret' ? 'rgba(143,208,255,0.22)' : 'rgba(255,255,255,0.08)'; ]]]"
      - --rvx-bd: "[[[ return variables.rv.k === 'ret' ? 'rgba(143,208,255,0.55)' : 'rgba(255,255,255,0.16)'; ]]]"
    info:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
      - z-index: '1'
      - pointer-events: none
    loc:
      - position: absolute
      - left: calc(178px + 3 * calc((100% - 178px - 12px - 18px) / 4) + 18px)
      - bottom: 14px
      - width: calc((100% - 178px - 12px - 18px) / 4)
      - height: 34px
      - z-index: '2'
    pz:
      - position: absolute
      - left: 178px
      - bottom: 14px
      - width: calc((100% - 178px - 12px - 18px) / 4)
      - height: 34px
      - z-index: '2'
      - display: "[[[ return variables.rv.run ? 'block' : 'none'; ]]]"
      - --rvx-bg: rgba(76,201,168,0.20)
      - --rvx-bd: rgba(76,201,168,0.50)
    scene:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
      - z-index: '0'
      - pointer-events: none
  grid:
    - position: relative
tap_action:
  action: more-info
  entity: vacuum.robot_nettoyeur
triggers_update:
  - sensor.robot_aspirateur_phase_actuelle
  - sensor.robot_aspirateur_batterie
  - sensor.robot_aspirateur_etat_de_charge_de_la_batterie
  - sensor.robot_aspirateur_temps_avant_charge_complete
  - sensor.robot_aspirateur_erreur_de_fonctionnement
  - select.robot_aspirateur_mode_nettoyage
  - sensor.robot_nettoyeur_etat_de_la_station
  - sensor.robot_nettoyeur_surface_nettoyee
  - sensor.robot_nettoyeur_duree_de_nettoyage
  - sensor.robot_nettoyeur_batterie
variables:
  rv: |-
    [[[
    const S = (id) => { const s = states[id]; return s ? s.state : undefined; };
    const bad = (x) => x === undefined || x === 'unavailable' || x === 'unknown';
    const st = entity ? entity.state : 'unavailable';
    const ph = S('sensor.robot_aspirateur_phase_actuelle') || '';
    const sta = S('sensor.robot_nettoyeur_etat_de_la_station');
    const er = S('sensor.robot_aspirateur_erreur_de_fonctionnement');
    const chg = S('sensor.robot_aspirateur_etat_de_charge_de_la_batterie');
    const mode = S('select.robot_aspirateur_mode_nettoyage') || '';
    let b = parseFloat(S('sensor.robot_aspirateur_batterie'));
    if (isNaN(b)) b = parseFloat(S('sensor.robot_nettoyeur_batterie'));
    const TC = {water_tank_empty: 'empty', water_tank_missing: 'missing', water_tank_lid_open: 'lid'};
    const TD = {dirty_water_tank_full: 'full', dirty_water_tank_missing: 'missing'};
    const tc = bad(er) ? 'unk' : (TC[er] || 'ok');
    const td = bad(er) ? 'unk' : (TD[er] || 'ok');
    let k;
    if (bad(st)) k = 'off';
    else if (TC[er] || TD[er]) k = 'tank';
    else if (st === 'error' || (!bad(er) && er !== 'no_error')) k = 'err';
    else if (st === 'paused') k = 'pause';
    else if (ph.indexOf('Return') === 0 || st === 'returning') k = 'ret';
    else if (ph === 'Auto Collect Dirt' || ph === 'Hand Collect Dirt' || sta === 'emptying_dustbin') k = 'empty';
    else if (ph === 'Wash Mop' || ph === 'Pump Water' || ph === 'Self Clean' || sta === 'washing_mop') k = 'wash';
    else if (ph === 'Dry Mop' || sta === 'drying_mop') k = 'dry';
    else if (st === 'cleaning') k = 'clean';
    else if (st === 'docked') k = 'dock';
    else k = 'idle';
    return { k: k, st: st, ph: ph, er: er, chg: chg, mode: mode, mop: mode !== 'Vacuum-Only', b: b, tc: tc, td: td, run: st === 'cleaning' || st === 'returning' };
    ]]]
