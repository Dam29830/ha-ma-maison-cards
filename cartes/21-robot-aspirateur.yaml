# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Robot aspirateur
#  Robot animé selon son état (nettoyage, retour, vidage, lavage, séchage, charge),
#  batterie, réservoirs, erreurs en clair ; boutons démarrer, pause, base, localiser, vider le bac.
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - button.robot_nettoyeur_vider_le_bac_a_poussiere
#    - vacuum.robot_aspirateur
#    - sensor.robot_nettoyeur_surface_nettoyee
#    - sensor.robot_nettoyeur_duree_de_nettoyage
#    - sensor.robot_aspirateur_temps_avant_charge_complete
#    - vacuum.robot_nettoyeur
#    - sensor.robot_aspirateur_phase_actuelle
#    - sensor.robot_aspirateur_batterie
#    - sensor.robot_aspirateur_etat_de_charge_de_la_batterie
#    - sensor.robot_aspirateur_erreur_de_fonctionnement
#    - select.robot_aspirateur_mode_nettoyage
#    - sensor.robot_nettoyeur_etat_de_la_station
#    - sensor.robot_nettoyeur_batterie
#  Nécessite : button-card (HACS) + robot Ecovacs Deebot (Matter + intégration Ecovacs)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
