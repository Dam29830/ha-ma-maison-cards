  scene: <div class="hd-scene"><div class="rv-world"><div class="rv-floor"></div><div class="rv-g-tr"><svg class="rv-trail" viewBox="0 0 176 160" width="176" height="160" aria-hidden="true"><path class="rv-tp" d="M92,28 H146 A11,11 0 0 1 146,50 H92 A11,11 0 0 0 92,72 H146 A11,11 0 0 1 146,94 H92 A11,11 0 0 0 92,116 H146 A11,11 0 0 1 146,138 H92"/><path class="rv-tp2" d="M92,28 H146 A11,11 0 0 1 146,50 H92 A11,11 0 0 0 92,72 H146 A11,11 0 0 1 146,94 H92 A11,11 0 0 0 92,116 H146 A11,11 0 0 1 146,138 H92"/></svg></div><div class="rv-g-ret"><svg class="rv-route" viewBox="0 0 176 160" width="176" height="160" aria-hidden="true"><path d="M128,62 C104,62 84,80 66,80 L55,80"/></svg><i class="rv-beacon"></i><i class="rv-beacon b"></i></div><div class="rv-sta"><i class="rv-plate"></i><i class="rv-tray"></i><i class="rv-pin a"></i><i class="rv-pin b"></i><div class="rv-box"><i class="rv-tank c"></i><i class="rv-win"><u></u></i><i class="rv-tank d"></i><i class="rv-sled"></i></div></div><div class="rv-fx-w"><i style="animation-delay:0s"></i><i style="animation-delay:-0.6s"></i><i style="animation-delay:-1.2s"></i></div><div class="rv-fx-y"><i class="rv-heat"></i></div><div class="rv-g-dk"><div class="rv-bot rv-dk"><i class="rv-mop"></i><div class="rv-brush"><svg viewBox="-8 -8 16 16" aria-hidden="true"><path d="M0 0V-6.6M0 0L5.7 3.3M0 0L-5.7 3.3"/><circle r="1.7"/></svg></div><div class="rv-shell"><i class="rv-bump"></i><i class="rv-top"></i><i class="rv-gloss"></i><i class="rv-eye"></i><i class="rv-led"></i></div><i class="rv-ring"><u></u></i></div></div><div class="rv-fx-y2"><b style="left:46px;animation-delay:0s"></b><b style="left:54px;animation-delay:-0.55s"></b><b style="left:62px;animation-delay:-1.1s"></b></div><div class="rv-fx-e"><b style="left:52px;top:72px;animation-delay:0s"></b><b style="left:54px;top:86px;animation-delay:-0.14s"></b><b style="left:50px;top:92px;animation-delay:-0.28s"></b><b style="left:49px;top:66px;animation-delay:-0.42s"></b><b style="left:53px;top:79px;animation-delay:-0.56s"></b><b style="left:56px;top:75px;animation-delay:-0.7s"></b><b style="left:51px;top:84px;animation-delay:-0.84s"></b></div><div class="rv-g-rt"><div class="rv-bot rv-rt"><i class="rv-mop"></i><div class="rv-brush"><svg viewBox="-8 -8 16 16" aria-hidden="true"><path d="M0 0V-6.6M0 0L5.7 3.3M0 0L-5.7 3.3"/><circle r="1.7"/></svg></div><div class="rv-shell"><i class="rv-bump"></i><i class="rv-top"></i><i class="rv-gloss"></i><i class="rv-eye"></i><i class="rv-led"></i></div><i class="rv-ring"><u></u></i></div></div><div class="rv-g-cl"><div class="rv-bot rv-cl"><i class="rv-mop"></i><div class="rv-brush"><svg viewBox="-8 -8 16 16" aria-hidden="true"><path d="M0 0V-6.6M0 0L5.7 3.3M0 0L-5.7 3.3"/><circle r="1.7"/></svg></div><div class="rv-shell"><i class="rv-bump"></i><i class="rv-top"></i><i class="rv-gloss"></i><i class="rv-eye"></i><i class="rv-led"></i></div><i class="rv-ring"><u></u></i></div></div></div></div>
extra_styles: |-
  .hd-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .hd-info{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;white-space:normal;min-width:0;}
  .hd-name{font-size:13px;font-weight:600;line-height:1.25;color:var(--secondary-text-color);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hd-name.w{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .hd-title{font-size:22px;font-weight:600;line-height:1.15;color:var(--primary-text-color);transition:color .8s;}
  .hd-title.s{font-size:15.5px;}
  .hd-sub{font-size:12.5px;line-height:1.3;color:var(--secondary-text-color);}
  .hd-sub b{color:var(--primary-text-color);font-weight:600;}
  @media (prefers-reduced-motion: reduce){.hd-scene *,.hd-scene *::before,.hd-scene *::after{animation:none !important;}}
  .rv-world{position:absolute;left:0;top:0;width:176px;height:160px;filter:grayscale(var(--rv-gs,0));opacity:var(--rv-dim,1);transition:opacity 1s,filter 1s;}
  .rv-floor{position:absolute;left:60px;top:4px;width:116px;height:152px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.055) 0 1px,transparent 1px 22px) 0 13px,repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 58px) 17px 0,linear-gradient(140deg,rgba(255,255,255,.075),rgba(255,255,255,.02));-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);}
  .rv-g-tr{position:absolute;inset:0;opacity:var(--rv-tr,0);transition:opacity 1s;}
  .rv-trail{position:absolute;left:0;top:0;overflow:visible;}
  .rv-tp,.rv-tp2{fill:none;stroke-dasharray:498 498;stroke-dashoffset:498;animation:rvtrail 20s linear -7s infinite;animation-play-state:var(--rv-run,paused);}
  .rv-tp{stroke:var(--rv-tc,rgba(255,255,255,.09));stroke-width:24;}
  .rv-tp2{stroke:rgba(255,255,255,.13);stroke-width:1.1;}
  @keyframes rvtrail{0%{stroke-dashoffset:498;opacity:1;}80.06%{stroke-dashoffset:0;opacity:1;}87.04%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:0;opacity:0;}}
  .rv-g-ret{position:absolute;inset:0;opacity:var(--rv-r,0);transition:opacity .8s;}
  .rv-route{position:absolute;left:0;top:0;overflow:visible;}
  .rv-route path{fill:none;stroke:rgba(143,208,255,.6);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1.6 5;animation:rvmarch .9s linear infinite;animation-play-state:var(--rv-rrun,paused);}
  @keyframes rvmarch{to{stroke-dashoffset:-6.6;}}
  .rv-beacon{position:absolute;left:55px;top:80px;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1.5px solid rgba(143,208,255,.75);animation:rvping 2s ease-out infinite;animation-play-state:var(--rv-rrun,paused);}
  .rv-beacon.b{animation-delay:-1s;}
  @keyframes rvping{0%{transform:scale(.45);opacity:0;}20%{opacity:.9;}100%{transform:scale(1.25);opacity:0;}}
  .rv-sta{position:absolute;inset:0;}
  .rv-plate{position:absolute;left:32px;top:57px;width:28px;height:46px;border-radius:0 10px 10px 0;background:linear-gradient(90deg,#1b2027,#2c323b);box-shadow:0 0 0 .6px rgba(255,255,255,.09),0 3px 8px rgba(0,0,0,.45);}
  .rv-tray{position:absolute;left:36px;top:60px;width:24px;height:40px;border-radius:0 9px 9px 0;background:radial-gradient(ellipse at 62% 50%,rgba(120,195,255,.6),rgba(120,195,255,0) 72%);opacity:var(--rv-w,0);transition:opacity 1s;}
  .rv-pin{position:absolute;left:39px;width:4px;height:3px;border-radius:1px;background:linear-gradient(180deg,#f3d58b,#b48a2c);}
  .rv-pin.a{top:71px;}.rv-pin.b{top:86px;}
  .rv-box{position:absolute;left:8px;top:46px;width:30px;height:68px;border-radius:9px;background:linear-gradient(90deg,#c3cad3 0%,#f3f5f8 34%,#e4e8ed 70%,#b6bec8 100%);box-shadow:0 0 0 .6px rgba(0,0,0,.35),0 5px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.75);}
  .rv-tank{position:absolute;left:4px;right:4px;height:17px;border-radius:5px;background:linear-gradient(180deg,#e3e7ec,#c6cdd6);box-shadow:inset 0 0 0 .6px rgba(0,0,0,.2);}
  .rv-tank.c{top:5px;box-shadow:inset 0 0 0 .6px rgba(0,0,0,.2),0 0 0 1.4px var(--rv-tkco,transparent);}
  .rv-tank.d{bottom:5px;box-shadow:inset 0 0 0 .6px rgba(0,0,0,.2),0 0 0 1.4px var(--rv-tkdo,transparent);}
  .rv-tank::after{content:'';position:absolute;left:5px;right:5px;top:7px;height:3px;border-radius:2px;background:rgba(0,0,0,.17);}
  .rv-tank::before{content:'';position:absolute;right:3px;top:3px;width:3.5px;height:3.5px;border-radius:50%;animation:rvblink 1s ease-in-out infinite;}
  .rv-tank.c::before{background:var(--rv-tkc,#5fb6ff);box-shadow:0 0 3px var(--rv-tkc,transparent);animation-play-state:var(--rv-tkcr,paused);}
  .rv-tank.d::before{background:var(--rv-tkd,#a08f78);box-shadow:0 0 3px var(--rv-tkdg,transparent);animation-play-state:var(--rv-tkdr,paused);}
  @keyframes rvblink{0%,100%{opacity:1;}50%{opacity:.25;}}
  .rv-win{position:absolute;left:7px;right:7px;top:26px;height:16px;border-radius:5px;background:linear-gradient(160deg,#39414c,#161a20 70%);overflow:hidden;box-shadow:inset 0 0 0 .6px rgba(255,255,255,.16);}
  .rv-win u{position:absolute;inset:-7px;background:conic-gradient(rgba(214,180,138,0),rgba(214,180,138,.9),rgba(214,180,138,0) 38%,rgba(214,180,138,.65) 68%,rgba(214,180,138,0));opacity:var(--rv-e,0);transition:opacity .8s;animation:rvspin .7s linear infinite;animation-play-state:var(--rv-fxrun,paused);}
  .rv-sled{position:absolute;right:2px;top:22px;bottom:22px;width:2px;border-radius:2px;background:var(--rv-sled,#5d6670);box-shadow:0 0 6px 1px var(--rv-sledg,transparent);transition:background .8s,box-shadow .8s;}
  .rv-fx-w{position:absolute;inset:0;opacity:var(--rv-w,0);transition:opacity 1s;}
  .rv-fx-w i{position:absolute;left:55px;top:80px;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:1.5px solid rgba(125,198,255,.9);animation:rvripple 1.8s ease-out infinite;animation-play-state:var(--rv-fxrun,paused);}
  @keyframes rvripple{0%{transform:scale(.55);opacity:0;}15%{opacity:.95;}100%{transform:scale(1.4);opacity:0;}}
  .rv-fx-y{position:absolute;inset:0;opacity:var(--rv-y,0);transition:opacity 1.2s;}
  .rv-heat{position:absolute;left:55px;top:80px;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,150,80,.42),rgba(255,130,60,0));animation:rvglow 2.4s ease-in-out infinite alternate;animation-play-state:var(--rv-fxrun,paused);}
  @keyframes rvglow{0%{transform:scale(.85);opacity:.7;}100%{transform:scale(1.08);opacity:1;}}
  .rv-fx-y2{position:absolute;left:0;top:44px;width:90px;height:24px;opacity:var(--rv-y,0);transition:opacity 1.2s;}
  .rv-fx-y2 b{position:absolute;bottom:0;width:8px;height:18px;border-radius:50%;border-left:2px solid rgba(255,190,140,.8);animation:rvwave 2.2s ease-in infinite;animation-play-state:var(--rv-fxrun,paused);}
  @keyframes rvwave{0%{transform:translateY(8px) scaleY(.6);opacity:0;}30%{opacity:1;}100%{transform:translateY(-10px) scaleY(1.1);opacity:0;}}
  .rv-fx-e{position:absolute;inset:0;opacity:var(--rv-e,0);transition:opacity .8s;}
  .rv-fx-e b{position:absolute;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#f0d7ae;box-shadow:0 0 5px 1px rgba(240,200,140,.75);animation:rvsuck 1s cubic-bezier(.5,0,.9,.6) infinite;animation-play-state:var(--rv-fxrun,paused);}
  @keyframes rvsuck{0%{transform:translate(0,0) scale(1);opacity:0;}15%{opacity:1;}100%{transform:translate(-27px,-1px) scale(.3);opacity:0;}}
  .rv-g-dk{position:absolute;inset:0;opacity:var(--rv-d,0);transition:opacity .8s;}
  .rv-g-rt{position:absolute;inset:0;opacity:var(--rv-r,0);transition:opacity .8s;}
  .rv-g-cl{position:absolute;inset:0;opacity:var(--rv-c,0);transition:opacity .8s;}
  .rv-bot{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;}
  .rv-dk{transform:translate(55px,80px) rotate(180deg);}
  .rv-cl{transform:translate(124px,72px);}
  .rv-rt{transform:translate(100px,70px) rotate(160deg);}
  .rv-cl{animation:rvpath 20s linear -7s infinite;animation-play-state:var(--rv-run,paused);}
  .rv-rt{animation:rvret 6s linear infinite;animation-play-state:var(--rv-rrun,paused);}
  .rv-mop{position:absolute;left:.5px;top:6px;width:16px;height:22px;border-radius:50%;background:radial-gradient(ellipse at 40% 50%,rgba(175,215,255,.85),rgba(110,180,255,.35) 70%,rgba(110,180,255,0));opacity:calc(var(--rv-mop,0) * .9);transition:opacity .8s;}
  .rv-brush{position:absolute;left:19px;top:20px;width:16px;height:16px;}
  .rv-brush svg{display:block;width:16px;height:16px;animation:rvspin .45s linear infinite;animation-play-state:var(--rv-spin,paused);}
  .rv-brush path{stroke:rgba(235,240,246,.85);stroke-width:1.1;stroke-linecap:round;fill:none;}
  .rv-brush circle{fill:#3a414b;}
  @keyframes rvspin{to{transform:rotate(360deg);}}
  .rv-shell{position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffffff 0%,#edf0f4 42%,#c7ced7 82%,#9ba5b1 100%);box-shadow:0 0 0 .6px rgba(0,0,0,.4),0 0 7px rgba(0,0,0,.55);}
  .rv-bump{position:absolute;inset:1.2px;border-radius:50%;border:1.3px solid transparent;border-right-color:rgba(55,64,76,.38);}
  .rv-top{position:absolute;inset:5.5px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#4b5360 0%,#2a3038 55%,#161a20 100%);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.12);}
  .rv-gloss{position:absolute;left:8px;top:7px;width:10px;height:6px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.38),rgba(255,255,255,0));transform:rotate(-28deg);}
  .rv-eye{position:absolute;left:20.5px;top:12.5px;width:4px;height:5px;border-radius:1.5px;background:#0a0d11;box-shadow:0 0 0 .7px rgba(150,168,188,.7),0 0 5px rgba(110,235,255,calc(var(--rv-scan,0) * .95));transition:box-shadow .8s;}
  .rv-led{position:absolute;left:7.5px;top:14px;width:2.2px;height:2.2px;border-radius:50%;background:var(--rv-led,#454c56);box-shadow:0 0 4px 1px var(--rv-led,transparent);transition:background .8s,box-shadow .8s;}
  .rv-ring{position:absolute;inset:-4px;border-radius:50%;opacity:0;transition:opacity .8s;}
  .rv-ring u{position:absolute;inset:0;border-radius:50%;border:2px solid var(--rv-ring,transparent);animation:rvhalo 1.6s ease-out infinite;animation-play-state:var(--rv-halo,paused);}
  .rv-cl .rv-ring{opacity:var(--rv-ro,0);}
  .rv-dk .rv-ring{opacity:var(--rv-chg,0);}
  .rv-dk .rv-ring u{border-color:rgba(93,255,160,.85);animation-duration:2.4s;}
  @keyframes rvhalo{0%{transform:scale(.82);opacity:1;}100%{transform:scale(1.28);opacity:0;}}
  .rv-t{font-size:18px;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .rv-s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rv-tks{position:absolute;left:178px;right:12px;bottom:55px;display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:5px;font-size:11.5px;font-weight:600;line-height:13px;color:var(--secondary-text-color);white-space:nowrap;}
  .rv-tk{flex:none;display:flex;align-items:center;gap:4px;}
  .rv-tk i{flex:none;width:6.5px;height:6.5px;margin:2px 2px 0 1px;border-radius:0 50% 50% 50%;transform:rotate(45deg);}
  .rv-tk.c i{background:#5fb6ff;box-shadow:0 0 4px rgba(95,182,255,.6);}
  .rv-tk.d i{background:#a08f78;}
  .rv-tk b{display:flex;align-items:center;margin-left:1px;font-weight:600;}
  .rv-tk b svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .rv-tk.ok b{color:#5dd39e;}
  .rv-tk.bad,.rv-tk.bad b{color:#ff8a5c;}
  .rv-tk.bad i{background:#ff6b4f;box-shadow:0 0 5px rgba(255,107,79,.85);animation:rvblink 1s ease-in-out infinite;}
  .rv-bat{position:absolute;left:12px;bottom:11px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--primary-text-color);}
  .rv-bat i{position:relative;display:block;width:19px;height:10px;border-radius:3px;border:1.4px solid rgba(255,255,255,.5);box-sizing:border-box;}
  .rv-bat i::after{content:'';position:absolute;right:-3.8px;top:2px;width:2px;height:3.2px;border-radius:0 1px 1px 0;background:rgba(255,255,255,.5);}
  .rv-bat s{position:absolute;left:1px;top:1px;bottom:1px;width:calc((100% - 2px) * var(--bl,0));border-radius:1.5px;background:var(--bc);}
  .rv-bat svg{position:absolute;left:50%;top:50%;width:7px;height:10px;margin:-5px 0 0 -3.5px;fill:#fff;filter:drop-shadow(0 0 1px rgba(0,0,0,.8));animation:rvbolt 1.6s ease-in-out infinite;}
