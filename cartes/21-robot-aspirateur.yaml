g);}55.7%{transform:translate(84.22px,112.78px) rotate(45deg);}56.39%{transform:translate(87.79px,115.16px) rotate(22.5deg);}57.09%{transform:translate(92px,116px) rotate(0deg);}65.79%{transform:translate(146px,116px) rotate(0deg);}66.49%{transform:translate(150.21px,116.84px) rotate(22.5deg);}67.18%{transform:translate(153.78px,119.22px) rotate(45deg);}67.88%{transform:translate(156.16px,122.79px) rotate(67.5deg);}68.58%{transform:translate(157px,127px) rotate(90deg);}69.27%{transform:translate(156.16px,131.21px) rotate(112.5deg);}69.97%{transform:translate(153.78px,134.78px) rotate(135deg);}70.67%{transform:translate(150.21px,137.16px) rotate(157.5deg);}71.36%{transform:translate(146px,138px) rotate(180deg);}80.06%{transform:translate(92px,138px) rotate(180deg);}80.82%{transform:translate(87.41px,137.09px) rotate(202.5deg);}81.58%{transform:translate(83.51px,134.49px) rotate(225deg);}82.34%{transform:translate(80.91px,130.59px) rotate(247.5deg);}83.1%{transform:translate(80px,126px) rotate(270deg);}96.96%{transform:translate(80px,40px) rotate(270deg);}97.72%{transform:translate(80.91px,35.41px) rotate(292.5deg);}98.48%{transform:translate(83.51px,31.51px) rotate(315deg);}99.24%{transform:translate(87.41px,28.91px) rotate(337.5deg);}100%{transform:translate(92px,28px) rotate(360deg);}}
