  info: |-
    [[[
    const v = variables.rv;
    const S = (id) => { const s = states[id]; return s ? s.state : undefined; };
    const docked = ['dock','empty','wash','dry'].includes(v.k);
    const charging = v.chg === 'charging' && v.k !== 'off';
    const TT = {empty: ['Eau propre vide', 'Remplissez le réservoir'], missing: ['Réservoir absent', 'Remettez le réservoir'], lid: ['Couvercle ouvert', 'Fermez le couvercle'], full: ['Eau sale pleine', 'Videz le réservoir'], dmissing: ['Bac sale absent', 'Remettez le réservoir']};
    const tk = v.k === 'tank' ? (v.tc !== 'ok' ? TT[v.tc] : TT[v.td === 'missing' ? 'dmissing' : 'full']) : null;
    const T = {clean: 'Nettoyage', ret: 'Retour à la base', empty: 'Vidage du bac', wash: 'Lavage', dry: 'Séchage', dock: charging ? 'En charge' : 'À la base', pause: 'En pause', err: 'Erreur', idle: 'En attente', off: 'Hors ligne', tank: tk ? tk[0] : ''};
    const C = {clean: '#4cc9a8', ret: '#8fd0ff', empty: '#e8b06c', wash: '#6cc4ff', dry: '#ffb37a', dock: charging ? '#7fe0a0' : '#8fb3d9', pause: '#ffc46b', err: '#ff6b5f', idle: '#8fb3d9', off: 'var(--secondary-text-color)', tank: '#ff8a5c'};
    const M = {'Vacuum & Mop': 'Aspiration + serpillière', 'Vacuum-Only': 'Aspiration seule', 'Mopping': 'Serpillière seule', 'Mop after Vacuum': 'Aspiration puis serpillière'};
    const E = {stuck: 'Robot coincé', wheels_jammed: 'Roues bloquées', brush_jammed: 'Brosse bloquée', dust_bin_missing: 'Bac à poussière absent', dust_bin_full: 'Bac à poussière plein', water_tank_empty: 'Réservoir d’eau vide', water_tank_missing: 'Réservoir d’eau absent', water_tank_lid_open: 'Couvercle du réservoir ouvert', dirty_water_tank_full: 'Réservoir d’eau sale plein', dirty_water_tank_missing: 'Réservoir d’eau sale absent', mop_cleaning_pad_missing: 'Serpillière absente', low_battery: 'Batterie faible', cannot_reach_target_area: 'Zone inaccessible', failed_to_find_charging_dock: 'Station introuvable', navigation_sensor_obscured: 'Capteur de navigation obstrué', unable_to_start_or_resume: 'Démarrage impossible', unable_to_complete_operation: 'Tâche interrompue', command_invalid_in_state: 'Commande refusée'};
    const area = parseFloat(S('sensor.robot_nettoyeur_surface_nettoyee'));
    const mins = parseFloat(S('sensor.robot_nettoyeur_duree_de_nettoyage'));
    let dur = '';
    if (!isNaN(mins)) { const t = Math.round(mins); dur = t >= 60 ? Math.floor(t / 60) + ' h ' + String(t % 60).padStart(2, '0') : t + ' min'; }
    const job = [isNaN(area) ? '' : '<b>' + Math.round(area) + ' m²</b>', dur].filter(Boolean).join(' · ');
    const mode = M[v.mode] || '';
    const tf = parseFloat(S('sensor.robot_aspirateur_temps_avant_charge_complete'));
    let d = '';
    if (v.k === 'clean') d = [job, mode].filter(Boolean).join(' · ');
    else if (v.k === 'pause') d = job ? job + ' · tâche en pause' : 'Tâche en pause';
    else if (v.k === 'ret') d = v.ph === 'Return Collect Dirt' ? 'Pour vider le bac' : (v.ph === 'Return Wash Mop' ? 'Pour laver la serpillière' : (v.ph === 'Return Collect And Wash' ? 'Pour vider le bac et laver la serpillière' : 'Vers la station'));
    else if (v.k === 'empty') d = 'La station aspire le bac';
    else if (v.k === 'wash') d = 'La station lave la serpillière';
    else if (v.k === 'dry') d = 'Serpillière séchée à l’air chaud';
    else if (v.k === 'dock') d = charging && tf > 0 ? 'Pleine dans ' + Math.round(tf) + ' min' : (job ? 'Dernier : ' + job : 'Prêt');
    else if (v.k === 'tank') d = tk[1];
    else if (v.k === 'err') d = E[v.er] || 'Vérifiez le robot';
    else if (v.k === 'idle') d = 'Hors de la station';
    else d = 'Robot injoignable';
    const bt = isNaN(v.b) ? null : Math.max(0, Math.min(100, Math.round(v.b)));
    const bc = bt === null ? 'transparent' : (bt <= 20 ? '#ff6b5f' : (bt <= 45 ? '#ffc46b' : '#5dd39e'));
    const bolt = charging ? '<svg viewBox="0 0 7 10"><path d="M4.2 0 0 5.6h2.6L2 10l5-6.2H4.3z"/></svg>' : '';
    const pill = (bt === null || v.k === 'off') ? '' : `<div class='rv-bat' style='--bl:${bt / 100};--bc:${bc}'><i><s></s>${bolt}</i><span>${bt} %</span></div>`;
    const okc = '<svg viewBox="0 0 10 10"><path d="M1.5 5.2 4 7.6 8.6 2.6"/></svg>';
    const KC = {ok: ['ok', okc], empty: ['bad', 'vide'], missing: ['bad', 'absent'], lid: ['bad', 'ouvert'], unk: ['unk', '–']}[v.tc];
    const KD = {ok: ['ok', okc], full: ['bad', 'pleine'], missing: ['bad', 'absent'], unk: ['unk', '–']}[v.td];
    const tanks = v.k === 'off' ? '' : `<div class='rv-tks'><span class='rv-tk c ${KC[0]}'><i></i>Eau propre<b>${KC[1]}</b></span>`
     + `<span class='rv-tk d ${KD[0]}'><i></i>Eau sale<b>${KD[1]}</b></span></div>`;
    return `<div class='hd-info' style='left:178px;right:12px;top:12px'><div class='hd-name'>Robot aspirateur</div>`
     + `<div class='hd-title rv-t' style='color:${C[v.k]}'>${T[v.k]}</div><div class='hd-sub rv-s'>${d}</div></div>${tanks}${pill}`;
    ]]]
