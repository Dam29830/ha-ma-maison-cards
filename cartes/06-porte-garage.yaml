# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Porte de garage
#  Porte de garage animée (ouverture, fermeture, état) avec boutons ouvrir / fermer.
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - cover.porte_de_garage
#  Nécessite : button-card (HACS)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:button-card
entity: cover.porte_de_garage
name: Porte de garage
custom_fields:
  close:
    card:
      color: var(--primary-text-color)
      icon: mdi:arrow-down
      show_name: false
      styles:
        card:
          - height: 32px
          - width: 100%
          - padding: 0 6px
          - border-radius: 12px
          - background: rgba(255,255,255,0.08)
          - border: 1px solid rgba(255,255,255,0.16)
          - box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)
          - transition: background .4s, border-color .4s, box-shadow .4s
        grid:
          - grid-template-areas: '"i"'
          - grid-template-columns: min-content
          - grid-template-rows: 1fr
          - justify-content: center
          - align-items: center
        icon:
          - width: 18px
          - height: 18px
        img_cell:
          - width: 18px
          - height: 18px
      tap_action:
        action: perform-action
        perform_action: cover.close_cover
        target:
          entity_id: cover.porte_de_garage
      type: custom:button-card
  info: |-
    [[[
    const st = entity ? entity.state : 'unavailable';
    const M = {open: ['Ouverte', '#ffc145'], closed: ['Fermée', '#4cc9a8'], opening: ['Ouverture…', '#ffc145'], closing: ['Fermeture…', '#ffc145']};
    const m = M[st] || ['Indisponible', 'var(--secondary-text-color)'];
    let d = '';
    if (entity && M[st] && entity.last_changed) { d = 'depuis ' + new Date(entity.last_changed).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}); }
    return `<div class='hd-info' style='left:14px;right:12px;top:11px'><div class='hd-name'>Porte de garage</div></div>`
     + `<div class='hd-info' style='left:84px;right:10px;top:50px'><div class='hd-title s' style='color:${m[1]}'>${m[0]}</div>${d ? `<div class='hd-sub'>${d}</div>` : ''}</div>`;
    ]]]
  open:
    card:
      color: var(--primary-text-color)
      icon: mdi:arrow-up
      show_name: false
      styles:
        card:
          - height: 32px
          - width: 100%
          - padding: 0 6px
          - border-radius: 12px
          - background: rgba(255,255,255,0.08)
          - border: 1px solid rgba(255,255,255,0.16)
          - box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)
          - transition: background .4s, border-color .4s, box-shadow .4s
        grid:
          - grid-template-areas: '"i"'
          - grid-template-columns: min-content
          - grid-template-rows: 1fr
          - justify-content: center
          - align-items: center
        icon:
          - width: 18px
          - height: 18px
        img_cell:
          - width: 18px
          - height: 18px
      tap_action:
        action: perform-action
        perform_action: cover.open_cover
        target:
          entity_id: cover.porte_de_garage
      type: custom:button-card
  scene: <div class="hd-scene"><div class="gd"><div class="gd-roof"></div><div class="gd-wall"></div><div class="gd-hole"><div class="gd-in"><div class="gd-car"></div><div class="gd-lamp"></div></div><div class="gd-door"><i></i><i></i><i></i><i></i><i></i></div></div><div class="gd-beacon"><i></i></div><div class="gd-ground"></div></div></div>
extra_styles: |-
  .hd-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .hd-info{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;white-space:normal;min-width:0;}
  .hd-name{font-size:13px;font-weight:600;line-height:1.25;color:var(--secondary-text-color);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hd-name.w{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .hd-title{font-size:22px;font-weight:600;line-height:1.15;color:var(--primary-text-color);transition:color .8s;}
  .hd-title.s{font-size:15.5px;}
  .hd-sub{font-size:12.5px;line-height:1.3;color:var(--secondary-text-color);}
  .hd-sub b{color:var(--primary-text-color);font-weight:600;}
  @media (prefers-reduced-motion: reduce){.hd-scene *,.hd-scene *::before,.hd-scene *::after{animation:none !important;}}
  .gd{position:absolute;left:10px;top:38px;width:58px;height:64px;}
  .gd-roof{position:absolute;left:-4px;right:-4px;top:0;height:14px;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);background:linear-gradient(180deg,#6b7382,#3b414c);}
  .gd-wall{position:absolute;left:0;right:0;top:13px;bottom:5px;background:linear-gradient(90deg,#d3d9e0,#eef2f6 45%,#cbd2da);}
  .gd-hole{position:absolute;left:7px;right:7px;top:23px;bottom:5px;overflow:hidden;background:#0a0d12;box-shadow:inset 0 0 0 2px #98a2ad;}
  .gd-in{position:absolute;inset:2px;background:linear-gradient(180deg,#141920,#232a33);}
  .gd-lamp{position:absolute;left:50%;top:0;width:60px;height:40px;margin-left:-30px;background:radial-gradient(ellipse at 50% 0%,rgba(255,226,150,.75),rgba(255,210,120,0) 70%);opacity:var(--gd-light,0);transition:opacity 1.5s;}
  .gd-car{position:absolute;left:5px;right:5px;bottom:2px;height:13px;border-radius:7px 9px 3px 3px;background:linear-gradient(180deg,#5f7fa8,#34506f);}
  .gd-car::before,.gd-car::after{content:'';position:absolute;bottom:-2px;width:7px;height:7px;border-radius:50%;background:#111;box-shadow:inset 0 0 0 2px #444;}
  .gd-car::before{left:3px;}
  .gd-car::after{right:3px;}
  .gd-door{position:absolute;left:2px;right:2px;top:2px;bottom:0;transform:translateY(calc(var(--gd-open,0) * -100%));transition:transform var(--gd-dur,1.2s) linear;}
  .gd-door i{display:block;height:20%;box-sizing:border-box;background:linear-gradient(180deg,#f2f5f8 0%,#d7dde4 75%,#aeb7c1 100%);border-bottom:1px solid #8f99a4;}
  .gd-beacon{position:absolute;left:2px;top:15px;width:7px;height:5px;border-radius:4px 4px 1px 1px;background:#8a5516;}
  .gd-beacon i{position:absolute;left:-5px;top:-6px;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,50,1),rgba(255,140,20,0) 65%);opacity:var(--gd-mv,0);animation:hdbeacon .9s ease-in-out infinite;}
  .gd-ground{position:absolute;left:-8px;right:-8px;bottom:0;height:6px;border-radius:3px;background:linear-gradient(180deg,#7d858f,#525a64);}
  @keyframes hdbeacon{0%,100%{transform:scale(.6);filter:brightness(.4);}50%{transform:scale(1.15);filter:brightness(1.4);}}
grid_options:
  columns: 6
  rows: auto
show_icon: false
show_name: false
styles:
  card:
    - height: 160px
    - border-radius: 24px
    - overflow: hidden
    - padding: '0'
    - background: rgba(140,170,200,0.10)
    - backdrop-filter: blur(16px) saturate(170%)
    - -webkit-backdrop-filter: blur(16px) saturate(170%)
    - border: 1px solid rgba(255,255,255,0.16)
    - box-shadow: 0 8px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.22)
    - --gd-open: "[[[ return String((entity && ['open','opening'].includes(entity.state)) ? 1 : 0); ]]]"
    - --gd-dur: "[[[ return String((entity && ['opening','closing'].includes(entity.state)) ? ((entity.attributes.transition_duration || 30) + 's') : '1.2s'); ]]]"
    - --gd-mv: "[[[ return String((entity && ['opening','closing'].includes(entity.state)) ? 1 : 0); ]]]"
    - --gd-light: "[[[ return String((entity && ['open','opening','closing'].includes(entity.state)) ? 1 : 0); ]]]"
  custom_fields:
    close:
      - position: absolute
      - right: 12px
      - bottom: 12px
      - width: calc((100% - 24px - 6px) / 2)
      - height: 32px
    info:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
    open:
      - position: absolute
      - left: 12px
      - bottom: 12px
      - width: calc((100% - 24px - 6px) / 2)
      - height: 32px
    scene:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
  grid:
    - position: relative
tap_action:
  action: more-info
