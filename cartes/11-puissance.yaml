# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Puissance instantanée
#  Consommation électrique en direct (W) avec jauge animée.
#  Même carte pour le chauffe-eau et le radiateur : changez l'entité, le libellé « Consommation »
#  écrit dans le champ info, et la pleine échelle de la jauge (w / 2400).
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - sensor.chauffe_eau_puissance
#  Nécessite : button-card (HACS)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:button-card
entity: sensor.chauffe_eau_puissance
name: Consommation
custom_fields:
  info: |-
    [[[
    let w = entity ? parseFloat(entity.state) : NaN; if (!isNaN(w) && entity.attributes.unit_of_measurement === 'kW') w = w * 1000;
    const ok = !isNaN(w);
    const v = ok ? Math.round(w).toLocaleString('fr-FR') + ' W' : '—';
    return `<div class='hd-info' style='left:14px;right:12px;top:11px'><div class='hd-name'>Consommation</div></div>`
     + `<div class='hd-info' style='left:68px;right:10px;top:46px'><div class='hd-title s' style='font-size:21px;color:${ok && w >= 1 ? '#ffb36a' : 'var(--primary-text-color)'}'>${v}</div></div>`;
    ]]]
  scene: <div class="hd-scene"><svg class="sp-ring" viewBox="0 0 52 52" aria-hidden="true"><circle class="bg" cx="26" cy="26" r="21"/><circle class="fg" cx="26" cy="26" r="21"/></svg><div class="sp-bolt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></div></div>
extra_styles: |-
  .hd-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .hd-info{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;white-space:normal;min-width:0;}
  .hd-name{font-size:13px;font-weight:600;line-height:1.25;color:var(--secondary-text-color);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hd-name.w{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .hd-title{font-size:22px;font-weight:600;line-height:1.15;color:var(--primary-text-color);transition:color .8s;}
  .hd-title.s{font-size:15.5px;}
  .hd-sub{font-size:12.5px;line-height:1.3;color:var(--secondary-text-color);}
  .hd-sub b{color:var(--primary-text-color);font-weight:600;}
  @media (prefers-reduced-motion: reduce){.hd-scene *,.hd-scene *::before,.hd-scene *::after{animation:none !important;}}
  .sp-ring{position:absolute;left:12px;top:36px;width:46px;height:46px;transform:rotate(-90deg);overflow:visible;}
  .sp-ring circle{fill:none;stroke-width:5;}
  .sp-ring .bg{stroke:rgba(255,255,255,.12);}
  .sp-ring .fg{stroke:#ff9a4a;stroke-linecap:round;stroke-dasharray:131.95;stroke-dashoffset:calc(131.95px * (1 - var(--sp-r,0)));transition:stroke-dashoffset 1.6s ease;filter:drop-shadow(0 0 3px rgba(255,150,70,.7));opacity:calc(.25 + var(--sp-on,0) * .75);}
  .sp-bolt{position:absolute;left:25px;top:49px;width:20px;height:20px;}
  .sp-bolt svg{position:relative;z-index:1;width:100%;height:100%;fill:var(--sp-bolt,#5d6670);transition:fill .8s;}
  .sp-bolt::after{content:'';position:absolute;inset:-7px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,90,.55),rgba(255,180,60,0));opacity:var(--sp-on,0);animation:hdpulse 1.4s ease-in-out infinite;}
  @keyframes hdpulse{0%,100%{transform:scale(.8);}50%{transform:scale(1.15);}}
grid_options:
  columns: 6
  rows: auto
show_icon: false
show_name: false
styles:
  card:
    - height: 100px
    - border-radius: 24px
    - overflow: hidden
    - padding: '0'
    - background: rgba(140,170,200,0.10)
    - backdrop-filter: blur(16px) saturate(170%)
    - -webkit-backdrop-filter: blur(16px) saturate(170%)
    - border: 1px solid rgba(255,255,255,0.16)
    - box-shadow: 0 8px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.22)
    - --sp-r: "[[[ return String((() => { const w = (() => { let w = entity ? parseFloat(entity.state) : NaN; if (!isNaN(w) && entity.attributes.unit_of_measurement === 'kW') w = w * 1000; return w; })(); return isNaN(w) ? 0 : Math.max(0, Math.min(1, w / 2400)).toFixed(3); })()); ]]]"
    - --sp-on: "[[[ return String(((() => { let w = entity ? parseFloat(entity.state) : NaN; if (!isNaN(w) && entity.attributes.unit_of_measurement === 'kW') w = w * 1000; return w; })() >= 1) ? 1 : 0); ]]]"
    - --sp-bolt: "[[[ return String(((() => { let w = entity ? parseFloat(entity.state) : NaN; if (!isNaN(w) && entity.attributes.unit_of_measurement === 'kW') w = w * 1000; return w; })() >= 1) ? '#ffc773' : '#5d6670'); ]]]"
  custom_fields:
    info:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
    scene:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
  grid:
    - position: relative
tap_action:
  action: more-info
