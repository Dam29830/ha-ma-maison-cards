# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Ballon d'eau chaude
#  Ballon animé : eau chaude disponible, chauffe en cours, boost, absence, erreurs.
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - sensor.domestic_hot_water_hot_water_available
#    - sensor.domestic_hot_water_resistance
#    - switch.domestic_hot_water_boost_eau_chaude
#    - sensor.domestic_hot_water_boost_eau_chaude
#    - sensor.domestic_hot_water_absence
#    - sensor.domestic_hot_water_code_erreur_eau_chaude
#    - sensor.domestic_hot_water_temperature_haut_reservoir
#    - sensor.domestic_hot_water_eau_v40_disponible
#    - sensor.chauffe_eau_puissance
#  Nécessite : button-card (HACS) + chauffe-eau Atlantic Cozytouch (intégration HACS cozytouch)
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:button-card
entity: sensor.domestic_hot_water_hot_water_available
name: "Ballon d'eau chaude"
custom_fields:
  disp: |-
    [[[
    const p = variables.wh;
    let txt = '--';
    if (p.m === 'error') txt = 'Err';
    else if (p.top !== null && p.m !== 'unknown') txt = Math.round(p.top) + '°';
    return `<div class='wh-dsp'>${txt}</div>`;
    ]]]
  info: |-
    [[[
    const p = variables.wh;
    const fmt = (v) => Number(v).toLocaleString('fr-FR', {maximumFractionDigits: 0});
    let meta = '';
    if (p.av !== null) meta = `<div class='wh-meta'><b>${fmt(p.av)} %</b> d'eau chaude</div>`;
    let pow = '';
    if (p.av !== null || p.v40 !== null) {
      const lv = p.av === null ? 0 : Math.ceil(p.av / 20 - 0.0001);
      let bars = '';
      for (let i = 1; i <= 5; i++) bars += `<i class='${i <= lv ? 'on' : ''}' style='height:${3 + i * 2}px'></i>`;
      const txt = p.v40 !== null ? `≈ ${fmt(p.v40)} L à 40 °C` : '';
      pow = `<div class='wh-pow'><span class='bars'>${bars}</span>${txt}</div>`;
    }
    return `<div class='wh-info'><div class='wh-name'>Ballon d'eau chaude</div><div class='wh-title'>${p.t}</div>${p.d ? `<div class='wh-sub'>${p.d}</div>` : ''}${meta}${pow}</div>`;
    ]]]
  scene: <div class="wh-scene"><div class="wh-room"><i></i></div><div class="wh-tank"><div class="wh-wshadow"></div><div class="wh-pipe c"></div><div class="wh-pipe h"></div><div class="wh-valve c"></div><div class="wh-valve h"></div><div class="wh-body"></div><div class="wh-tint"></div><div class="wh-cap"></div><div class="wh-seam t"></div><div class="wh-seam b"></div><div class="wh-panel"><span class="wh-led"></span></div><div class="wh-win"><div class="wh-hot"><span class="wh-wave"></span></div><div class="wh-hglow"></div><div class="wh-flow"><i style="left:28%;animation-duration:2.8s;animation-delay:-0.3s"></i><i style="left:50%;animation-duration:3.3s;animation-delay:-1.6s"></i><i style="left:70%;animation-duration:2.6s;animation-delay:-2.2s"></i></div><div class="wh-flange"></div><div class="wh-res"><span class="wh-resh"></span></div><div class="wh-bub"><i style="left:22%;animation-duration:2.4s;animation-delay:-0.2s;width:4px;height:4px"></i><i style="left:38%;animation-duration:2.9s;animation-delay:-1.3s;width:3px;height:3px"></i><i style="left:54%;animation-duration:2.2s;animation-delay:-0.7s;width:5px;height:5px"></i><i style="left:68%;animation-duration:2.7s;animation-delay:-1.9s;width:3px;height:3px"></i><i style="left:30%;animation-duration:3.1s;animation-delay:-2.4s;width:4px;height:4px"></i><i style="left:61%;animation-duration:2.5s;animation-delay:-1.1s;width:4px;height:4px"></i><i style="left:46%;animation-duration:2.8s;animation-delay:-2.0s;width:3px;height:3px"></i><i style="left:76%;animation-duration:3.0s;animation-delay:-0.4s;width:3px;height:3px"></i></div><div class="wh-frost"><span>❄</span></div><div class="wh-ticks"></div><div class="wh-glass"></div></div></div></div>
double_tap_action:
  action: none
extra_styles: |-
  .wh-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .wh-room{position:absolute;left:-94px;top:-58px;width:340px;height:320px;opacity:var(--wh-glow,0);visibility:var(--wh-vis,visible);transition:opacity 2.4s ease,visibility 2.6s linear;}
  .wh-room i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,rgba(255,140,60,.34),rgba(255,110,40,.12) 48%,rgba(255,90,30,0) 100%);animation:whbreathe 3s ease-in-out infinite alternate;}
  .wh-tank{position:absolute;left:32px;top:12px;width:88px;height:160px;}
  .wh-wshadow{position:absolute;left:12px;right:-10px;top:10px;bottom:-4px;border-radius:44px/20px;background:rgba(0,0,0,.38);filter:blur(9px);}
  .wh-pipe{position:absolute;top:150px;width:7px;height:70px;}
  .wh-pipe.c{left:22px;background:linear-gradient(90deg,#1f4f80,#5a9ee0 45%,#244f7d);}
  .wh-pipe.h{right:22px;background:linear-gradient(90deg,#7a2412,#e2603a 45%,#7d2613);}
  .wh-valve{position:absolute;top:174px;width:15px;height:6px;border-radius:2px;background:linear-gradient(180deg,#d4ad55,#86651f);box-shadow:0 1px 2px rgba(0,0,0,.5);}
  .wh-valve.c{left:18px;}.wh-valve.h{right:18px;}
  .wh-body{position:absolute;inset:0;border-radius:44px 44px 40px 40px/20px 20px 16px 16px;background:linear-gradient(90deg,#8a95a1 0%,#c9d1da 16%,#e8edf2 34%,#dde3ea 58%,#b3bdc8 80%,#808b97 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.45);}
  .wh-tint{position:absolute;inset:0;border-radius:44px 44px 40px 40px/20px 20px 16px 16px;background:linear-gradient(90deg,rgba(150,200,255,.0),rgba(150,200,255,.28) 40%,rgba(150,200,255,.12));opacity:var(--wh-cold,0);transition:opacity 2s ease;}
  .wh-cap{position:absolute;left:12px;right:12px;top:3px;height:11px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.8),rgba(255,255,255,0));}
  .wh-seam{position:absolute;left:2px;right:2px;height:2px;border-radius:1px;background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(255,255,255,.35));}
  .wh-seam.t{top:35px;}.wh-seam.b{bottom:13px;}
  .wh-panel{position:absolute;left:20px;right:20px;top:14px;height:15px;border-radius:4px;background:#0c0f14;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.6);}
  .wh-led{position:absolute;left:5px;top:5.5px;width:4px;height:4px;border-radius:50%;background:var(--wh-led,#3b4048);box-shadow:0 0 5px 1px var(--wh-ledg,transparent);transition:background .8s,box-shadow .8s;}
  .wh-win{position:absolute;left:16px;right:16px;top:40px;bottom:22px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#2b78c2 0%,#1f5c9b 55%,#163e6b 100%);box-shadow:0 0 0 2px rgba(55,65,78,.6),0 0 0 3px rgba(255,255,255,.4),inset 0 0 10px rgba(0,0,0,.55);}
  .wh-hot{position:absolute;left:0;right:0;top:0;height:calc(var(--wh-level,0) * 100%);opacity:clamp(0,calc(var(--wh-level,0) * 25),1);background:linear-gradient(180deg,#ff4f22 0%,#ff6f2e 40%,#ff9246 78%,#ffad62 100%);transition:height 2.8s cubic-bezier(.3,.7,.3,1),opacity 1s ease;}
  .wh-hot::after{content:'';position:absolute;left:0;right:0;bottom:-11px;height:12px;background:linear-gradient(180deg,rgba(255,173,98,.95),rgba(255,173,98,0));}
  .wh-wave{position:absolute;left:-24px;right:-24px;bottom:-5px;height:8px;background:radial-gradient(ellipse 9px 3px at 50% 50%,rgba(255,240,220,.55),rgba(255,240,220,0)) 0 0/16px 8px repeat-x;animation:whwave 2.4s linear infinite;}
  .wh-hglow{position:absolute;inset:0;background:radial-gradient(ellipse 80% 45% at 50% 100%,rgba(255,150,70,.55),rgba(255,120,50,0) 75%);opacity:var(--wh-heat,0);transition:opacity 1.8s ease;}
  .wh-flow{position:absolute;inset:0;opacity:var(--wh-heat,0);visibility:var(--wh-vis,visible);transition:opacity 1.5s ease,visibility 2.6s linear;}
  .wh-flow i{position:absolute;bottom:-34px;width:3px;height:34px;border-radius:2px;background:linear-gradient(180deg,rgba(255,240,220,0),rgba(255,240,220,.38),rgba(255,240,220,0));animation:whflow 2.8s linear infinite;}
  .wh-flange{position:absolute;left:0;bottom:5px;width:6px;height:15px;border-radius:0 2px 2px 0;background:linear-gradient(90deg,#2a2f36,#4d555f);}
  .wh-res{position:absolute;left:5px;right:9px;bottom:7px;height:9px;border:2.5px solid #5b646e;border-left-color:transparent;border-radius:6px;}
  .wh-resh{position:absolute;inset:-2.5px;border:2.5px solid #ff6a1c;border-left-color:transparent;border-radius:6px;box-shadow:0 0 8px 2px rgba(255,110,40,.75),inset 0 0 5px rgba(255,150,70,.7);opacity:var(--wh-heat,0);transition:opacity 1.6s ease;animation:whres 1.5s ease-in-out infinite alternate;}
  .wh-bub{position:absolute;inset:0;opacity:var(--wh-heat,0);visibility:var(--wh-vis,visible);transition:opacity 1.2s ease,visibility 2.6s linear;}
  .wh-bub i{position:absolute;bottom:12px;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.2);opacity:0;animation:whbubl 2.4s ease-in infinite;}
  .wh-bub i:nth-child(even){animation-name:whbubr;}
  .wh-frost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(210,235,255,.38),rgba(210,235,255,.12));opacity:var(--wh-cold,0);transition:opacity 2s ease;}
  .wh-frost span{font-size:20px;line-height:1;color:#e8f4ff;text-shadow:0 0 6px rgba(160,210,255,.9);}
  .wh-ticks{position:absolute;right:3px;top:0;bottom:0;width:7px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 100% 25%/5px 1px no-repeat,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 100% 50%/7px 1px no-repeat,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 100% 75%/5px 1px no-repeat;}
  .wh-glass{position:absolute;inset:0;border-radius:12px;background:linear-gradient(100deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.08) 22%,rgba(255,255,255,0) 24%,rgba(255,255,255,0) 64%,rgba(255,255,255,.10) 66%,rgba(255,255,255,0) 74%);}
  .wh-dsp{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;box-sizing:border-box;font:600 10.5px/1 ui-monospace,'SF Mono',Menlo,Consolas,monospace;letter-spacing:.4px;color:var(--wh-dsp,#9fd8ff);text-shadow:0 0 4px var(--wh-dsp,#9fd8ff);white-space:nowrap;}
  .wh-info{position:absolute;left:148px;right:14px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:left;white-space:normal;}
  .wh-name{font-size:13px;font-weight:600;color:var(--secondary-text-color);opacity:.9;}
  .wh-title{font-size:24px;font-weight:600;line-height:1.15;color:var(--wh-accent,var(--primary-text-color));}
  .wh-sub{font-size:12.5px;line-height:1.3;color:var(--secondary-text-color);}
  .wh-meta{font-size:12.5px;line-height:1.3;color:var(--primary-text-color);margin-top:4px;}
  .wh-meta span{color:var(--secondary-text-color);}
  .wh-pow{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11.5px;color:var(--secondary-text-color);}
  .wh-pow .bars{display:flex;align-items:flex-end;gap:2px;height:13px;}
  .wh-pow .bars i{width:4px;border-radius:1.5px;background:#ff8a3d;opacity:.2;}
  .wh-pow .bars i.on{opacity:1;}
  @keyframes whbreathe{0%{transform:scale(.97);opacity:.78;}100%{transform:scale(1.04);opacity:1;}}
  @keyframes whwave{from{transform:translateX(0);}to{transform:translateX(16px);}}
  @keyframes whflow{0%{transform:translateY(0);opacity:0;}15%{opacity:1;}85%{opacity:.9;}100%{transform:translateY(-132px);opacity:0;}}
  @keyframes whres{0%{filter:brightness(.85);}100%{filter:brightness(1.3);}}
  @keyframes whbubl{0%{transform:translate(0,0) scale(.6);opacity:0;}10%{opacity:.95;}50%{transform:translate(-3px,-42px) scale(.9);}100%{transform:translate(2px,-84px) scale(1.15);opacity:0;}}
  @keyframes whbubr{0%{transform:translate(0,0) scale(.6);opacity:0;}10%{opacity:.95;}50%{transform:translate(3px,-40px) scale(.9);}100%{transform:translate(-2px,-82px) scale(1.15);opacity:0;}}
  @media (prefers-reduced-motion: reduce){.wh-scene *{animation:none !important;}}
grid_options:
  columns: 12
  rows: auto
hold_action:
  action: none
show_icon: false
show_label: false
show_name: false
show_state: false
styles:
  card:
    - height: 200px
    - border-radius: 24px
    - overflow: hidden
    - padding: '0'
    - background: rgba(140,170,200,0.10)
    - backdrop-filter: blur(16px) saturate(170%)
    - -webkit-backdrop-filter: blur(16px) saturate(170%)
    - border: 1px solid rgba(255,255,255,0.16)
    - box-shadow: 0 8px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.22)
    - --wh-level: '[[[ return String(variables.wh.lvl); ]]]'
    - --wh-heat: '[[[ return String(variables.wh.heat); ]]]'
    - --wh-glow: '[[[ return String(variables.wh.glow); ]]]'
    - --wh-vis: '[[[ return String(variables.wh.vis); ]]]'
    - --wh-cold: '[[[ return String(variables.wh.cold); ]]]'
    - --wh-led: '[[[ return String(variables.wh.led); ]]]'
    - --wh-ledg: '[[[ return String(variables.wh.ledg); ]]]'
    - --wh-dsp: '[[[ return String(variables.wh.dsp); ]]]'
    - --wh-accent: '[[[ return String(variables.wh.c); ]]]'
  custom_fields:
    disp:
      - position: absolute
      - left: 52px
      - top: 26px
      - width: 48px
      - height: 15px
    info:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
    scene:
      - position: absolute
      - inset: '0'
      - width: 100%
      - height: 100%
  grid:
    - position: relative
tap_action:
  action: more-info
triggers_update:
  - sensor.domestic_hot_water_resistance
  - switch.domestic_hot_water_boost_eau_chaude
  - sensor.domestic_hot_water_boost_eau_chaude
  - sensor.domestic_hot_water_absence
  - sensor.domestic_hot_water_code_erreur_eau_chaude
  - sensor.domestic_hot_water_temperature_haut_reservoir
  - sensor.domestic_hot_water_eau_v40_disponible
  - sensor.chauffe_eau_puissance
variables:
  wh: |-
    [[[
    const S = (id) => { const s = states[id]; return s ? String(s.state) : 'unavailable'; };
    const N = (id) => { const v = parseFloat(S(id)); return isNaN(v) ? null : v; };
    const av = N('sensor.domestic_hot_water_hot_water_available');
    const rs = S('sensor.domestic_hot_water_resistance');
    const res = rs === 'on';
    const boost = S('switch.domestic_hot_water_boost_eau_chaude') === 'on' || S('sensor.domestic_hot_water_boost_eau_chaude') === 'on';
    const away = S('sensor.domestic_hot_water_absence') === 'on';
    const err = S('sensor.domestic_hot_water_code_erreur_eau_chaude');
    const pw = N('sensor.chauffe_eau_puissance');
    const W = (v) => Math.round(v).toLocaleString('fr-FR') + ' W';
    let m;
    if (av === null && (rs === 'unavailable' || rs === 'unknown')) m = 'unknown';
    else if (err && !['OK', 'unknown', 'unavailable'].includes(err)) m = 'error';
    else if (res && boost) m = 'boost';
    else if (res) m = 'heat';
    else if (away) m = 'away';
    else if (av !== null && av >= 95) m = 'full';
    else m = 'idle';
    const T = {
      heat:    {t: 'En chauffe',   d: pw > 0 ? 'Résistance active · ' + W(pw) : 'Résistance active', c: '#ff7a3d', led: '#ff7a3d', dsp: '#ffb36a'},
      boost:   {t: 'Boost',        d: pw > 0 ? 'Chauffe rapide · ' + W(pw) : 'Chauffe rapide',        c: '#ffb13d', led: '#ffb13d', dsp: '#ffc773'},
      full:    {t: 'Plein',        d: 'Eau chaude prête',          c: '#4cc9a8', led: '#4cc9a8', dsp: '#9fd8ff'},
      idle:    {t: 'En attente',   d: 'Résistance au repos',       c: '#8fb3d9', led: '#3b4048', dsp: '#9fd8ff'},
      away:    {t: 'Absent',       d: 'Mode absence',              c: '#7fb7ff', led: '#7fb7ff', dsp: '#9fd8ff'},
      error:   {t: 'Erreur',       d: 'Code ' + err,               c: '#ff4d4d', led: '#ff4d4d', dsp: '#ff7b7b'},
      unknown: {t: 'Indisponible', d: 'Pas de nouvelles du ballon', c: 'var(--secondary-text-color)', led: '#3b4048', dsp: '#5d6670'}
    };
    const p = Object.assign({m: m}, T[m]);
    const hot = (m === 'heat' || m === 'boost');
    p.av = av;
    p.lvl = av === null ? 0 : Math.max(0, Math.min(1, av / 100)).toFixed(3);
    p.heat = hot ? 1 : 0;
    p.glow = hot ? 1 : 0;
    p.vis = hot ? 'visible' : 'hidden';
    p.cold = m === 'away' ? 1 : 0;
    p.ledg = p.led === '#3b4048' ? 'transparent' : p.led;
    p.v40 = N('sensor.domestic_hot_water_eau_v40_disponible');
    p.top = N('sensor.domestic_hot_water_temperature_haut_reservoir');
    return p;
    ]]]
