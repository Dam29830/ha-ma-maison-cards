00) contrast(1.00);animation-timing-function:ease-in;}94%,100%{transform:scaleY(1.00);filter:brightness(1.00) contrast(1.00);}}.jstage::before{left:0;right:auto;top:3px;width:150px;height:22.1px;border-radius:0;clip-path:polygon(8.7% 77.0%,10.8% 33.6%,11.3% 30.0%,13.4% 26.4%,28.2% 11.5%,53.5% 9.0%,69.7% 14.9%,90.8% 26.4%,92.9% 30.0%,93.9% 51.7%,93.9% 69.8%,93.4% 73.4%,91.3% 80.7%,81.8% 95.3%,78.1% 99.0%,63.9% 99.9%,39.3% 96.1%,16.6% 91.6%,9.2% 87.9%,8.7% 80.6%);background:linear-gradient(180deg,#767c84 0,#50565e 10%,#2b2f35 32%,#121417 62%,#060708 100%);animation:jholeback 1.8s linear infinite;}@keyframes jholeback{0%,7%{opacity:0;}9%,83%{opacity:1;}86%,100%{opacity:0;}}.jwh2{transform:scaleX(-1);position:absolute;left:11.1px;top:186.7px;width:20.5px;height:52.9px;z-index:1;filter:brightness(.78);}.jabri{position:absolute;top:42px;left:14px;font-size:11px;font-weight:700;line-height:1;padding:5px 8px;border-radius:999px;background:rgba(102,187,106,.24);border:1px solid rgba(165,214,167,.6);color:#dff5e0;white-space:nowrap;}.jwchip~.jabri{top:68px;}"
