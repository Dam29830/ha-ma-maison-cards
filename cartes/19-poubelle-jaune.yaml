-width:0;text-align:left;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.5);}ha-card:has(.jhdr.veille) .jbinbox{animation:jshake 5s ease-in-out infinite;transform-origin:50% 100%;}@keyframes jshake{0%,84%,100%{transform:rotate(0deg);}86%{transform:rotate(-4deg);}88%{transform:rotate(3.5deg);}90%{transform:rotate(-3deg);}92%{transform:rotate(2.5deg);}94%{transform:rotate(-1.5deg);}96%{transform:rotate(1deg);}98%{transform:rotate(-.5deg);}}ha-card:has(.jhdr.vent) .jbinbox{animation:none;z-index:4;}ha-card:has(.jhdr.vent) .jfly{animation:jfly 7s linear infinite;transform-origin:45% 70%;}@keyframes jfly{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1;animation-timing-function:ease-out;}1.4%{transform:translate(8.8px,0.5px) rotate(6deg) scale(1);animation-timing-function:ease-in;}3.71%{transform:translate(24px,-36px) rotate(14deg) scale(0.99);animation-timing-function:ease-in-out;}8.24%{transform:translate(60px,-85px) rotate(34deg) scale(0.96);animation-timing-function:linear;}13.19%{transform:translate(110px,-135px) rotate(62deg) scale(0.92);animation-timing-function:linear;}18.14%{transform:translate(175px,-185px) rotate(100deg) scale(0.86);animation-timing-function:linear;}23.09%{transform:translate(260px,-240px) rotate(145deg) scale(0.79);animation-timing-function:linear;}27.2%{transform:translate(370px,-310px) rotate(195deg) scale(0.71);animation-timing-function:linear;}30%{transform:translate(500px,-390px) rotate(245deg) scale(0.63);opacity:1;}30.29%,59.71%{transform:translate(500px,-390px) rotate(245deg) scale(0.63);opacity:0;}59.79%{transform:translate(-40px,-350px) rotate(-30deg) scale(1);opacity:0;}60%{transform:translate(-40px,-350px) rotate(-30deg) scale(1);opacity:1;animation-timing-function:cubic-bezier(.55,.085,.68,.53);}71.43%{transform:translate(0px,0px) rotate(0deg) scale(1);animation-timing-function:ease-out;}73.29%{transform:translate(0px,-18px) rotate(-3deg) sc