# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Poubelle jaune (emballages)
#  Compte à rebours jusqu'à la prochaine collecte, alerte la veille, report des jours fériés,
#  envol animé du bac quand il y a du vent ; appui = « bac rangé à l'abri » pour la journée.
#
#  Entités utilisées (exemples à remplacer par les vôtres) :
#    - input_number.vent_max_prevu_24_h
#    - input_datetime.bac_jaune_a_l_abri
#    - script.poubelle_a_l_abri
#  Nécessite : button-card (HACS) + vent max prévu, input_datetime et script poubelle (package)
#  Jours de collecte : 1re ligne du champ « head » →
#    const DAYS=[2] (0 = lundi … 6 = dimanche ; plusieurs jours : [1, 3]),
#    W=1 (1 = semaines impaires, 0 = paires, null = toutes), H=7 (heure de passage),
#    MODE="report" (décale après un jour férié) ou "aucun".
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:button-card
name: Bac jaune — emballages & papiers
custom_fields:
  scene: <div class="jpb"><div class="jwrap"><div class="jbinbox"><div class="jfly"><div class="jstage"><div class="jitems"><span class="jit" style="animation-delay:0.0s"><b>🧴</b><i>Flacon</i></span><span class="jit" style="animation-delay:1.8s"><b>🥫</b><i>Conserve</i></span><span class="jit" style="animation-delay:3.6s"><b>🧃</b><i>Brique de jus</i></span><span class="jit" style="animation-delay:5.4s"><b>📦</b><i>Carton</i></span><span class="jit" style="animation-delay:7.2s"><b>📰</b><i>Journal</i></span></div><img class="jwh2" src="data:image/svg+xml;base64," alt=""><img class="jbody" src="data:image/svg+xml;base64," alt=""><img class="jlid" src="data:image/svg+xml;base64," alt=""><div class="jmark"><span class="jnum">12</span><img class="jarms" src="data:image/svg+xml;base64," alt="Gwenn-ha-Du" title="Breizh — n° 12"></div></div></div></div><div class="jlist"><div class="jhd">Interdit dans le bac <span>jaune</span></div><div class="jrow"><span class="jno">🍷</span><span class="jtxt"><b>Verre</b><small>→ colonne à verre</small></span></div><div class="jrow"><span class="jno">🍎</span><span class="jtxt"><b>Restes alimentaires</b><small>→ composteur</small></span></div><div class="jrow"><span class="jno">🤧</span><span class="jtxt"><b>Mouchoirs, essuie-tout</b><small>→ ordures ménagères</small></span></div><div class="jrow"><span class="jno">👕</span><span class="jtxt"><b>Textiles, chaussures</b><small>→ borne textile</small></span></div><div class="jrow"><span class="jno">🔋</span><span class="jtxt"><b>Piles, batteries</b><small>→ magasin / déchèterie</small></span></div><div class="jrow"><span class="jno">🧸</span><span class="jtxt"><b>Objets en plastique</b><small>→ déchèterie</small></span></div></div></div></div>
  head: |-
    [[[
    const DAYS=[2], W=1, H=7, MODE="report";
    const now=new Date(), mid=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()), today=mid(now);
    const h=now.getHours()+now.getMinutes()/60;
    const iso=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const k=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-k);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);};
    const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1;return new Date(y,mo-1,da);};
    const HC={};const hols=y=>{if(HC[y])return HC[y];const e=easter(y),off=n=>{const d=new Date(e);d.setDate(d.getDate()+n);return key(d);};return HC[y]=new Set([y+'-01-01',off(1),y+'-05-01',y+'-05-08',off(39),off(50),y+'-07-14',y+'-08-15',y+'-11-01',y+'-11-11',y+'-12-25']);};
    const hol=d=>hols(d.getFullYear()).has(key(d));
    const plan=d=>DAYS.includes((d.getDay()+6)%7)&&(W===null||iso(d)%2===W);
    const eff=d=>{if(MODE!=='report')return d;const x=new Date(d);for(let g=0;g<7&&(hol(x)||x.getDay()===0);g++)x.setDate(x.getDate()+1);return x;};
    let n;for(let k=-7;k<=75;k++){const d=new Date(today);d.setDate(d.getDate()+k);if(!plan(d))continue;const j=Math.round((mid(eff(d))-today)/864e5);if((j>0||(j===0&&h<H))&&(n===undefined||j<n))n=j;}
    let cls='',txt='—';
    if(n===0){cls='jour';txt="Aujourd'hui 🚛";}else if(n===1){cls='veille';txt='Demain 🌙';}else if(n!==undefined){txt='Dans '+n+' j';}
    let tip='';if(n!==undefined){const d=new Date(today);d.setDate(d.getDate()+n);tip='Prochaine collecte : '+d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
    const ws=states['input_number.vent_max_prevu_24_h'];const vent=ws?parseFloat(ws.state):NaN;const windy=!isNaN(vent)&&vent>=50;
    const ab=states['input_datetime.bac_jaune_a_l_abri'];const abri=!!ab&&ab.state===key(today);const hcls=(n===1?' veille':'')+(windy&&!abri?' vent':'')+(abri?' abri':'');
    const wind=windy?'<div class="jwind"><i style="top:12%;width:70px;animation-duration:1.5s;animation-delay:0s"></i><i style="top:24%;width:110px;animation-duration:1.2s;animation-delay:-0.6s"></i><i style="top:37%;width:60px;animation-duration:1.8s;animation-delay:-1.1s"></i><i style="top:49%;width:95px;animation-duration:1.35s;animation-delay:-0.3s"></i><i style="top:61%;width:75px;animation-duration:1.6s;animation-delay:-0.9s"></i><i style="top:73%;width:120px;animation-duration:1.25s;animation-delay:-0.15s"></i><i style="top:86%;width:65px;animation-duration:1.7s;animation-delay:-1.3s"></i><b style="top:30%;animation-duration:3.4s">🍂</b><b style="top:64%;animation-duration:4.1s;animation-delay:-1.7s">🍃</b></div>'+'<span class="jwchip" title="Vent max prévu sur 24 h (Met.no)">💨 '+Math.round(vent)+' km/h</span>':'';
    const abr=abri?'<span class="jabri">🏠 À l’abri</span>':'';return `<div class="jhdr${hcls}"><span class="jpill ${cls}" title="${tip}">${txt}</span><span class="jttl">Bac jaune — emballages &amp; papiers</span></div>${wind}${abr}`;
    ]]]
