# ══════════════════════════════════════════════════════════════════════
#  Ma Maison · Agenda
#  Calendrier animé : page d'éphéméride qui se tourne chaque jour, événement en cours
#  avec sa barre de progression, compte à rebours jusqu'au prochain, semaine en
#  pastilles (appui sur un jour = son programme) et prochains événements, une couleur
#  par agenda. Appui sur le titre = calendrier de Home Assistant.
#
#  Entités : aucune à saisir. Les agendas de l'iPhone (intégration Apple iCloud) sont
#  trouvés tout seuls ; un compte ajouté deux fois est fusionné.
#  Nécessite : www/ma-maison-agenda.js déclaré comme ressource (voir le guide
#  d'installation) + l'intégration Apple iCloud (native, agendas et rappels)
#  Options, toutes facultatives :
#    days: 7                       → jours couverts par la liste
#    max_items: 4                  → événements affichés
#    title: Agenda                 → titre de la carte
#    exclude: [Travail]            → agendas à masquer (par leur nom)
#    colors: {Famille: "#ff8fab"}  → couleur d'un agenda
#    entities: [calendar.xxx]      → agendas choisis à la main (Google, CalDAV, local…)
#    platform: all                 → tous les agendas de Home Assistant, pas seulement iCloud
#  À coller dans : ✏️ Modifier le tableau de bord → Ajouter une carte
#  → « Manuel » (tout en bas de la liste), puis remplacez le contenu.
# ══════════════════════════════════════════════════════════════════════
type: custom:ma-maison-agenda
grid_options:
  columns: 12
  rows: auto
