                  - height: 34px
                  - overflow: visible
                  - z-index: '2'
                th:
                  - position: absolute
                  - top: 4px
                  - left: calc(148px + (100% - 148px - min(208px, 100% - 156px)) / 2)
                  - width: min(208px, 100% - 156px)
                  - aspect-ratio: 1 / 1
                  - overflow: visible
                  - white-space: normal
                  - z-index: '2'
                tm:
                  - position: absolute
                  - left: calc(50% + 74px - 44px)
                  - bottom: 88px
                  - width: 32px
                  - height: 32px
                  - overflow: visible
                  - z-index: '3'
                tp:
                  - position: absolute
