                      - white-space: nowrap
                      - overflow: visible
                  tap_action:
                    action: perform-action
                    confirmation:
                      text: Nouvelle palette livrée ? Le compteur repartira à sa valeur de départ.
                    perform_action: counter.reset
                    target:
