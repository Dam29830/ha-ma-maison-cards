                if (v.k === 'clean') d = [job, mode].filter(Boolean).join(' · ');
                else if (v.k === 'pause') d = job ? job + ' · tâche en pause' : 'Tâche en pause';
                else if (v.k === 'ret') d = v.ph === 'Return Collect Dirt' ? 'Pour vider le bac' : (v.ph === 'Return Wash Mop' ? 'Pour laver la serpillière' : (v.ph === 'Return Collect And Wash' ? 'Pour vider le bac et laver la serpillière' : 'Vers la station'));
                else if (v.k === 'empty') d = 'La station aspire le bac';
                else if (v.k === 'wash') d = 'La station lave la serpillière';
                else if (v.k === 'dry') d = 'Serpillière séchée à l’air chaud';
                else if (v.k === 'dock') d = charging && tf > 0 ? 'Pleine dans ' + Math.round(tf) + ' min' : (job ? 'Dernier : ' + job : 'Prêt');
                else if (v.k === 'tank') d = tk[1];
                else if (v.k === 'err') d = E[v.er] || 'Vérifiez le robot';
                else if (v.k === 'idle') d = 'Hors de la station';
                else d = 'Robot injoignable';
                const bt = isNaN(v.b) ? null : Math.max(0, Math.min(100, Math.round(v.b)));
                const bc = bt === null ? 'transparent' : (bt <= 20 ? '#ff6b5f' : (bt <= 45 ? '#ffc46b' : '#5dd39e'));
                const bolt = charging ? '<svg viewBox="0 0 7 10"><path d="M4.2 0 0 5.6h2.6L2 10l5-6.2H4.3z"/></svg>' : '';
                const pill = (bt === null || v.k === 'off') ? '' : `<div class='rv-bat' style='--bl:${bt / 100};--bc:${bc}'><i><s></s>${bolt}</i><span>${bt} %</span></div>`;
                const okc = '<svg viewBox="0 0 10 10"><path d="M1.5 5.2 4 7.6 8.6 2.6"/></svg>';
                const KC = {ok: ['ok', okc], empty: ['bad', 'vide'], missing: ['bad', 'absent'], lid: ['bad', 'ouvert'], unk: ['unk', '–']}[v.tc];
                const KD = {ok: ['ok', okc], full: ['bad', 'pleine'], missing: ['bad', 'absent'], unk: ['unk', '–']}[v.td];
                const tanks = v.k === 'off' ? '' : `<div class='rv-tks'><span class='rv-tk c ${KC[0]}'><i></i>Eau propre<b>${KC[1]}</b></span>`
                 + `<span class='rv-tk d ${KD[0]}'><i></i>Eau sale<b>${KD[1]}</b></span></div>`;
                return `<div class='hd-info' style='left:178px;right:12px;top:12px'><div class='hd-name'>Robot aspirateur</div>`
                 + `<div class='hd-title rv-t' style='color:${C[v.k]}'>${T[v.k]}</div><div class='hd-sub rv-s'>${d}</div></div>${tanks}${pill}`;
                ]]]
