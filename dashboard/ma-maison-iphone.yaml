ar infinite;}.ws-fg{position:absolute;left:-40%;width:180%;height:26%;background:linear-gradient(90deg,transparent,rgba(232,238,245,.6),transparent);filter:blur(calc(var(--ws-u,4px) * .7)) brightness(calc(.45 + .55 * var(--vo-day,1)));animation:wsfog ease-in-out infinite alternate;}.ws-wd{position:absolute;left:-60%;width:55%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:wswind linear infinite;}.ws-fx{position:absolute;inset:0;animation:wsflash 7s linear infinite;}.ws-bo{position:absolute;left:38%;top:20%;width:26%;height:76%;opacity:0;overflow:visible;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px rgba(170,205,255,1));animation:wsstrike 7s linear infinite;}@keyframes wsspin{to{transform:rotate(360deg);}}@keyframes wspulse{0%,100%{transform:scale(1);filter:brightness(1);}50%{transform:scale(1.08);filter:brightness(1.12);}}@keyframes wsdrift{from{left:-70%;}to{left:110%;}}@keyframes wsfall{from{transform:translate3d(0,0,0);}to{transform:translate3d(-150%,640%,0);}}@keyframes wssnow{0%{transform:translate3d(0,0,0);}50%{transform:translate3d(130%,680%,0);}100%{transform:translate3d(-50%,1350%,0);}}@keyframes wshail{to{transform:translate3d(-80%,1600%,0);}}@keyframes wsfog{from{transform:translateX(-12%);}to{transform:translateX(12%);}}@keyframes wswind{from{left:-60%;}to{left:110%;}}@keyframes wsflash{0%,84%,100%{background:rgba(220,232,255,0);}85.2%{background:rgba(220,232,255,.38);}86.4%{background:rgba(220,232,255,0);}88.2%{background:rgba(220,232,255,.22);}89.2%{background:rgba(220,232,255,0);}}@keyframes wsstrike{0%,86.4%,100%{opacity:0;}86.9%{opacity:1;}87.8%{opacity:.2;}88.4%{opacity:.95;}89.6%{opacity:0;}}
