            tap_action:
              action: more-info
              entity: vacuum.robot_nettoyeur
            triggers_update:
              - sensor.robot_aspirateur_phase_actuelle
              - sensor.robot_aspirateur_batterie
              - sensor.robot_aspirateur_etat_de_charge_de_la_batterie
              - sensor.robot_aspirateur_temps_avant_charge_complete
              - sensor.robot_aspirateur_erreur_de_fonctionnement
              - select.robot_aspirateur_mode_nettoyage
              - sensor.robot_nettoyeur_etat_de_la_station
              - sensor.robot_nettoyeur_surface_nettoyee
              - sensor.robot_nettoyeur_duree_de_nettoyage
              - sensor.robot_nettoyeur_batterie
            type: custom:button-card
            variables:
              rv: |-
                [[[
                const S = (id) => { const s = states[id]; return s ? s.state : undefined; };
                const bad = (x) => x === undefined || x === 'unavailable' || x === 'unknown';
                const st = entity ? entity.state : 'unavailable';
                const ph = S('sensor.robot_aspirateur_phase_actuelle') || '';
                const sta = S('sensor.robot_nettoyeur_etat_de_la_station');
                const er = S('sensor.robot_aspirateur_erreur_de_fonctionnement');
                const chg = S('sensor.robot_aspirateur_etat_de_charge_de_la_batterie');
                const mode = S('select.robot_aspirateur_mode_nettoyage') || '';
                let b = parseFloat(S('sensor.robot_aspirateur_batterie'));
                if (isNaN(b)) b = parseFloat(S('sensor.robot_nettoyeur_batterie'));
                const TC = {water_tank_empty: 'empty', water_tank_missing: 'missing', water_tank_lid_open: 'lid'};
                const TD = {dirty_water_tank_full: 'full', dirty_water_tank_missing: 'missing'};
                const tc = bad(er) ? 'unk' : (TC[er] || 'ok');
                const td = bad(er) ? 'unk' : (TD[er] || 'ok');
                let k;
                if (bad(st)) k = 'off';
                else if (TC[er] || TD[er]) k = 'tank';
                else if (st === 'error' || (!bad(er) && er !== 'no_error')) k = 'err';
                else if (st === 'paused') k = 'pause';
                else if (ph.indexOf('Return') === 0 || st === 'returning') k = 'ret';
                else if (ph === 'Auto Collect Dirt' || ph === 'Hand Collect Dirt' || sta === 'emptying_dustbin') k = 'empty';
                else if (ph === 'Wash Mop' || ph === 'Pump Water' || ph === 'Self Clean' || sta === 'washing_mop') k = 'wash';
                else if (ph === 'Dry Mop' || sta === 'drying_mop') k = 'dry';
                else if (st === 'cleaning') k = 'clean';
                else if (st === 'docked') k = 'dock';
                else k = 'idle';
                return { k: k, st: st, ph: ph, er: er, chg: chg, mode: mode, mop: mode !== 'Vacuum-Only', b: b, tc: tc, td: td, run: st === 'cleaning' || st === 'returning' };
                ]]]
