              @keyframes miline{from{transform:translateX(-3px);}to{transform:translateX(3px);}}
              @keyframes migust{from{left:-60%;}to{left:110%;}}
              @media (prefers-reduced-motion: reduce){.mi *,.mi *::before{animation:none !important;}}
