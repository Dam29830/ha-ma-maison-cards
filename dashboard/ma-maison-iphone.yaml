                - --ws-sx: "[[[ const s = states['sun.sun']; let az = s ? Number(s.attributes.azimuth) : NaN; if (isNaN(az)) az = 180; return Math.max(-15, Math.min(115, (az - 60) / 2.4)).toFixed(1) + '%'; ]]]"
                - --ws-sy: "[[[ const s = states['sun.sun']; let el = s ? Number(s.attributes.elevation) : NaN; if (isNaN(el)) el = (s && s.state === 'below_horizon') ? -20 : 45; const y = el >= 0 ? 92 - el * 1.25 : 92 - el * 8; return Math.max(6, Math.min(140, y)).toFixed(1) + '%'; ]]]"
