              @keyframes hdmv{0%{top:34px;opacity:0;}30%{opacity:1;}100%{top:2px;opacity:0;}}/*ws-sky*/.ws{--ws-k:1;}.ws-g{--ws-k:.4;}.ws-w{--ws-k:.1;}.ws-s{--ws-k:0;}.vw-night{background:linear-gradient(180deg,#0a1230 0%,#1d2d58 100%);}.ws-stars{position:absolute;inset:0;background:radial-gradient(circle at 74% 24%,#fff6d8 0 7%,rgba(255,246,216,.25) 9%,transparent 16%),radial-gradient(1.2px 1.2px at 22% 26%,#fff 99%,transparent),radial-gradient(1px 1px at 48% 14%,#fff 99%,transparent),radial-gradient(1px 1px at 36% 52%,rgba(255,255,255,.75) 99%,transparent),radial-gradient(1.2px 1.2px at 84% 66%,rgba(255,255,255,.7) 99%,transparent);opacity:var(--ws-night,0);transition:opacity 3s;}.ws-g .ws-stars,.ws-w .ws-stars,.ws-s .ws-stars{display:none;}.vw-day{background:linear-gradient(180deg,#4f9df5 0%,#9fcdfb 70%,#d8ecff 100%);transition:opacity 3s;}.ws-g .vw-day{background:linear-gradient(180deg,#8494a8 0%,#b8c4d2 100%);}.ws-w .vw-day{background:linear-gradient(180deg,#56677d 0%,#8798ad 100%);}.ws-s .vw-day{background:linear-gradient(180deg,#363f52 0%,#5f6d82 100%);}.ws-g .vw-night,.ws-w .vw-night,.ws-s .vw-night{background:linear-gradient(180deg,#121a27 0%,#273345 100%);}.ws-glow{position:absolute;inset:0;background:radial-gradient(130% 75% at var(--ws-sx,50%) 100%,rgba(255,150,70,.9) 0%,rgba(255,110,90,.4) 45%,rgba(255,110,90,0) 78%);opacity:calc(var(--ws-glow,0) * (.25 + .75 * var(--ws-k,1)));transition:opacity 3s;}.ws-sun{position:absolute;left:var(--ws-sx,70%);top:var(--ws-sy,30%);width:calc(var(--ws-u,4px) * 3.6);height:calc(var(--ws-u,4px) * 3.6);margin:calc(var(--ws-u,4px) * -1.8) 0 0 calc(var(--ws-u,4px) * -1.8);opacity:calc(var(--vo-day,1) * var(--ws-k,1));transition:left 90s linear,top 90s linear,opacity 3s;}.ws-sun::before{content:'';position:absolute;inset:-42%;border-radius:50%;background:repeating-conic-gradient(rgba(255,222,100,.65) 0deg 8deg,transparent 8deg 30deg);-webkit-mask:radial-gradient(circle,transparent 37%,#000 39%,#000 58%,transparent 70%);mask:radial-gradient(circle,transparent 37%,#000 39%,#000 58%,transparent 70%);animation:wsspin 16s linear infinite;}.fa .ws-sun::before{inset:-30%;}.ws-sun i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff7c2 0%,#ffd84a 55%,#ffb300 100%);box-shadow:0 0 calc(var(--ws-u,4px) * 2) calc(var(--ws-u,4px) * .6) rgba(255,210,60,.7);animation:wspulse 3.5s ease-in-out infinite;}.ws-sun i::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fff1c0 0%,#ff9d3c 55%,#ff6a00 100%);opacity:var(--ws-glow,0);transition:opacity 3s;}.ws-cl{position:absolute;left:-70%;width:calc(var(--ws-u,4px) * 6.5);height:calc(var(--ws-u,4px) * 2.2);border-radius:calc(var(--ws-u,4px) * 2.2);background:#f4f7fb;transform-origin:left center;filter:brightness(calc(.3 + .7 * var(--vo-day,1))) drop-shadow(0 1px 1px rgba(0,0,0,.25));transition:filter 3s;animation:wsdrift linear infinite;}.ws-cl::before{content:'';position:absolute;width:calc(var(--ws-u,4px) * 2.8);height:calc(var(--ws-u,4px) * 2.8);left:calc(var(--ws-u,4px) * 1);top:calc(var(--ws-u,4px) * -1.4);border-radius:50%;background:inherit;}.ws-cl::after{content:'';position:absolute;width:calc(var(--ws-u,4px) * 3.4);height:calc(var(--ws-u,4px) * 3.4);left:calc(var(--ws-u,4px) * 2.5);top:calc(var(--ws-u,4px) * -1.9);border-radius:50%;background:inherit;}.ws-g .ws-cl{background:#d3dae4;}.ws-w .ws-cl{background:#a7b3c4;}.ws-s .ws-cl{background:#76839a;}.ws-dr{position:absolute;top:-30%;width:1px;height:calc(var(--ws-u,4px) * 2.6);background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(205,228,255,.95));animation:wsfall linear infinite;}.ws-fl{position:absolute;top:-15%;width:calc(var(--ws-u,4px) * 1.1);height:calc(var(--ws-u,4px) * 1.1);border-radius:50%;background:#fff;opacity:.92;animation:wssnow linear infinite;}.ws-ha{position:absolute;top:-15%;width:calc(var(--ws-u,4px) * .9);height:calc(var(--ws-u,4px) * .9);border-radius:50%;background:#eef6ff;animation:wshail linear infinite;}.ws-fg{position:absolute;left:-40%;width:180%;height:26%;background:linear-gradient(90deg,transparent,rgba(232,238,245,.6),transparent);filter:blur(calc(var(--ws-u,4px) * .7)) brightness(calc(.45 + .55 * var(--vo-day,1)));animation:wsfog ease-in-out infinite alternate;}.ws-wd{position:absolute;left:-60%;width:55%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:wswind linear infinite;}.ws-fx{position:absolute;inset:0;animation:wsflash 7s linear infinite;}.ws-bo{position:absolute;left:38%;top:20%;width:26%;height:76%;opacity:0;overflow:visible;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px rgba(170,205,255,1));animation:wsstrike 7s linear infinite;}@keyframes wsspin{to{transform:rotate(360deg);}}@keyframes wspulse{0%,100%{transform:scale(1);filter:brightness(1);}50%{transform:scale(1.08);filter:brightness(1.12);}}@keyframes wsdrift{from{left:-70%;}to{left:110%;}}@keyframes wsfall{from{transform:translate3d(0,0,0);}to{transform:translate3d(-150%,640%,0);}}@keyframes wssnow{0%{transform:translate3d(0,0,0);}50%{transform:translate3d(130%,680%,0);}100%{transform:translate3d(-50%,1350%,0);}}@keyframes wshail{to{transform:translate3d(-80%,1600%,0);}}@keyframes wsfog{from{transform:translateX(-12%);}to{transform:translateX(12%);}}@keyframes wswind{from{left:-60%;}to{left:110%;}}@keyframes wsflash{0%,84%,100%{background:rgba(220,232,255,0);}85.2%{background:rgba(220,232,255,.38);}86.4%{background:rgba(220,232,255,0);}88.2%{background:rgba(220,232,255,.22);}89.2%{background:rgba(220,232,255,0);}}@keyframes wsstrike{0%,86.4%,100%{opacity:0;}86.9%{opacity:1;}87.8%{opacity:.2;}88.4%{opacity:.95;}89.6%{opacity:0;}}
            grid_options:
