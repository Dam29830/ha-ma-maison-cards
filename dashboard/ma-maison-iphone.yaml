                - --ws-night: "[[[ const s = states['sun.sun']; let el = s ? Number(s.attributes.elevation) : NaN; if (isNaN(el)) el = (s && s.state === 'below_horizon') ? -20 : 45; return String(Math.max(0, Math.min(1, (-el - 1) / 6)).toFixed(3)); ]]]"
