              .tt-bar{position:relative;height:6px;border-radius:3px;background:rgba(127,127,127,.22);}
              .tt-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;overflow:hidden;background-image:linear-gradient(90deg,hsl(220,85%,60%),hsl(165,85%,52%),hsl(110,75%,48%),hsl(55,90%,52%),hsl(28,95%,55%),hsl(0,85%,58%));background-repeat:no-repeat;}
