                ]]]
              scene: "[[[ const w = states['weather.forecast_maison']; const s = w ? String(w.state) : ''; const a = (w && w.attributes) || {}; const wind = Number(a.wind_speed) || 0; const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v)); const storm = ['lightning', 'lightning-rainy', 'exceptional'].includes(s); const rainy = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy'].includes(s); const pouring = s === 'pouring'; const snowy = ['snowy', 'snowy-rainy'].includes(s); const hail = s === 'hail'; const fog = s === 'fog'; const grey = ['cloudy', 'fog', 'snowy'].includes(s); const partly = ['partlycloudy', 'windy', 'windy-variant'].includes(s); const breezy = ['windy', 'windy-variant'].includes(s) || wind >= 35; const tone = storm ? 'ws-s' : ((rainy || hail) ? 'ws-w' : (grey ? 'ws-g' : 'ws-c')); const nCl = tone === 'ws-c' ? (partly ? 2 : 0) : 3; const base = Math.round(clamp(420 / (wind + 10), 12, 40)); const sky = (big, k) => { let h = ''; const tops = tone === 'ws-c' ? [6, 38] : [-2, 18, 38]; for (let i = 0; i < nCl; i++) { const sc = (tone === 'ws-c' ? 1 - i * 0.25 : 1.2 - i * 0.15).toFixed(2); const d = Math.round(base * (1 + i * 0.35)); h += `<span class='ws-cl' style='top:${tops[i]}%;transform:scale(${sc});animation-duration:${d}s;animation-delay:-${Math.round(d * ((0.15 + i * 0.45 + k * 0.29) % 1))}s'></span>`; } if (fog) { for (let i = 0; i < 2; i++) h += `<span class='ws-fg' style='top:${28 + i * 34}%;animation-duration:${7 + i * 3}s;animation-delay:-${k + i * 2}s'></span>`; } if (rainy) { const n = (pouring ? 9 : 6) - (big ? 0 : 3); for (let i = 0; i < n; i++) h += `<span class='ws-dr' style='left:${(i * 37 + k * 13 + 9) % 100}%;animation-duration:${((pouring ? 0.45 : 0.7) + ((i * 7) % 5) * 0.06).toFixed(2)}s;animation-delay:-${((i * 0.23 + k * 0.11) % 1.2).toFixed(2)}s'></span>`; } if (snowy || hail) { const n = big ? 6 : 3; for (let i = 0; i < n; i++) h += `<span class='${hail ? 'ws-ha' : 'ws-fl'}' style='left:${(i * 41 + k * 17 + 7) % 100}%;animation-duration:${(hail ? 0.7 + (i % 3) * 0.1 : 3 + (i % 3) * 0.6).toFixed(2)}s;animation-delay:-${((i * 0.47 + k * 0.3) % 3).toFixed(2)}s'></span>`; } if (breezy) { for (let i = 0; i < 2; i++) h += `<span class='ws-wd' style='top:${32 + i * 30}%;animation-duration:${clamp(30 / (wind + 5), 0.8, 2.5).toFixed(2)}s;animation-delay:-${(i * 0.7 + k * 0.23).toFixed(2)}s'></span>`; } if (storm) h += `<span class='ws-fx'></span><svg class='ws-bo' style='left:${k % 2 ? 12 : 60}%' viewBox='0 0 60 180' preserveAspectRatio='none'><polyline points='34,2 22,54 40,60 18,116 42,122 26,178' fill='none' stroke='#f4f8ff' stroke-width='${big ? 1.8 : 1.2}' vector-effect='non-scaling-stroke' stroke-linejoin='round' stroke-linecap='round'/></svg>`; return h; }; const glass = (big, k) => `<div class='vw-night'></div><div class='vw-day'></div><div class='ws-stars'></div><div class='ws-glow'></div><div class='ws-sun'><i></i></div>${sky(big, k)}<div class='vw-shut'></div><div class='vw-cross'></div><div class='vw-shine'></div>`; const k = entity ? entity.entity_id.length % 5 : 0; return `<div class='hd-scene ws ${tone}' style='--ws-u:4px'><div class='vw' style='left:14px;top:42px;width:48px;height:56px'><div class='vw-frame'></div><div class='vw-glass'>${glass(true, k)}</div><div class='vw-box'></div><div class='vw-sill'></div></div><div class='mv' style='left:33px;top:49px'><i></i><i></i></div></div>`; ]]]"
