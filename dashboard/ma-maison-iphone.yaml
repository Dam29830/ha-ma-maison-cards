          - custom_fields:
              scene: <div class="bpb"><div class="bwrap"><div class="bbinbox"><div class="bfly"><div class="bstage"><div class="bitems"><span class="bit" style="animation-delay:0.0s"><b>🍗</b><i>Restes de viande</i></span><span class="bit" style="animation-delay:1.8s"><b>🧽</b><i>Éponge usagée</i></span><span class="bit" style="animation-delay:3.6s"><b>🪥</b><i>Brosse à dents</i></span><span class="bit" style="animation-delay:5.4s"><b>🩹</b><i>Pansement</i></span><span class="bit" style="animation-delay:7.2s"><b>🪒</b><i>Rasoir jetable</i></span></div><img class="bwh2" src="data:image/svg+xml;base64," alt=""><img class="bbody" src="data:image/svg+xml;base64," alt=""><img class="blid" src="data:image/svg+xml;base64," alt=""><div class="bmark"><span class="bnum">12</span><img class="barms" src="data:image/svg+xml;base64," alt="Gwenn-ha-Du" title="Breizh — n° 12"></div></div></div></div><div class="blist"><div class="bhd">Interdit dans le bac <span>bleu</span></div><div class="brow"><span class="bno">🍷</span><span class="btxt"><b>Verre</b><small>→ colonne à verre</small></span></div><div class="brow"><span class="bno">🧴</span><span class="btxt"><b>Bouteilles &amp; flacons</b><small>→ bac jaune</small></span></div><div class="brow"><span class="bno">🥫</span><span class="btxt"><b>Conserves &amp; canettes</b><small>→ bac jaune</small></span></div><div class="brow"><span class="bno">📦</span><span class="btxt"><b>Papiers &amp; cartons</b><small>→ bac jaune</small></span></div><div class="brow"><span class="bno">🔋</span><span class="btxt"><b>Piles, batteries</b><small>→ magasin / déchèterie</small></span></div><div class="brow"><span class="bno">💊</span><span class="btxt"><b>Médicaments</b><small>→ pharmacie</small></span></div></div></div></div>
              head: |-
                [[[
                const DAYS=[3], W=null, H=7, MODE="report";
                const now=new Date(), mid=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()), today=mid(now);
                const h=now.getHours()+now.getMinutes()/60;
                const iso=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const k=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-k);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);};
                const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
                const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1;return new Date(y,mo-1,da);};
                const HC={};const hols=y=>{if(HC[y])return HC[y];const e=easter(y),off=n=>{const d=new Date(e);d.setDate(d.getDate()+n);return key(d);};return HC[y]=new Set([y+'-01-01',off(1),y+'-05-01',y+'-05-08',off(39),off(50),y+'-07-14',y+'-08-15',y+'-11-01',y+'-11-11',y+'-12-25']);};
                const hol=d=>hols(d.getFullYear()).has(key(d));
                const plan=d=>DAYS.includes((d.getDay()+6)%7)&&(W===null||iso(d)%2===W);
                const eff=d=>{if(MODE!=='report')return d;const x=new Date(d);for(let g=0;g<7&&(hol(x)||x.getDay()===0);g++)x.setDate(x.getDate()+1);return x;};
                let n;for(let k=-7;k<=75;k++){const d=new Date(today);d.setDate(d.getDate()+k);if(!plan(d))continue;const j=Math.round((mid(eff(d))-today)/864e5);if((j>0||(j===0&&h<H))&&(n===undefined||j<n))n=j;}
                let cls='',txt='—';
                if(n===0){cls='jour';txt="Aujourd'hui 🚛";}else if(n===1){cls='veille';txt='Demain 🌙';}else if(n!==undefined){txt='Dans '+n+' j';}
                let tip='';if(n!==undefined){const d=new Date(today);d.setDate(d.getDate()+n);tip='Prochaine collecte : '+d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
                const ws=states['input_number.vent_max_prevu_24_h'];const vent=ws?parseFloat(ws.state):NaN;const windy=!isNaN(vent)&&vent>=50;
                const ab=states['input_datetime.bac_bleu_a_l_abri'];const abri=!!ab&&ab.state===key(today);const hcls=(n===1?' veille':'')+(windy&&!abri?' vent':'')+(abri?' abri':'');
                const wind=windy?'<div class="bwind"><i style="top:12%;width:70px;animation-duration:1.5s;animation-delay:0s"></i><i style="top:24%;width:110px;animation-duration:1.2s;animation-delay:-0.6s"></i><i style="top:37%;width:60px;animation-duration:1.8s;animation-delay:-1.1s"></i><i style="top:49%;width:95px;animation-duration:1.35s;animation-delay:-0.3s"></i><i style="top:61%;width:75px;animation-duration:1.6s;animation-delay:-0.9s"></i><i style="top:73%;width:120px;animation-duration:1.25s;animation-delay:-0.15s"></i><i style="top:86%;width:65px;animation-duration:1.7s;animation-delay:-1.3s"></i><b style="top:30%;animation-duration:3.4s">🍂</b><b style="top:64%;animation-duration:4.1s;animation-delay:-1.7s">🍃</b></div>'+'<span class="bwchip" title="Vent max prévu sur 24 h (Met.no)">💨 '+Math.round(vent)+' km/h</span>':'';
