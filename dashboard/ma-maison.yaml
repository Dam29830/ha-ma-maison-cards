imation-duration:${(hail ? 0.7 + (i % 3) * 0.1 : 3 + (i % 3) * 0.6).toFixed(2)}s;animation-delay:-${((i * 0.47 + k * 0.3) % 3).toFixed(2)}s'></span>`; } if (breezy) { for (let i = 0; i < 2; i++) h += `<span class='ws-wd' style='top:${32 + i * 30}%;animation-duration:${clamp(30 / (wind + 5), 0.8, 2.5).toFixed(2)}s;animation-delay:-${(i * 0.7 + k * 0.23).toFixed(2)}s'></span>`; } if (storm) h += `<span class='ws-fx'></span><svg class='ws-bo' style='left:${k % 2 ? 12 : 60}%' viewBox='0 0 60 180' preserveAspectRatio='none'><polyline points='34,2 22,54 40,60 18,116 42,122 26,178' fill='none' stroke='#f4f8ff' stroke-width='${big ? 1.8 : 1.2}' vector-effect='non-scaling-stroke' stroke-linejoin='round' stroke-linecap='round'/></svg>`; return h; }; const glass = (big, k) => `<div class='vw-night'></div><div class='vw-day'></div><div class='ws-stars'></div><div class='ws-glow'></div><div class='ws-sun'><i></i></div>${sky(big, k)}<div class='vw-shut'></div><div class='vw-cross'></div><div class='vw-shine'></div>`; const xs = [12, 43, 74, 105, 136]; let wins = ''; xs.forEach((x, i) => { wins += `<div class='vw' style='left:${x}px;top:40px;width:23px;height:28px;--vo-pos:var(--p${i + 1})'><div class='vw-frame'></div><div class='vw-glass'>${glass(false, i)}</div><div class='vw-box'></div><div class='vw-sill'></div></div>`; }); return `<div class='hd-scene ws ${tone}' style='--ws-u:2px'><div class='fa'><div class='fa-roof'></div><div class='fa-chim'></div><div class='fa-wall'></div>${wins}<div class='fa-door'></div><div class='fa-ground'></div></div></div>`; ]]]"
