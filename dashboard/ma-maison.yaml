imation-duration:${(hail ? 0.7 + (i % 3) * 0.1 : 3 + (i % 3) * 0.6).toFixed(2)}s;animation-delay:-${((i * 0.47 + k * 0.3) % 3).toFixed(2)}s'></span>`; } if (breezy) { for (let i = 0; i < 2; i++) h += `<span class='ws-wd' style='top:${32 + i * 30}%;animation-duration:${clamp(30 / (wind + 5), 0.8, 2.5).toFixed(2)}s;animation-delay:-${(i * 0.7 + k * 0.23).toFixed(2)}s'></span>`; } if (storm) h += `<span class='ws-fx'></span><svg class='ws-bo' style='left:${k % 2 ? 12 : 60}%' viewBox='0 0 60 180' preserveAspectRatio='none'><polyline points='34,2 22,54 40,60 18,116 42,122 26,178' fill='none' stroke='#f4f8ff' stroke-width='${big ? 1.8 : 1.2}' vector-effect='non-scaling-stroke' stroke-linejoin='round' stroke-linecap='round'/></svg>`; return h; }; const glass = (big, k) => `<div class='vw-night'></div><div class='vw-day'></div><div class='ws-stars'></div><div class='ws-glow'></div><div class='ws-sun'><i></i></div>${sky(big, k)}<div class='vw-shut'></div><div class='vw-cross'></div><div class='vw-shine'></div>`; const k = entity ? entity.entity_id.length % 5 : 0; return `<div class='hd-scene ws ${tone}' style='--ws-u:4px'><div class='vw' style='left:14px;top:42px;width:48px;height:56px'><div class='vw-frame'></div><div class='vw-glass'>${glass(true, k)}</div><div class='vw-box'></div><div class='vw-sill'></div></div><div class='mv' style='left:33px;top:49px'><i></i><i></i></div></div>`; ]]]"
