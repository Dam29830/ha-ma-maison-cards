# ══════════════════════════════════════════════════════════════════════
#  Tableau de bord « Ma Maison » — configuration complète (vue Sections)
#
#  Installation : Paramètres → Tableaux de bord → Ajouter → « Nouveau
#  tableau de bord à partir de zéro », puis dans le tableau : ✏️ Modifier
#  → ⋮ → « Éditeur de configuration brute » → collez tout ce fichier.
#
#  Les entités sont des exemples : remplacez-les par les vôtres
#  (liste complète dans le README).
#  Nécessite : button-card et card-mod (HACS), thème maison_nuit (conseillé).
# ══════════════════════════════════════════════════════════════════════
views:
  - icon: mdi:home-heart
    max_columns: 3
    path: ma-maison
    sections:
      - cards:
          - heading: Ma Maison
            heading_style: title
            icon: mdi:home-heart
            type: heading
          - custom_fields:
              ava: |-
                [[[
                const pic = entity && entity.attributes.entity_picture;
                const n = (entity && entity.attributes.friendly_name) || '?';
                return `<div class='pr-ava'>${pic ? `<img src='${pic}' alt=''>` : `<b>${n.charAt(0)}</b>`}</div>`;
                ]]]
              info: |-
                [[[
                const zh = states['zone.home'];
                const hm = d => d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
                const row = (p, top) => {
                  const st = p ? p.state : 'unknown';
                  const a = p ? p.attributes : {};
                  const home = st === 'home';
                  let t, c;
                  if (home) { t = 'À la maison'; c = '#4cc9a8'; }
                  else if (st === 'not_home') { t = 'Absent'; c = '#8fb3d9'; }
                  else if (st === 'unknown' || st === 'unavailable') { t = 'Position inconnue'; c = 'var(--secondary-text-color)'; }
                  else { t = st; c = '#8fd0ff'; }
                  const d = [];
                  if (!home && zh && a.latitude != null && a.longitude != null) {
                    const R = 6371, rad = x => x * Math.PI / 180;
                    const dLa = rad(a.latitude - zh.attributes.latitude), dLo = rad(a.longitude - zh.attributes.longitude);
                    const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(zh.attributes.latitude)) * Math.cos(rad(a.latitude)) * Math.sin(dLo / 2) ** 2;
                    const km = 2 * R * Math.asin(Math.sqrt(h));
                    d.push('à ' + (km < 1 ? Math.round(km * 1000) + ' m' : km.toLocaleString('fr-FR', {maximumFractionDigits: km < 10 ? 1 : 0}) + ' km'));
                  }
                  if (p && p.last_changed) {
                    const lc = new Date(p.last_changed), now = new Date(), y = new Date(now);
                    y.setDate(now.getDate() - 1);
                    const when = lc.toDateString() === now.toDateString() ? hm(lc)
                      : lc.toDateString() === y.toDateString() ? 'hier ' + hm(lc)
                      : lc.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
                    d.push('depuis ' + when);
                  }
                  return `<div class='hd-info pr-row' style='left:180px;right:12px;top:${top}px'><div class='hd-name'>${a.friendly_name || 'Présence'}</div><div class='hd-title pr-st' style='color:${c}'>${t}</div><div class='hd-sub pr-sub'>${d.join(' · ')}</div></div>`;
                };
                return row(entity, 10) + row(states['person.personne_2'], 64);
                ]]]
              scene: <div class="hd-scene"><div class="pr-glow"></div><div class="pr"><div class="pr-smoke"><i style="animation-delay:-0.0s"></i><i style="animation-delay:-1.1s"></i><i style="animation-delay:-2.2s"></i></div><div class="pr-chim"></div><div class="pr-roof"></div><div class="pr-wall"></div><div class="pr-win l"><i></i></div><div class="pr-win r"><i></i></div><div class="pr-door"><i></i></div><div class="pr-ground"></div></div><div class="pr-path d"></div><div class="pr-path g"></div></div>
              ava2: |-
                [[[
                const p = states['person.personne_2'];
                const pic = p && p.attributes.entity_picture;
                const n = (p && p.attributes.friendly_name) || '?';
                return `<div class='pr-ava g'>${pic ? `<img src='${pic}' alt=''>` : `<b>${n.charAt(0)}</b>`}</div>`;
                ]]]
            entity: person.personne_1
            extra_styles: |-
              .hd-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
              .hd-info{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;white-space:normal;min-width:0;}
              .hd-name{font-size:13px;font-weight:600;line-height:1.25;color:var(--secondary-text-color);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
              .hd-name.w{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
              .hd-title{font-size:22px;font-weight:600;line-height:1.15;color:var(--primary-text-color);transition:color .8s;}
              .hd-title.s{font-size:15.5px;}
              .hd-sub{font-size:12.5px;line-height:1.3;color:var(--secondary-text-color);}
              .hd-sub b{color:var(--primary-text-color);font-weight:600;}
              @media (prefers-reduced-motion: reduce){.hd-scene *,.hd-scene *::before,.hd-scene *::after{animation:none !important;}}
              .pr{position:absolute;left:18px;top:20px;width:92px;height:80px;}
              .pr-glow{position:absolute;left:-36px;top:-46px;width:220px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,190,90,.28),rgba(255,170,70,0));opacity:var(--pr-home,0);transition:opacity 2s;}
              .pr-roof{position:absolute;left:-6px;right:-6px;top:2px;height:30px;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(180deg,#6b7382,#3b414c);}
              .pr-chim{position:absolute;left:63px;top:6px;width:10px;height:16px;background:linear-gradient(90deg,#4d5460,#6b7382);}
              .pr-smoke{position:absolute;left:61px;top:-16px;width:14px;height:22px;opacity:var(--pr-home,0);transition:opacity 2s;}
              .pr-smoke i{position:absolute;left:3px;bottom:0;width:8px;height:8px;border-radius:50%;background:rgba(220,228,238,.55);animation:prsmoke 3.3s ease-out infinite;}
              .pr-wall{position:absolute;left:6px;right:6px;top:30px;bottom:6px;background:linear-gradient(90deg,#d6dce3,#eef2f6 45%,#cfd6de);}
              .pr-win{position:absolute;top:39px;width:19px;height:16px;border-radius:2px;background:#1b2433;box-shadow:inset 0 0 0 2px #9aa4af;overflow:hidden;}
              .pr-win.l{left:13px;}
              .pr-win.r{right:13px;}
              .pr-win i{position:absolute;inset:2px;background:linear-gradient(180deg,#ffe29a,#ffb347);opacity:var(--pr-home,0);transition:opacity 1.6s;animation:prwin 4s ease-in-out infinite;}
              .pr-win::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#9aa4af;}
              .pr-door{position:absolute;left:37px;top:49px;width:18px;bottom:6px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#8a5a3c,#6b4329);}
              .pr-door i{position:absolute;left:4px;right:4px;top:4px;height:6px;border-radius:2px;background:#ffd27a;opacity:var(--pr-home,0);transition:opacity 1.6s;}
              .pr-ground{position:absolute;left:-10px;right:-10px;bottom:0;height:7px;border-radius:3px;background:linear-gradient(180deg,#5a8a4c,#3d6334);}
              .pr-path{position:absolute;left:112px;top:77px;width:20px;height:0;border-top:2px dashed rgba(143,179,217,.65);opacity:calc(1 - var(--pr-home,0));transition:opacity 1.2s;}
              .pr-ava{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--pr-ring,#8fb3d9),0 4px 10px rgba(0,0,0,.45);background:linear-gradient(135deg,#3a4a66,#2a3140);}
              .pr-ava img{width:100%;height:100%;object-fit:cover;display:block;}
              .pr-ava b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 18px/1 Roboto,Arial,sans-serif;color:#e9ecf1;}
              @keyframes prsmoke{0%{transform:translate(0,0) scale(.5);opacity:0;}20%{opacity:.8;}100%{transform:translate(8px,-22px) scale(1.6);opacity:0;}}
              @keyframes prwin{0%,100%{filter:brightness(1);}45%{filter:brightness(.88);}60%{filter:brightness(1.08);}}
              .pr-path{left:110px;width:26px;}
              .pr-path.d{top:32px;opacity:calc(1 - var(--pr-d,0));}
              .pr-path.g{top:86px;opacity:calc(1 - var(--pr-g,0));}
              .pr-ava.g{box-shadow:0 0 0 2px var(--pr-ring2,#8fb3d9),0 4px 10px rgba(0,0,0,.45);background:linear-gradient(135deg,#5a4a7a,#2f2a44);}
              .pr-ava b{font-size:15px;}
              .pr-row{gap:0;}
              .pr-row .hd-name{font-size:12px;line-height:1.15;}
              .pr-row .pr-st{font-size:16.5px;line-height:1.2;}
              .pr-row .pr-sub{font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
            grid_options:
              columns: 12
              rows: auto
            name: Présence
            show_icon: false
            show_name: false
            styles:
              card:
                - height: 120px
                - border-radius: 24px
                - overflow: hidden
                - padding: '0'
                - background: rgba(140,170,200,0.10)
                - backdrop-filter: blur(16px) saturate(170%)
                - -webkit-backdrop-filter: blur(16px) saturate(170%)
                - border: 1px solid rgba(255,255,255,0.16)
                - box-shadow: 0 8px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.22)
                - --pr-home: "[[[ const g = states['person.personne_2']; return String(((entity && entity.state === 'home') || (g && g.state === 'home')) ? 1 : 0); ]]]"
                - --pr-d: "[[[ return String((entity && entity.state === 'home') ? 1 : 0); ]]]"
                - --pr-g: "[[[ const g = states['person.personne_2']; return String((g && g.state === 'home') ? 1 : 0); ]]]"
                - --pr-ring: "[[[ return (entity && entity.state === 'home') ? '#4cc9a8' : '#8fb3d9'; ]]]"
                - --pr-ring2: "[[[ const g = states['person.personne_2']; return (g && g.state === 'home') ? '#4cc9a8' : '#8fb3d9'; ]]]"
              custom_fields:
                ava:
                  - position: absolute
                  - left: 104px
                  - top: 16px
                  - width: 34px
                  - height: 34px
                  - z-index: '2'
                  - transform: translateX(calc((1 - var(--pr-d, 0)) * 30px))
                  - transition: transform 1.4s ease
                info:
                  - position: absolute
                  - inset: '0'
                  - width: 100%
                  - height: 100%
                scene:
                  - position: absolute
                  - inset: '0'
                  - width: 100%
                  - height: 100%
                ava2:
                  - position: absolute
                  - left: 104px
                  - top: 70px
                  - width: 34px
                  - height: 34px
                  - z-index: '2'
                  - transform: translateX(calc((1 - var(--pr-g, 0)) * 30px))
                  - transition: transform 1.4s ease
              grid:
                - position: relative
            tap_action:
              action: more-info
            triggers_update:
              - zone.home
              - person.personne_2
            type: custom:button-card
          - custom_fields:
              info: |-
                [[[
                const a = entity ? entity.attributes : {};
                const st = entity ? entity.state : '';
                const labels = {'clear-night':'Nuit claire','cloudy':'Nuageux','exceptional':'Exceptionnel','fog':'Brouillard','hail':'Grêle','lightning':'Orageux','lightning-rainy':'Orages et pluie','partlycloudy':'Éclaircies','pouring':'Fortes pluies','rainy':'Pluie','snowy':'Neige','snowy-rainy':'Pluie et neige','sunny':'Ensoleillé','windy':'Venteux','windy-variant':'Venteux et nuageux'};
                const fmt = (v, d) => Number(v).toLocaleString('fr-FR', {maximumFractionDigits: d});
                const t = a.temperature != null ? fmt(a.temperature, 1) : '–';
                const u = a.temperature_unit || '°C';
                const tv = Number(a.temperature);
                const hh = isNaN(tv) ? 200 : Math.round(Math.max(0, Math.min(220, 220 - tv * 5.5)));
                const c1 = `hsl(${hh},95%,66%)`;
                const c2 = `hsl(${Math.max(0, hh - 28)},95%,60%)`;
                const c3 = `hsl(${Math.min(240, hh + 22)},95%,74%)`;
                const parts = [];
                if (a.wind_speed != null) parts.push(`💨 ${fmt(a.wind_speed, 0)} ${a.wind_speed_unit || 'km/h'}`);
                if (a.humidity != null) parts.push(`💧 ${fmt(a.humidity, 0)} %`);
                const css = `<style>.wx-temp.tgrad{background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));animation:tgflow 5s linear infinite;}@keyframes tgflow{from{background-position:0% 50%;}to{background-position:200% 50%;}}@media (prefers-reduced-motion: reduce){.wx-temp.tgrad{animation:none;}}</style>`;
                return `${css}<div class='wx-temp tgrad' style='--t1:${c1};--t2:${c2};--t3:${c3}'>${t}<span>${u}</span></div><div class='wx-cond'>${labels[st] || st}</div><div class='wx-meta'>${parts.join(' · ')}</div>`;
                ]]]
              scene: |-
                [[[
                const s = entity ? entity.state : 'unknown';
                const a = entity ? entity.attributes : {};
                const sun = states['sun.sun'];
                const el = sun ? Number(sun.attributes.elevation) : 90;
                const az = sun ? Number(sun.attributes.azimuth) : 180;
                const night = sun ? sun.state === 'below_horizon' : false;
                const wind = Number(a.wind_speed) || 0;
                const tv = Number(a.temperature);
                const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
                const rainy = ['rainy','pouring','lightning-rainy','snowy-rainy'].includes(s);
                const pouring = s === 'pouring';
                const snowy = ['snowy','snowy-rainy'].includes(s);
                const hail = s === 'hail';
                const storm = ['lightning','lightning-rainy'].includes(s);
                const fog = s === 'fog';
                const clear = ['sunny','clear-night'].includes(s);
                const partly = ['partlycloudy','windy-variant'].includes(s);
                const breezy = ['windy','windy-variant'].includes(s) || wind >= 35;
                const nClouds = clear ? 0 : (partly ? 2 : 3);
                const dark = rainy || storm || hail || snowy || fog || s === 'cloudy';
                let h = '';
                if (clear || partly) {
                  if (night) {
                    h += `<div class='wx-moon'></div>`;
                    for (let i = 0; i < 14; i++) {
                      h += `<span class='wx-star' style='left:${(i*37+11)%100}%;top:${(i*23+5)%55}%;animation-delay:${((i*0.37)%3).toFixed(2)}s'></span>`;
                    }
                  } else {
                    const top = clamp(62 - clamp(el,0,54)/54*54, 6, 64);
                    const left = clamp((az-90)/180*78 + 8, 6, 88);
                    const low = el <= 10;
                    h += `<div class='wx-sun${low?' wx-sun-low':''}' style='left:${left.toFixed(1)}%;top:${top.toFixed(1)}%;right:auto'><div class='wx-rays'></div><div class='wx-core'></div></div>`;
                  }
                }
                const base = clamp(360/(wind+5), 4, 40); const tilt = clamp(wind/6, 0, 14).toFixed(0);
                for (let i = 0; i < nClouds; i++) {
                  const dur = (base + i*5).toFixed(1);
                  h += `<div class='wx-cloud${dark?' wx-dark':''}' style='font-size:${17-i*3}px;top:${10+i*17}%;animation-duration:${dur}s;animation-delay:-${(i*base/Math.max(1,nClouds)).toFixed(1)}s;transform:skewX(-${tilt}deg) scaleX(${(1+wind/220).toFixed(2)})'></div>`;
                }
                if (rainy) {
                  const n = pouring ? 46 : 28;
                  for (let i = 0; i < n; i++) {
                    h += `<span class='wx-drop' style='left:${(i*53+7)%100}%;animation-duration:${((pouring?0.45:0.75)+((i*7)%5)*0.07).toFixed(2)}s;animation-delay:-${((i*0.17)%1.3).toFixed(2)}s'></span>`;
                  }
                }
                if (snowy || hail) {
                  const n = hail ? 30 : 22;
                  for (let i = 0; i < n; i++) {
                    const d = hail ? 0.6+((i*5)%4)*0.08 : 3.2+((i*5)%4)*0.5;
                    h += `<span class='${hail?'wx-hail':'wx-flake'}' style='left:${(i*41+3)%100}%;animation-duration:${d.toFixed(2)}s;animation-delay:-${((i*0.29)%3).toFixed(2)}s'></span>`;
                  }
                }
                if (fog) {
                  for (let i = 0; i < 4; i++) {
                    h += `<div class='wx-fog' style='top:${18+i*18}%;animation-duration:${10+i*3}s'></div>`;
                  }
                }
                if (breezy) {
                  const wd = clamp(120/(wind+10), 0.7, 3).toFixed(2);
                  for (let i = 0; i < 5; i++) {
                    h += `<span class='wx-wind' style='top:${22+i*13}%;animation-duration:${wd}s;animation-delay:-${(i*0.4).toFixed(1)}s'></span>`;
                  }
                }
                if (storm) {
                  const heat = !isNaN(tv) && tv >= 25 && wind < 35;
                  h += `<div class='wx-flash${heat?' wx-flash-soft':''}'></div>`;
                  if (heat) {
                    for (let i = 0; i < 3; i++) {
                      h += `<div class='wx-sheet' style='left:${18+i*30}%;top:${8+i*7}%;animation-delay:${(i*1.3+0.4).toFixed(2)}s'></div>`;
                    }
                  } else {
                    h += `<div class='wx-ground'></div>`; const xs = [26, 60];
                    for (let i = 0; i < 2; i++) {
                      h += `<svg class='wx-bolt' viewBox='0 0 60 180' preserveAspectRatio='none' style='left:${xs[i]}%;animation-delay:${(i*2.1+0.6).toFixed(2)}s'><polyline points='34,2 22,54 40,60 18,116 42,122 26,178' fill='none' stroke='#eaf2ff' stroke-width='3.2' stroke-linejoin='round' stroke-linecap='round'/></svg>`; h += `<div class='wx-strike' style='left:${xs[i]}%;animation-delay:${(i*2.1+0.6).toFixed(2)}s'></div>`;
                    }
                  }
                }
                return `<div class='wx-scene'>${h}</div>`;
                ]]]
            entity: weather.forecast_maison
            extra_styles: |-
              .wx-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
              .wx-sun{position:absolute;right:12%;top:12%;width:70px;height:70px;z-index:1;}
              .wx-core{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff7c2 0%,#ffd84a 55%,#ffb300 100%);animation:wxpulse 3.5s ease-in-out infinite;}
              .wx-rays{position:absolute;inset:-14px;border-radius:50%;background:repeating-conic-gradient(rgba(255,222,100,.6) 0deg 7deg,transparent 7deg 30deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,#000 62%,transparent 74%);mask:radial-gradient(circle,transparent 38%,#000 40%,#000 62%,transparent 74%);animation:wxspin 20s linear infinite;}
              .wx-moon{position:absolute;right:15%;top:14%;width:44px;height:44px;border-radius:50%;box-shadow:12px -5px 0 0 #f3efc8;transform:rotate(-12deg);filter:drop-shadow(0 0 10px rgba(243,239,200,.6));z-index:1;}
              .wx-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.3;animation:wxtwinkle 3s ease-in-out infinite;}
              .wx-cloud{position:absolute;left:-35%;width:6em;height:2em;background:rgba(255,255,255,.92);border-radius:2em;animation:wxdrift linear infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));z-index:2;}
              .wx-cloud::before{content:'';position:absolute;width:2.6em;height:2.6em;left:.9em;top:-1.3em;background:inherit;border-radius:50%;}
              .wx-cloud::after{content:'';position:absolute;width:3.3em;height:3.3em;left:2.3em;top:-1.8em;background:inherit;border-radius:50%;}
              .wx-cloud.wx-dark{background:rgba(196,205,218,.95);}
              .wx-drop{position:absolute;top:-25px;width:2px;height:18px;border-radius:0 0 2px 2px;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(200,225,255,.95));animation:wxfall linear infinite;z-index:3;}
              .wx-flake{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;animation:wxsnow linear infinite;z-index:3;}
              .wx-hail{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#eef6ff;animation:wxfall linear infinite;z-index:3;}
              .wx-fog{position:absolute;left:-50%;width:200%;height:24px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);filter:blur(5px);animation:wxfog ease-in-out infinite alternate;z-index:3;}
              .wx-wind{position:absolute;left:-35%;width:35%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:wxwind linear infinite;z-index:3;}
              .wx-flash{position:absolute;inset:0;animation:wxflash 7s linear infinite;z-index:4;}
              .wx-temp{font-size:40px;font-weight:300;line-height:1;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.45);}
              .wx-temp span{font-size:16px;margin-left:3px;vertical-align:top;}
              .wx-cond{font-size:14px;font-weight:600;color:#fff;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.55);}
              .wx-meta{font-size:12px;color:rgba(255,255,255,.92);margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.55);}
              @keyframes wxspin{to{transform:rotate(360deg);}}
              @keyframes wxpulse{0%,100%{transform:scale(1);box-shadow:0 0 20px 6px rgba(255,205,50,.55);}50%{transform:scale(1.06);box-shadow:0 0 36px 14px rgba(255,215,70,.85);}}
              @keyframes wxtwinkle{0%,100%{opacity:.25;}50%{opacity:1;}}
              @keyframes wxdrift{from{left:-35%;}to{left:105%;}}
              @keyframes wxfall{from{transform:translate3d(0,0,0);}to{transform:translate3d(-14px,230px,0);}}
              @keyframes wxsnow{0%{transform:translate3d(0,0,0);}50%{transform:translate3d(10px,110px,0);}100%{transform:translate3d(-6px,230px,0);}}
              @keyframes wxfog{from{transform:translateX(-12%);}to{transform:translateX(12%);}}
              @keyframes wxwind{from{left:-35%;}to{left:110%;}}
              @keyframes wxflash{0%,86%,100%{background:rgba(255,255,255,0);}87%{background:rgba(255,255,255,.6);}88%{background:rgba(255,255,255,0);}90%{background:rgba(255,255,255,.45);}91%{background:rgba(255,255,255,0);}}
